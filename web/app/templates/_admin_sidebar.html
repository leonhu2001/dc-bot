{% set _p = request.url.path %}

<aside class="mw-r5-sidebar">

    <div class="mw-r5-brand">
        <small>MOWAN OPERATIONS</small>
        <strong>魔丸娛樂</strong>
    </div>

    <nav class="mw-r5-nav">
        <a
            class="{% if _p == '/admin' or _p == '/admin/search' or _p.startswith('/admin/order-workspace') %}active{% endif %}"
            href="/admin"
        >
            營運總覽
        </a>

        <a
            class="{% if _p.startswith('/admin/staff-center') or _p.startswith('/admin/staff') %}active{% endif %}"
            href="/admin/staff-center"
        >
            人員中心
        </a>

        <a
            class="{% if _p == '/admin/customer-center' or _p.startswith('/admin/customers') or _p.startswith('/admin/wallets') or _p.startswith('/admin/reviews') or _p.startswith('/admin/search/customer/') %}active{% endif %}"
            href="/admin/customer-center"
        >
            客戶中心
        </a>

        <a
            class="{% if _p.startswith('/admin/customer-center/vip') %}active{% endif %}"
            href="/admin/customer-center/vip"
        >
            ↳ VIP 管理
        </a>

        <a
            class="{% if _p.startswith('/admin/finance-center') or _p.startswith('/admin/payment-reviews') or _p.startswith('/admin/topups') or _p.startswith('/admin/payout') or _p.startswith('/admin/accounting-reconciliation') %}active{% endif %}"
            href="/admin/finance-center"
        >
            財務中心
        </a>

        <a
            class="{% if _p.startswith('/admin/support-center') or _p.startswith('/admin/tickets') or _p.startswith('/admin/support-calls') or _p.startswith('/admin/ai-support-knowledge') %}active{% endif %}"
            href="/admin/support-center"
        >
            客服中心
        </a>

        <a
            class="{% if _p.startswith('/admin/order-rules') %}active{% endif %}"
            href="/admin/order-rules"
        >
            商品與規則
        </a>

        {% if user and user.is_manager %}
        <a
            class="{% if _p.startswith('/admin/ai-operations') %}active{% endif %}"
            href="/admin/ai-operations"
        >
            AI 營運分析
        </a>

        <a
            class="{% if _p.startswith('/admin/marketing') %}active{% endif %}"
            href="/admin/marketing"
        >
            行銷漏斗
        </a>
        {% endif %}

        <a
            class="{% if _p.startswith('/admin/anomalies') or _p.startswith('/admin/system') or _p.startswith('/admin/audit') %}active{% endif %}"
            href="/admin/anomalies"
        >
            系統維運
        </a>

        <a href="/">
            返回官網
        </a>

    </nav>

</aside>
