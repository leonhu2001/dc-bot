{% extends "layout.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
    {% if not user %}
        <script nonce="{{ request.state.csp_nonce }}">
            (() => {
                const nextPath = `${window.location.pathname}${window.location.search}`;
                window.location.replace(`/auth/discord/login?next=${encodeURIComponent(nextPath)}`);
            })();
        </script>
    {% endif %}

    <div class="panel">
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>

        <div class="actions">
            {% if user %}
                <a class="button" href="/">回首頁</a>
                <a class="button secondary" href="/auth/logout">登出</a>
            {% else %}
                <a class="button" href="/auth/discord/login">Discord 登入</a>
            {% endif %}
        </div>
    </div>
{% endblock %}
