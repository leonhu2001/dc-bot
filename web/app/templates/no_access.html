{% extends "layout.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
    {% if not user %}
        <script src="/static/js/pages/no_access_login_redirect.js?v=20261019"></script>
    {% endif %}

    <div class="panel">
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>

        <div class="actions">
            {% if user %}
                <a class="button" href="/">回首頁</a>
                <a class="button secondary" href="/auth/logout">登出</a>
            {% else %}
                <a class="button" href="/auth/discord/login">Discord 登入</a>
            {% endif %}
        </div>
    </div>
{% endblock %}
