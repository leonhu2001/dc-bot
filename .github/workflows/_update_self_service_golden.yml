name: Update self-service golden contract

on:
  push:
    branches:
      - refactor/self-service-dispatch-runtime-20261015

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-dispatch-runtime-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update golden fake and assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/golden/test_critical_runtime_flows.py')
          s = p.read_text(encoding='utf-8')
          if 'self.edits = []' not in s:
              old = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n'''
              new = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n        self.edits = []\n\n    async def edit(self, **kwargs):\n        self.edits.append(kwargs)\n        return self\n'''
              if old not in s:
                  raise SystemExit('FakeMessage anchor not found')
              s = s.replace(old, new, 1)
          if 'self.last_message = None' not in s:
              old = '''        self.mention = f"<#{channel_id}>"\n        self.sent = []\n\n    async def send(self, **kwargs):\n        self.sent.append(kwargs)\n        return _FakeMessage(7001, self.id)\n'''
              new = '''        self.mention = f"<#{channel_id}>"\n        self.sent = []\n        self.last_message = None\n\n    async def send(self, **kwargs):\n        self.sent.append(kwargs)\n        self.last_message = _FakeMessage(7001, self.id)\n        return self.last_message\n'''
              if old not in s:
                  raise SystemExit('FakeTextChannel anchor not found')
              s = s.replace(old, new, 1)
          marker = '''    assert len(dispatch_channel.sent) == 1\n    assert len(web_upserts) == 1\n'''
          if 'dispatch_channel.sent[0]["view"] is None' not in s:
              replacement = '''    assert len(dispatch_channel.sent) == 1\n    assert dispatch_channel.sent[0]["view"] is None\n    assert dispatch_channel.last_message is not None\n    assert len(dispatch_channel.last_message.edits) == 1\n    assert dispatch_channel.last_message.edits[0]["view"] is not None\n    assert len(web_upserts) == 1\n'''
              if marker not in s:
                  raise SystemExit('assertion anchor not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit golden contract
        shell: bash
        run: |
          if git diff --quiet -- tests/golden/test_critical_runtime_flows.py; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/test_critical_runtime_flows.py
          git commit -m "Update Golden Flow for provisional dispatch unlock"
          git push origin HEAD:refactor/self-service-dispatch-runtime-20261015
