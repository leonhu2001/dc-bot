name: Canonical price cleanup

on:
  push:
    paths:
      - .github/workflows/canonical_price_cleanup_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write latest approved prices directly into source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('services/order_rules.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '_add_game_service_rule(category="lol", key="lol_grandmaster_ranked", label="英雄聯盟｜宗師陪｜積分", pricing_type="game", price=350, unit_label="局", allowed_game_roles=("lol_grandmaster", "lol_elite"), required_game_roles=LOL_GAME_ROLE)',
                  '_add_game_service_rule(category="lol", key="lol_grandmaster_ranked", label="英雄聯盟｜宗師陪｜積分", pricing_type="game", price=300, unit_label="局", allowed_game_roles=("lol_grandmaster", "lol_elite"), required_game_roles=LOL_GAME_ROLE)',
              ),
              (
                  '        "apex_master",\n        "大師陪",\n        500,\n        550,',
                  '        "apex_master",\n        "大師陪",\n        480,\n        530,',
              ),
              (
                  '        "apex_predator",\n        "頂獵陪",\n        600,\n        650,',
                  '        "apex_predator",\n        "頂獵陪",\n        580,\n        630,',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one direct price source match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_companion_count_finish_20261028.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'test_latest_approved_game_prices_are_direct_source_values' not in tests:
              lines = [
                  '',
                  '',
                  'def test_latest_approved_game_prices_are_direct_source_values() -> None:',
                  '    expected = {',
                  '        "valorant_entertain_ng": 300,',
                  '        "valorant_entertain_ranked": 250,',
                  '        "valorant_ascendant_ng": 330,',
                  '        "valorant_ascendant_ranked": 290,',
                  '        "valorant_immortal_ng": 350,',
                  '        "valorant_immortal_ranked": 330,',
                  '        "valorant_radiant_ng": 380,',
                  '        "valorant_radiant_ranked": 370,',
                  '        "lol_master_ng": 340,',
                  '        "lol_master_ranked": 300,',
                  '        "lol_grandmaster_ng": 360,',
                  '        "lol_grandmaster_ranked": 300,',
                  '        "lol_elite_ng": 400,',
                  '        "lol_elite_ranked": 400,',
                  '        "apex_entertain_ng": 300,',
                  '        "apex_entertain_ranked": 350,',
                  '        "apex_diamond_ng": 400,',
                  '        "apex_diamond_ranked": 450,',
                  '        "apex_master_ng": 480,',
                  '        "apex_master_ranked": 530,',
                  '        "apex_predator_ng": 580,',
                  '        "apex_predator_ranked": 630,',
                  '    }',
                  '    for key, price in expected.items():',
                  '        assert order_rules.get_base_rule(key).price == price, key',
                  '',
              ]
              test_path.write_text(tests + '\n'.join(lines), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_rules.py tests/test_companion_count_finish_20261028.py
          git commit -m "Keep latest approved game prices in canonical rules"
          git push origin HEAD:main
