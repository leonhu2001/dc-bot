name: Core rule refactor one-shot

on:
  push:
    paths:
      - '.github/core_rules_refactor.trigger'

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: 'false'
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-core-refactor.db
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt
      - name: Apply direct core refactor
        run: python scripts/core_rules_refactor_20261101.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q services tools tests
      - name: Targeted regressions
        run: python -m pytest -q tests/test_aw_collision_catalog.py tests/test_aw_collision_business_policy.py tests/test_companion_count_finish_20261028.py tests/test_game_service_rules.py tests/test_order_rules_audit.py
      - name: Full regression
        run: python -m pytest -q tests --ignore=tests/e2e
      - name: Commit validated source
        run: |
          git config user.name "leonhu2001"
          git config user.email "leonhu2001@gmail.com"
          git add services tools tests
          git diff --cached --check
          git commit -m "refactor: move receiver rules into canonical core"
          git push origin HEAD:main
