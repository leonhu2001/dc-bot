name: Temporary explicit startup scope correction

on:
  push:
    branches:
      - refactor/order-runtime-explicit-startup-20261018

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/order-runtime-explicit-startup-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore explicit binder semantics and update stale boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/order_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          explicit, legacy = runtime.split('def configure_order_runtime(namespace: Mapping[str, Any])', 1)
          if explicit.count('    global _CONFIGURED\n') != 1:
              raise SystemExit('expected one explicit _CONFIGURED global declaration')
          if explicit.count('    _CONFIGURED = True\n') != 1:
              raise SystemExit('expected one explicit _CONFIGURED assignment')
          explicit = explicit.replace('    global _CONFIGURED\n', '', 1)
          explicit = explicit.replace('    _CONFIGURED = True\n', '', 1)
          runtime_path.write_text(
              explicit + 'def configure_order_runtime(namespace: Mapping[str, Any])' + legacy,
              encoding='utf-8',
          )

          boundary_path = Path('tests/test_runtime_extraction_boundaries.py')
          boundary = boundary_path.read_text(encoding='utf-8')
          old = '    order_bind = bot_source.index("configure_order_runtime(globals())")\n'
          new = '    order_bind = bot_source.index("configure_order_runtime_explicit(")\n'
          if boundary.count(old) != 1:
              raise SystemExit('stale startup boundary changed unexpectedly')
          boundary = boundary.replace(old, new, 1)
          boundary_path.write_text(boundary, encoding='utf-8')
          PY
      - name: Compile corrected files
        run: python -m py_compile services/order_runtime.py tests/test_runtime_extraction_boundaries.py
      - name: Static scope guard
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path('bot.py').read_text(encoding='utf-8')
          runtime = Path('services/order_runtime.py').read_text(encoding='utf-8')
          explicit = runtime.split('def configure_order_runtime_explicit(', 1)[1].split('def configure_order_runtime(', 1)[0]
          assert 'configure_order_runtime(globals())' not in bot
          assert 'configure_order_runtime_explicit(' in bot
          assert 'global _CONFIGURED' not in explicit
          assert '_CONFIGURED = True' not in explicit
          assert 'def configure_order_runtime(namespace: Mapping[str, Any])' in runtime
          print('scope correction guard passed')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp_fix_order_runtime_explicit_scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_runtime.py tests/test_runtime_extraction_boundaries.py
          git commit -m "Keep explicit order startup behavior-only"
          git push origin HEAD:refactor/order-runtime-explicit-startup-20261018
