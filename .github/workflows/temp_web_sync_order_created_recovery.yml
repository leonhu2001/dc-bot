name: Temporary Web Sync Order Created Recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v7
        with:
          ref: refactor/web-sync-order-created-20261018

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply extraction with both globals fallbacks removed
        run: |
          python - <<'PY'
          import textwrap
          from pathlib import Path

          workflow_path = Path(".github/workflows/temp_web_sync_order_created.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])

          guard = '''if "globals()" in tail:
              raise SystemExit("order-created pipeline still contains globals()")
          '''
          replacement = '''seed_amount_fallback = """    data[\"amount_text\"] = (
              _format_plain_amount(
                  amount
              )
              if \"_format_plain_amount\"
              in globals()
              else format_t_amount(
                  amount
              )
          )
          """
          if tail.count(seed_amount_fallback) != 1:
              raise SystemExit(
                  f"expected one seed amount fallback, found {tail.count(seed_amount_fallback)}"
              )
          tail = tail.replace(
              seed_amount_fallback,
              '    data[\"amount_text\"] = _format_plain_amount(amount)\\n',
              1,
          )
          if "globals()" in tail:
              raise SystemExit("order-created pipeline still contains globals()")
          '''
          if guard not in script:
              raise SystemExit("original globals guard not found")
          script = script.replace(guard, textwrap.dedent(replacement), 1)
          exec(compile(script, "order_created_extraction", "exec"), {})
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile extracted modules
        run: |
          python -m compileall -q \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Run targeted extraction tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Commit extraction and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/temp_web_sync_order_created.yml \
            .github/workflows/temp_web_sync_order_created_recovery.yml
          git add \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py
          git commit -m "Extract Web Sync order-created pipeline"
          git push origin HEAD:refactor/web-sync-order-created-20261018
