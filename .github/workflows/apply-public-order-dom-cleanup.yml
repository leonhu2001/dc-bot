name: Apply canonical public order DOM cleanup

on:
  push:
    branches:
      - fix/public-order-internal-dom

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-order-internal-dom
          fetch-depth: 0
      - name: Apply deterministic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def remove_balanced_div(text: str, marker: str) -> str:
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing div marker: {marker}')
              token_re = re.compile(r'<div\b[^>]*>|</div>', re.I)
              depth = 0
              end = None
              for match in token_re.finditer(text, start):
                  if match.group(0).lower().startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = match.end()
                          break
              if end is None:
                  raise SystemExit(f'unbalanced div marker: {marker}')
              while end < len(text) and text[end] in ' \t':
                  end += 1
              if text[end:end+2] == '\r\n':
                  end += 2
              elif end < len(text) and text[end] == '\n':
                  end += 1
              return text[:start] + text[end:]

          template_path = Path('web/app/templates/order_catalog.html')
          template = template_path.read_text(encoding='utf-8')
          template = remove_balanced_div(template, '        <div class="order3-info">')
          template = remove_balanced_div(template, '        <div class="order3-debug">')

          old_card = '''                    <p>\n                        {{ group.description }}\n                    </p>'''
          new_card = '''                    {% if group.description %}\n                        <p>\n                            {{ group.description }}\n                        </p>\n                    {% endif %}'''
          if template.count(old_card) != 1:
              raise SystemExit('catalog description block anchor mismatch')
          template = template.replace(old_card, new_card, 1)

          if template.count('/static/js/mw_order.js?v=3a-apex1') != 1:
              raise SystemExit('mw_order.js cache version anchor mismatch')
          template = template.replace(
              '/static/js/mw_order.js?v=3a-apex1',
              '/static/js/mw_order.js?v=3a-apex2',
              1,
          )
          template_path.write_text(template, encoding='utf-8')

          js_path = Path('web/app/static/js/mw_order.js')
          js = js_path.read_text(encoding='utf-8')
          blocks = [
              '''    const rolesEl =\n        document.getElementById(\n            "mw-roles"\n        );\n\n''',
              '''    const requiredStaffEl =\n        document.getElementById(\n            "mw-required-staff"\n        );\n\n''',
              '''    const specifyEl =\n        document.getElementById(\n            "mw-specify"\n        );\n\n''',
              '''    const ruleKeyEl =\n        document.getElementById(\n            "mw-rule-key"\n        );\n\n''',
              '''        rolesEl.textContent =\n            (\n                activeVariant.allowed_roles\n                || []\n            ).join(" / ")\n            || "—";\n\n\n''',
              '''        requiredStaffEl.textContent =\n            activeVariant.required_staff\n            || "—";\n\n\n''',
              '''        specifyEl.textContent =\n            activeVariant.allow_specify\n                ? "可指定"\n                : "不開放";\n\n\n''',
              '''        ruleKeyEl.textContent =\n            activeVariant.rule_key;\n\n\n''',
          ]
          for block in blocks:
              if js.count(block) != 1:
                  raise SystemExit(f'mw_order.js anchor mismatch: {block[:70]!r}')
              js = js.replace(block, '', 1)
          js_path.write_text(js, encoding='utf-8')

          test_path = Path('tests/test_public_order_dom_contract.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_public_order_dialog_does_not_render_internal_dispatch_fields():\n    template = Path("web/app/templates/order_catalog.html").read_text(encoding="utf-8")\n    script = Path("web/app/static/js/mw_order.js").read_text(encoding="utf-8")\n\n    internal_ids = (\n        "mw-roles",\n        "mw-required-staff",\n        "mw-specify",\n        "mw-rule-key",\n    )\n\n    for element_id in internal_ids:\n        assert f'id="{element_id}"' not in template\n        assert f'getElementById(\\n            "{element_id}"' not in script\n\n    assert 'class="order3-info"' not in template\n    assert 'class="order3-debug"' not in template\n    assert "可接人員" not in template\n    assert "需要人員" not in template\n\n\ndef test_public_order_catalog_has_no_generic_description_fallback():\n    source = Path("web/app/services/order_groups.py").read_text(encoding="utf-8")\n    assert '"選擇適合你的方案。"' not in source\n\n\ndef test_public_catalog_only_renders_description_when_present():\n    template = Path("web/app/templates/order_catalog.html").read_text(encoding="utf-8")\n    assert "{% if group.description %}" in template\n''', encoding='utf-8')
          PY
      - name: Remove one-shot migration workflow
        run: rm .github/workflows/apply-public-order-dom-cleanup.yml
      - name: Commit canonical cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/templates/order_catalog.html web/app/static/js/mw_order.js tests/test_public_order_dom_contract.py .github/workflows/apply-public-order-dom-cleanup.yml
          git commit -m "Remove internal dispatch DOM from public ordering"
          git push origin HEAD:fix/public-order-internal-dom
