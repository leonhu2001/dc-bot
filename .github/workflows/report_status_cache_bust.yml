name: Report status cache bust

on:
  push:
    branches:
      - ui/report-status-badges

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump layout stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/app/templates/layout.html')
          source = path.read_text(encoding='utf-8')
          old = '/static/css/pages/layout_inline_1.css?v=20261013'
          new = '/static/css/pages/layout_inline_1.css?v=20261013-report-status-1'
          if old not in source:
              raise SystemExit('layout css version anchor not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/report_status_cache_bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/templates/layout.html .github/workflows/report_status_cache_bust.yml
          git commit -m "Bust cache for report status badge styles"
          git push origin HEAD:ui/report-status-badges
