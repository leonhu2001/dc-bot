name: Temporary loyalty branch patcher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/member-benefits-loyalty-portal' && !contains(github.event.pull_request.head.label, '[loyalty-patch-applied]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/member-benefits-loyalty-portal
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python tools/apply_loyalty_portal_patch_v2.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Implement loyalty benefits and member portal [loyalty-patch-applied]"
          git push origin HEAD:feat/member-benefits-loyalty-portal
