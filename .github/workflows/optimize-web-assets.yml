name: Optimize web assets

on:
  push:
    branches:
      - refactor/phase2-runtime-assets-20261013
    paths:
      - tools/optimize_web_assets.py
      - .github/workflows/optimize-web-assets.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: refactor/phase2-runtime-assets-20261013

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"

      - name: Convert and verify assets
        run: python tools/optimize_web_assets.py

      - name: Commit optimized assets
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/app/static/img/home_hero_mascot_final.webp \
            web/app/static/img/staff_profile_bg_gothic_hall.webp \
            web/app/static/img/server_logo.webp
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "Optimize large web image assets [asset-opt]"
          git push origin HEAD:refactor/phase2-runtime-assets-20261013
