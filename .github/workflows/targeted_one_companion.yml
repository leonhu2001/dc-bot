name: Targeted One Companion Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted_one_companion.yml'
      - 'services/one_companion_one_guard_catalog.py'
      - 'services/one_companion_one_guard_payout.py'
      - 'services/vip_timer_roster_payout.py'
      - 'services/vip_timer_select_flow.py'
      - 'services/vip_timer_selector_order_v2.py'
      - 'tests/test_one_companion_one_guard_catalog.py'
      - 'tests/test_one_companion_one_guard_payout.py'
      - 'tests/test_vip_timer_select_flow.py'
      - 'web/app/services/order_service.py'

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-targeted.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/test_one_companion_one_guard_catalog.py \
            tests/test_one_companion_one_guard_payout.py \
            tests/test_vip_timer_select_flow.py
