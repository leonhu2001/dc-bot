name: Phase2 finalize

on:
  push:
    branches:
      - refactor/phase2-runtime-assets-20261013
    paths:
      - tools/phase2_finalize.py
      - .github/workflows/phase2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase2-runtime-assets-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          python -m pip install "Pillow>=11,<13"
      - name: Finalize phase2 source and assets
        run: python tools/phase2_finalize.py
      - name: Compile and audit final tree
        run: |
          python -m compileall -q bot.py cogs core services shared views web/app tools scripts
          python tools/audit_templates.py
      - name: Commit final phase2 tree
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalizer changes to commit"
            exit 0
          fi
          git commit -m "Finalize phase2 runtime and asset cleanup"
          git pull --rebase origin refactor/phase2-runtime-assets-20261013
          git push origin HEAD:refactor/phase2-runtime-assets-20261013
