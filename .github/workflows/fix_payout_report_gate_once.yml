name: Fix payout report gate
on:
  push:
    branches: [fix/payout-report-gate-20261014]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payout-report-gate-20261014
          fetch-depth: 0
      - name: Apply repair
        run: python tools/one_shot_payout_report_gate.py
      - name: Compile changed Python
        run: python -m compileall -q web/app/services/payout_report_gate.py web/app/routers/admin_payout_summary.py tests/test_payout_report_gate.py
      - name: Commit repair
        run: |
          rm -f .github/workflows/fix_payout_report_gate_once.yml tools/one_shot_payout_report_gate.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git diff --cached --check
          git commit -m "Lock salary payouts until order reports are approved"
          git push origin HEAD:fix/payout-report-gate-20261014
