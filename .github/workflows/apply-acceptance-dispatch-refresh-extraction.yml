name: Apply acceptance dispatch refresh extraction

on:
  push:
    branches:
      - refactor/acceptance-dispatch-refresh-20261017

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/acceptance-dispatch-refresh-20261017
          fetch-depth: 0

      - name: Extract acceptance dispatch refresh orchestration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/acceptance/runtime.py')
          source = runtime_path.read_text(encoding='utf-8')
          start_marker = 'def _apply_acceptance_state_to_claim_data(claim_data: dict, state) -> None:'
          if source.count(start_marker) != 1:
              raise SystemExit('acceptance extraction anchor mismatch')

          start = source.index(start_marker)
          moved = source[start:].rstrip() + '\n'
          parent = source[:start].rstrip() + '\n'

          import_anchor = 'from services.acceptance.payment_panel import (\n'
          if parent.count(import_anchor) != 1:
              raise SystemExit('acceptance import anchor mismatch')

          dispatch_import = '''from services.acceptance.dispatch_refresh import (\n    _apply_acceptance_state_to_claim_data,\n    _build_receiver_text_from_claim_data,\n    configure_acceptance_dispatch_refresh,\n    refresh_acceptance_dispatch_from_web_order,\n    send_acceptance_payment_panel_if_ready,\n)\n'''
          parent = parent.replace(import_anchor, dispatch_import + import_anchor, 1)

          bind_anchor = '''    SELF_SERVICE_ORDER_SELECTIONS = order_selections\n\n    configure_acceptance_sync_worker('''
          if parent.count(bind_anchor) != 1:
              raise SystemExit('acceptance config bind anchor mismatch')
          bind_replacement = '''    SELF_SERVICE_ORDER_SELECTIONS = order_selections\n\n    configure_acceptance_dispatch_refresh(\n        dispatch_channel_id=DISPATCH_CHANNEL_ID,\n        order_claims=ORDER_CLAIMS,\n        payment_method_view_type=PaymentMethodView,\n        order_selections=SELF_SERVICE_ORDER_SELECTIONS,\n    )\n\n    configure_acceptance_sync_worker('''
          parent = parent.replace(bind_anchor, bind_replacement, 1)
          runtime_path.write_text(parent, encoding='utf-8')

          header = '''from __future__ import annotations\n\nimport discord\n\nfrom core.database import remember_claim_data, remember_order_data, save_bot_data\nfrom services.acceptance.payment_panel import (\n    acceptance_staff_display_text,\n    ensure_acceptance_payment_panel,\n    invalidate_acceptance_payment_panel,\n)\nfrom services.acceptance.ticket_access import sync_acceptance_ticket_access_from_state\nfrom services.order_dispatch_runtime import DispatchClaimView\nfrom services.orders import (\n    ORDER_CATEGORY_LABELS,\n    _to_int,\n    build_self_service_order_embed,\n)\nfrom services.self_service_financials import (\n    _format_plain_amount,\n    _price_int,\n    _price_snapshot,\n    add_self_service_financial_breakdown_fields,\n)\n\n\n_CONFIGURED = False\nDISPATCH_CHANNEL_ID = 0\nORDER_CLAIMS: dict = {}\nPaymentMethodView = None\nSELF_SERVICE_ORDER_SELECTIONS: dict = {}\n\n\ndef configure_acceptance_dispatch_refresh(\n    *,\n    dispatch_channel_id: int,\n    order_claims: dict,\n    payment_method_view_type,\n    order_selections: dict,\n) -> None:\n    \"\"\"Bind only the state needed to sync acceptance into Discord surfaces.\"\"\"\n    global _CONFIGURED\n    global DISPATCH_CHANNEL_ID, ORDER_CLAIMS, PaymentMethodView\n    global SELF_SERVICE_ORDER_SELECTIONS\n\n    DISPATCH_CHANNEL_ID = int(dispatch_channel_id)\n    ORDER_CLAIMS = order_claims\n    PaymentMethodView = payment_method_view_type\n    SELF_SERVICE_ORDER_SELECTIONS = order_selections\n    _CONFIGURED = True\n\n\n'''
          new_path = Path('services/acceptance/dispatch_refresh.py')
          if new_path.exists():
              raise SystemExit('dispatch_refresh.py already exists')
          new_path.write_text(header + moved, encoding='utf-8')

          boundary_path = Path('tests/test_runtime_extraction_boundaries.py')
          boundary = boundary_path.read_text(encoding='utf-8')
          old_import = '''from services.acceptance import runtime as acceptance_runtime\nfrom services.acceptance import sync_worker as acceptance_sync_worker\n'''
          new_import = '''from services.acceptance import dispatch_refresh as acceptance_dispatch_refresh\nfrom services.acceptance import runtime as acceptance_runtime\nfrom services.acceptance import sync_worker as acceptance_sync_worker\n'''
          if boundary.count(old_import) != 1:
              raise SystemExit('acceptance boundary import anchor mismatch')
          boundary = boundary.replace(old_import, new_import, 1)

          old_source_assert = '''    assert "async def process_acceptance_sync_events_once" not in acceptance_source\n    assert "async def process_acceptance_sync_events_once" in acceptance_worker_source\n    assert "async def refresh_acceptance_dispatch_from_web_order" in acceptance_source\n'''
          new_source_assert = '''    acceptance_dispatch_source = Path(\n        "services/acceptance/dispatch_refresh.py"\n    ).read_text(encoding="utf-8")\n\n    assert "async def process_acceptance_sync_events_once" not in acceptance_source\n    assert "async def process_acceptance_sync_events_once" in acceptance_worker_source\n    assert "async def refresh_acceptance_dispatch_from_web_order" not in acceptance_source\n    assert "async def refresh_acceptance_dispatch_from_web_order" in acceptance_dispatch_source\n    assert "async def send_acceptance_payment_panel_if_ready" not in acceptance_source\n    assert "async def send_acceptance_payment_panel_if_ready" in acceptance_dispatch_source\n    assert "import bot" not in acceptance_dispatch_source\n    assert "from bot import" not in acceptance_dispatch_source\n    assert (\n        acceptance_runtime.refresh_acceptance_dispatch_from_web_order\n        is acceptance_dispatch_refresh.refresh_acceptance_dispatch_from_web_order\n    )\n'''
          if boundary.count(old_source_assert) != 1:
              raise SystemExit('acceptance boundary source anchor mismatch')
          boundary = boundary.replace(old_source_assert, new_source_assert, 1)
          boundary_path.write_text(boundary, encoding='utf-8')

          dependency_path = Path('tests/test_acceptance_runtime_dependencies.py')
          dependency = dependency_path.read_text(encoding='utf-8')
          old_deps_import = '''import services.acceptance.repair_runtime as repair_runtime\nimport services.acceptance.runtime as runtime\nimport services.acceptance.sync_worker as sync_worker\n'''
          new_deps_import = '''import services.acceptance.dispatch_refresh as dispatch_refresh\nimport services.acceptance.repair_runtime as repair_runtime\nimport services.acceptance.runtime as runtime\nimport services.acceptance.sync_worker as sync_worker\n'''
          if dependency.count(old_deps_import) != 1:
              raise SystemExit('acceptance dependency import anchor mismatch')
          dependency = dependency.replace(old_deps_import, new_deps_import, 1)

          config_assert_anchor = '''    assert runtime.SELF_SERVICE_ORDER_SELECTIONS is namespace["SELF_SERVICE_ORDER_SELECTIONS"]\n\n    sync_deps = sync_worker._DEPS\n'''
          config_assert_replacement = '''    assert runtime.SELF_SERVICE_ORDER_SELECTIONS is namespace["SELF_SERVICE_ORDER_SELECTIONS"]\n    assert dispatch_refresh._CONFIGURED is True\n    assert dispatch_refresh.DISPATCH_CHANNEL_ID == namespace["DISPATCH_CHANNEL_ID"]\n    assert dispatch_refresh.ORDER_CLAIMS is namespace["ORDER_CLAIMS"]\n    assert dispatch_refresh.PaymentMethodView is namespace["PaymentMethodView"]\n    assert (\n        dispatch_refresh.SELF_SERVICE_ORDER_SELECTIONS\n        is namespace["SELF_SERVICE_ORDER_SELECTIONS"]\n    )\n\n    sync_deps = sync_worker._DEPS\n'''
          if dependency.count(config_assert_anchor) != 1:
              raise SystemExit('acceptance dependency config assertion anchor mismatch')
          dependency = dependency.replace(config_assert_anchor, config_assert_replacement, 1)
          dependency_path.write_text(dependency, encoding='utf-8')

          contract_path = Path('tests/test_acceptance_dispatch_refresh_contract.py')
          contract_path.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom services.acceptance import dispatch_refresh\n\n\ndef test_dispatch_refresh_configurator_is_keyword_only():\n    signature = inspect.signature(dispatch_refresh.configure_acceptance_dispatch_refresh)\n    assert list(signature.parameters) == [\n        "dispatch_channel_id",\n        "order_claims",\n        "payment_method_view_type",\n        "order_selections",\n    ]\n    assert all(\n        parameter.kind is inspect.Parameter.KEYWORD_ONLY\n        for parameter in signature.parameters.values()\n    )\n\n\ndef test_dispatch_refresh_binds_only_canonical_shared_state(monkeypatch):\n    claims = {}\n    selections = {}\n    payment_view = object()\n\n    monkeypatch.setattr(dispatch_refresh, "_CONFIGURED", False)\n    dispatch_refresh.configure_acceptance_dispatch_refresh(\n        dispatch_channel_id=123,\n        order_claims=claims,\n        payment_method_view_type=payment_view,\n        order_selections=selections,\n    )\n\n    assert dispatch_refresh._CONFIGURED is True\n    assert dispatch_refresh.DISPATCH_CHANNEL_ID == 123\n    assert dispatch_refresh.ORDER_CLAIMS is claims\n    assert dispatch_refresh.PaymentMethodView is payment_view\n    assert dispatch_refresh.SELF_SERVICE_ORDER_SELECTIONS is selections\n''', encoding='utf-8')
          PY

      - name: Compile extracted acceptance modules before commit
        run: python -m py_compile services/acceptance/runtime.py services/acceptance/dispatch_refresh.py

      - name: Remove one-shot migration workflow
        run: rm .github/workflows/apply-acceptance-dispatch-refresh-extraction.yml

      - name: Commit canonical extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/acceptance/runtime.py services/acceptance/dispatch_refresh.py tests/test_runtime_extraction_boundaries.py tests/test_acceptance_runtime_dependencies.py tests/test_acceptance_dispatch_refresh_contract.py .github/workflows/apply-acceptance-dispatch-refresh-extraction.yml
          git commit -m "Extract acceptance dispatch refresh runtime"
          git push origin HEAD:refactor/acceptance-dispatch-refresh-20261017
