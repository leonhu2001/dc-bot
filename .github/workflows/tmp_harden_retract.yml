name: Temporary retract hardening

on:
  push:
    branches:
      - feature/retract-dispatch-edit-order-20261015

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-retract-harden.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retract-dispatch-edit-order-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply hardening patch
        run: python .github/tmp_harden_retract.py
      - name: Targeted validation
        run: |
          python -m py_compile services/self_service_runtime.py shared/web_order_sync.py bot.py tests/test_self_service_retract_dispatch.py
          python -m pytest -q tests/test_self_service_retract_dispatch.py tests/golden/test_critical_runtime_flows.py
      - name: Verify persistent button registration
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('bot.py').read_text(encoding='utf-8')
          assert 'SelfServiceDispatchedView,' in source
          assert 'bot.add_view(SelfServiceDispatchedView())' in source
          print('persistent retract view registration OK')
          PY
      - name: Commit hardening and remove temporary files
        run: |
          rm -f .github/workflows/tmp_harden_retract.yml .github/tmp_harden_retract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden retract dispatch cleanup"
          git push origin HEAD:feature/retract-dispatch-edit-order-20261015
