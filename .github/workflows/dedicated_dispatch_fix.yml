name: Dedicated dispatch fix
on:
  push:
    paths:
      - '.github/dedicated_dispatch_fix.trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/fix_dedicated_dispatch_notification_20261101.py
      - run: python -m pip install -r requirements.txt -r web/requirements-web.txt -r requirements-dev.txt
      - run: python -m compileall -q views services tests
      - run: python -m pytest -q tests/test_smart_dispatch.py tests/test_game_service_rules.py tests/test_aw_collision_business_policy.py
      - run: python -m pytest -q tests --ignore=tests/e2e
      - run: |
          git config user.name leonhu2001
          git config user.email leonhu2001@gmail.com
          git add views/smart_dispatch.py tests/test_smart_dispatch.py
          git commit -m 'fix: isolate dedicated receiver notifications'
          git push origin HEAD:main
