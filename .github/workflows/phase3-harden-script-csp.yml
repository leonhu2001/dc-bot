name: Phase3 harden script CSP

on:
  push:
    branches:
      - refactor/phase3-csp-runtime-20261013
    paths:
      - tools/phase3_harden_script_csp.py
      - .github/workflows/phase3-harden-script-csp.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase3-csp-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "jinja2==3.1.6"
      - name: Compile hardener
        run: python -m py_compile tools/phase3_harden_script_csp.py
      - name: Harden script CSP
        run: python tools/phase3_harden_script_csp.py
      - name: Validate generated source
        run: |
          python -m compileall -q web/app tools
          python tools/audit_templates.py
      - name: Commit hardened CSP tree
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden script CSP with request nonces"
          git pull --rebase origin refactor/phase3-csp-runtime-20261013
          git push origin HEAD:refactor/phase3-csp-runtime-20261013
