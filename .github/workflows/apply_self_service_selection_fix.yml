name: Apply self-service selection fix

on:
  push:
    branches:
      - fix/self-service-detail-quantity-state-implement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/self-service-detail-quantity-state-implement
      - name: Apply patch
        run: python scripts/apply_self_service_selection_fix.py
      - name: Commit generated fix
        run: |
          rm -f scripts/apply_self_service_selection_fix.py
          rm -f .github/workflows/apply_self_service_selection_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix self-service detail selection state"
          git push origin HEAD:fix/self-service-detail-quantity-state-implement
