name: Apply loyalty portal patch

on:
  push:
    branches:
      - feat/member-benefits-loyalty-portal

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loyalty-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/member-benefits-loyalty-portal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python tools/apply_loyalty_portal_patch.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Compile changed Python
        run: |
          python -m py_compile services/loyalty_benefits.py services/order_rules.py views/staff_profiles.py web/app/services/checkout_preview.py web/app/routers/site.py web/app/services/public_order_create.py services/self_service_runtime.py services/order_runtime.py services/web_sync/runtime.py cogs/member_portal.py

      - name: Run focused regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_loyalty_benefits.py \
            tests/test_loyalty_order_rules.py \
            tests/test_checkout_point_benefits.py \
            tests/test_staff_profile_archived_thread_refresh.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement loyalty benefits and member portal [loyalty-patch-applied]"
          git push origin HEAD:feat/member-benefits-loyalty-portal
