name: Phase8 admin workspace data extraction

on:
  push:
    branches:
      - refactor/phase8-admin-workspace-data-20261013
    paths:
      - tools/phase8_extract_admin_workspace_data.py
      - .github/workflows/phase8-admin-workspace-data.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase8-admin-workspace-data-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile extractor
        run: python -m py_compile tools/phase8_extract_admin_workspace_data.py
      - name: Extract admin workspace data service
        run: python tools/phase8_extract_admin_workspace_data.py
      - name: Validate admin workspace extraction
        run: |
          python -m compileall -q web/app tests
          python -m pytest -q tests/test_admin_order_workspace_data_boundary.py tests/test_architecture_growth_budget.py tests/test_admin_navigation.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit extracted admin workspace data service
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/routers/admin_order_workspace.py web/app/services/admin_order_workspace_data.py tests/test_admin_order_workspace_data_boundary.py tests/test_architecture_growth_budget.py
          git commit -m "Extract admin order workspace data service"
          git pull --rebase origin refactor/phase8-admin-workspace-data-20261013
          git push origin HEAD:refactor/phase8-admin-workspace-data-20261013
