name: Apply wallet lifecycle constant fix

on:
  push:
    branches:
      - fix/wallet-payment-lifecycle-constant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallet-payment-lifecycle-constant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: python tools/apply_wallet_lifecycle_constant_fix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Validate wallet payment scope
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile services/order_lifecycle_runtime.py services/order_payment_runtime.py services/order_runtime.py
          python -m pytest -q tests/test_payment_method_runtime_contract.py tests/test_wallet_order_amount_adjustment_flow.py
          python tools/runtime_import_smoke.py
      - name: Commit fix and remove one-shot tooling
        run: |
          rm .github/workflows/apply_wallet_lifecycle_constant_fix.yml tools/apply_wallet_lifecycle_constant_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix wallet payment receipt runtime scope"
          git push
