name: Apply admin status badge fix

on:
  push:
    branches:
      - fix/admin-order-status-badges
    paths:
      - tools/apply_admin_status_badge_fix.py
      - .github/workflows/apply_admin_status_badge_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-order-status-badges
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply template patch
        run: python tools/apply_admin_status_badge_fix.py
      - name: Validate focused status tests
        run: |
          python -m pip install 'pytest>=8.3,<9'
          PYTHONPATH=. python -m pytest -q tests/test_admin_order_status_badges.py
      - name: Commit source changes and remove one-shot tooling
        run: |
          rm tools/apply_admin_status_badge_fix.py
          rm .github/workflows/apply_admin_status_badge_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/templates/admin.html web/app/static/css/admin_order_status.css tests/test_admin_order_status_badges.py tools/apply_admin_status_badge_fix.py .github/workflows/apply_admin_status_badge_fix.yml
          git commit -m 'Polish admin order status badges'
          git push origin HEAD:fix/admin-order-status-badges
