name: Phase 11 dispatch inventory

on:
  push:
    branches:
      - refactor/phase11-order-dispatch-runtime-20261013
    paths:
      - tools/phase11_dispatch_inventory.py
      - .github/workflows/phase11-dispatch-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase11-order-dispatch-runtime-20261013
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inventory dispatch boundary
        run: python tools/phase11_dispatch_inventory.py
