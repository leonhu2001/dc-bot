name: Phase9 VIP voice runtime extraction

on:
  push:
    branches:
      - refactor/phase9-bot-runtime-20261013
    paths:
      - tools/phase9_extract_vip_voice_runtime.py
      - .github/workflows/phase9-vip-voice-runtime.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase9-bot-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile extractor
        run: python -m py_compile tools/phase9_extract_vip_voice_runtime.py
      - name: Extract VIP voice runtime
        run: python tools/phase9_extract_vip_voice_runtime.py
      - name: Validate VIP voice runtime
        run: |
          python -m compileall -q bot.py services tests
          python -m pytest -q tests/test_vip_voice_runtime_extraction.py tests/test_architecture_growth_budget.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit VIP voice runtime
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py services/vip_voice_runtime.py tests/test_vip_voice_runtime_extraction.py tests/test_architecture_growth_budget.py
          git commit -m "Extract VIP voice lifecycle runtime"
          git pull --rebase origin refactor/phase9-bot-runtime-20261013
          git push origin HEAD:refactor/phase9-bot-runtime-20261013
