name: Fix self-service Golden fake message

on:
  push:
    branches:
      - refactor/self-service-dispatch-runtime-20261015

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-dispatch-runtime-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add edit support to Golden fake message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/golden/test_critical_runtime_flows.py')
          s = p.read_text(encoding='utf-8')
          old = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n\n\nclass _FakeTextChannel:\n'''
          new = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n        self.edits = []\n\n    async def edit(self, **kwargs):\n        self.edits.append(kwargs)\n        return self\n\n\nclass _FakeTextChannel:\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'class _FakeMessage:' in s and 'async def edit(self, **kwargs):' in s.split('class _FakeTextChannel:', 1)[0]:
              print('Already updated')
          else:
              raise SystemExit('Exact FakeMessage anchor not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Golden fake fix
        shell: bash
        run: |
          if git diff --quiet -- tests/golden/test_critical_runtime_flows.py; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/test_critical_runtime_flows.py
          git commit -m "Fix Golden fake message edit support"
          git push origin HEAD:refactor/self-service-dispatch-runtime-20261015
