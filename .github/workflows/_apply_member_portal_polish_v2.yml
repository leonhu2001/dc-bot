name: Apply member portal polish v2

on:
  push:
    branches:
      - feature/member-portal-polish-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[member-portal-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/member-portal-polish-v2
          fetch-depth: 0

      - name: Apply patch
        run: python tools/_apply_member_portal_polish_v2.py

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/_apply_member_portal_polish_v2.py
          rm -f .github/workflows/_apply_member_portal_polish_v2.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish member portal, benefits, and payout rules [member-portal-patch-done]"
          git push origin HEAD:feature/member-portal-polish-v2
