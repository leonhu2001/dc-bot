name: Phase3 extract style attributes

on:
  push:
    branches:
      - refactor/phase3-csp-runtime-20261013
    paths:
      - tools/phase3_extract_style_attrs.py
      - .github/workflows/phase3-extract-style-attrs.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase3-csp-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "jinja2==3.1.6"
      - name: Compile extractor
        run: python -m py_compile tools/phase3_extract_style_attrs.py
      - name: Extract inline style attributes
        run: python tools/phase3_extract_style_attrs.py
      - name: Validate CSP-clean templates
        run: |
          python -m compileall -q web/app tools
          python tools/audit_templates.py
      - name: Commit style extraction
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate inline style attributes"
          git pull --rebase origin refactor/phase3-csp-runtime-20261013
          git push origin HEAD:refactor/phase3-csp-runtime-20261013
