name: Temporary acceptance import boundary

on:
  push:
    branches:
      - refactor/acceptance-import-boundary-20261015

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/acceptance-import-boundary-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow import-shadow protection
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/acceptance/runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          old = '''_MODULE_OWNED_RUNTIME_NAMES = frozenset(\n    {\n        "get_taipei_now_iso",\n        "remember_claim_data",\n        "remember_order_data",\n        "save_bot_data",\n    }\n)'''
          new = '''_MODULE_OWNED_RUNTIME_NAMES = frozenset(\n    {\n        "Any",\n        "Mapping",\n        "Path",\n        "asyncio",\n        "discord",\n        "get_taipei_now_iso",\n        "remember_claim_data",\n        "remember_order_data",\n        "save_bot_data",\n        "utc_now_naive",\n    }\n)'''
          if old not in text:
              raise SystemExit('expected acceptance owned-name block not found')
          runtime_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_acceptance_runtime_dependency_boundary.py')
          test_path.write_text('''import asyncio\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\nimport discord\n\nfrom core import database as core_database\nfrom core import time_utils\nfrom services.acceptance import runtime as acceptance_runtime\n\n\ndef test_acceptance_runtime_owns_canonical_persistence_and_time_dependencies():\n    assert acceptance_runtime.remember_claim_data is core_database.remember_claim_data\n    assert acceptance_runtime.remember_order_data is core_database.remember_order_data\n    assert acceptance_runtime.save_bot_data is core_database.save_bot_data\n    assert acceptance_runtime.get_taipei_now_iso is time_utils.get_taipei_now_iso\n    assert acceptance_runtime.utc_now_naive is time_utils.utc_now_naive\n\n\ndef test_acceptance_legacy_injection_cannot_shadow_module_owned_dependencies():\n    originals = {\n        "Any": Any,\n        "Mapping": Mapping,\n        "Path": Path,\n        "asyncio": asyncio,\n        "discord": discord,\n        "remember_claim_data": core_database.remember_claim_data,\n        "remember_order_data": core_database.remember_order_data,\n        "save_bot_data": core_database.save_bot_data,\n        "get_taipei_now_iso": time_utils.get_taipei_now_iso,\n        "utc_now_naive": time_utils.utc_now_naive,\n    }\n    marker = object()\n\n    acceptance_runtime.configure_acceptance_runtime(\n        {\n            **{name: object() for name in originals},\n            "_acceptance_runtime_boundary_marker": marker,\n        }\n    )\n\n    for name, original in originals.items():\n        assert getattr(acceptance_runtime, name) is original\n    assert acceptance_runtime._acceptance_runtime_boundary_marker is marker\n\n\ndef test_acceptance_owned_dependency_names_are_explicit():\n    assert acceptance_runtime._MODULE_OWNED_RUNTIME_NAMES == frozenset(\n        {\n            "Any",\n            "Mapping",\n            "Path",\n            "asyncio",\n            "discord",\n            "get_taipei_now_iso",\n            "remember_claim_data",\n            "remember_order_data",\n            "save_bot_data",\n            "utc_now_naive",\n        }\n    )\n''', encoding='utf-8')
          PY
          python -m pytest -q tests/test_acceptance_runtime_dependency_boundary.py tests/golden/test_critical_runtime_flows.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_acceptance_import_boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/acceptance/runtime.py tests/test_acceptance_runtime_dependency_boundary.py .github/workflows/tmp_acceptance_import_boundary.yml
          git commit -m "Protect acceptance module imports from legacy injection"
          git push origin HEAD:refactor/acceptance-import-boundary-20261015
