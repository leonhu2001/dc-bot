name: Temporary reward redeem refactor

on:
  push:
    branches:
      - ceiling-reward-redeem-cog

permissions:
  contents: write

jobs:
  patch-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ceiling-reward-redeem-cog
      - name: Extract reward redeem section from bot.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          import_marker = "\n\n# ========= 讀取 .env ========="
          import_block = '''\nfrom cogs.reward_redeem_commands import (\n    POINT_REDEEM_ITEMS,\n    POINT_REDEEM_ITEMS_BY_KEY,\n    RewardRedeemView,\n)\n'''
          if "from cogs.reward_redeem_commands import (" not in source:
              if import_marker not in source:
                  raise SystemExit("reward redeem import marker not found")
              source = source.replace(import_marker, import_block + import_marker, 1)

          start_marker = "# ========= 點數兌換面板 ========="
          end_marker = "# ========= end 點數兌換面板 ========="
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index(end_marker, start) + len(end_marker)
              source = (
                  source[:start]
                  + "# 點數兌換面板 / slash 指令已搬到 cogs/reward_redeem_commands.py"
                  + source[end:]
              )

          extension_marker = '                "cogs.reward_commands",\n'
          extension_line = '                "cogs.reward_redeem_commands",\n'
          if extension_line not in source:
              if extension_marker not in source:
                  raise SystemExit("extension loader marker not found")
              source = source.replace(
                  extension_marker,
                  extension_marker + extension_line,
                  1,
              )

          path.write_text(source, encoding="utf-8")
          PY
      - name: Commit transformed bot.py
        shell: bash
        run: |
          if git diff --quiet -- bot.py; then
            echo "bot.py already transformed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Move reward redeem panel out of bot entrypoint"
          git push origin HEAD:ceiling-reward-redeem-cog
