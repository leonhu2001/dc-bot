name: Phase8 wallet canonicalize

on:
  push:
    branches:
      - refactor/phase8-wallet-close-runtime-20261013
    paths:
      - tools/phase8_wallet_canonicalize.py
      - .github/workflows/phase8-wallet-canonicalize.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase8-wallet-close-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Canonicalize wallet persistence
        run: python tools/phase8_wallet_canonicalize.py
      - name: Verify wallet boundary
        run: |
          python -m compileall -q bot.py services tests
          python -m pytest -q \
            tests/test_wallet_service_canonicalization.py \
            tests/test_wallet_order_amount_adjustment_flow.py \
            tests/test_order_wallet_reconciliation.py \
            tests/test_repair_legacy_tip_wallet_references.py \
            tests/test_wallet_vip_and_targeted_alerts.py \
            tests/test_worker_tip_extraction.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py
      - name: Commit canonical wallet tree
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize wallet persistence service"
          git pull --rebase origin refactor/phase8-wallet-close-runtime-20261013
          git push origin HEAD:refactor/phase8-wallet-close-runtime-20261013
