name: One-shot final Web claim reconcile repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run final Web claim reconcile repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/fix_final_web_claim_reconcile_20261008.py

      - name: Validate
        run: |
          python -m compileall -q bot.py
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm scripts/fix_final_web_claim_reconcile_20261008.py
          git commit -m "Reconcile final Web orders with Bot claims"
          git push origin HEAD:main
