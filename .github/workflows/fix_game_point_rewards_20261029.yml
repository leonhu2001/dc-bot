name: Fix game point reward policy cleanup

on:
  push:
    paths:
      - .github/workflows/fix_game_point_rewards_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove stale game reward disable contracts
        shell: python
        run: |
          from pathlib import Path

          policy = Path('services/multi_seat_order_policy_20261028.py')
          text = policy.read_text(encoding='utf-8')
          old = '''def is_service_point_benefit_enabled(rule) -> bool:
              key = str(getattr(rule, "key", "") or "")
              if key in SERVICE_POINT_BENEFIT_RULE_OVERRIDES:
                  return bool(SERVICE_POINT_BENEFIT_RULE_OVERRIDES[key])
              return str(getattr(rule, "category", "") or "") not in {"lol", "valorant", "apex"}
          '''
          new = '''def is_service_point_benefit_enabled(rule) -> bool:
              key = str(getattr(rule, "key", "") or "")
              if key in SERVICE_POINT_BENEFIT_RULE_OVERRIDES:
                  return bool(SERVICE_POINT_BENEFIT_RULE_OVERRIDES[key])
              if not bool(getattr(rule, "point_benefits_allowed", False)):
                  return False
              category = str(getattr(rule, "category", "") or "")
              label = str(getattr(rule, "label", "") or "")
              if category == "steam" or category in {"fun", "delta_desktop_fun", "title"}:
                  return False
              if key.startswith("basic_trial_") or label.startswith("體驗單"):
                  return False
              return str(getattr(rule, "pricing_type", "") or "") in {"hourly", "game"}
          '''
          if old not in text:
              raise SystemExit('service point helper block not found')
          text = text.replace(old, new, 1)

          old_switch = '''def _install_service_point_rule_switches() -> None:
              from services.order_rules import ORDER_RULES

              for key, rule in ORDER_RULES.items():
                  category = str(getattr(rule, "category", "") or "")
                  if category in {"lol", "valorant", "apex"}:
                      SERVICE_POINT_BENEFIT_RULE_OVERRIDES[str(key)] = False
          '''
          new_switch = '''def _install_service_point_rule_switches() -> None:
              # Legacy installer kept for compatibility. Game service rewards are now
              # seat-aware and fully funded, so there is no category-wide disable list.
              SERVICE_POINT_BENEFIT_RULE_OVERRIDES.clear()
          '''
          if old_switch not in text:
              raise SystemExit('legacy service point switch block not found')
          policy.write_text(text.replace(old_switch, new_switch, 1), encoding='utf-8')

          tests = Path('tests/test_point_benefit_catalog_v2.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'def test_lol_rank_aram_variants_reuse_ng_price_but_only_service_points_are_disabled():',
              'def test_lol_rank_aram_variants_reuse_ng_price_and_support_service_points():',
              1,
          )
          text = text.replace('        assert is_service_point_benefit_enabled(aram_rule) is False', '        assert is_service_point_benefit_enabled(aram_rule) is True', 1)
          old_assert = '''        assert is_order_point_benefit_allowed_for_rule(
              aram_rule,
              "tech_single_service_small",
              {"player_count": 1, "quantity": 1},
          )[0] is False'''
          new_assert = '''        assert is_order_point_benefit_allowed_for_rule(
              aram_rule,
              "tech_single_service_small",
              {"player_count": 1, "quantity": 1},
          )[0] is True'''
          if old_assert not in text:
              raise SystemExit('LoL ARAM service point assertion not found')
          text = text.replace(old_assert, new_assert, 1)
          text = text.replace(
              'def test_lol_valorant_apex_pause_service_point_rewards_but_not_cash_points():',
              'def test_lol_valorant_apex_enable_service_point_rewards_and_cash_points():',
              1,
          )
          old_tail = '''        assert allowed is False
              assert "暫停" in reason'''
          new_tail = '''        assert allowed is True
              assert reason == ""'''
          if old_tail not in text:
              raise SystemExit('paused service reward assertion not found')
          tests.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/multi_seat_order_policy_20261028.py tests/test_point_benefit_catalog_v2.py
          git diff --cached --check
          git commit -m "Remove stale game point reward disable policy"
          git push origin HEAD:main
