name: Phase6 storage extraction

on:
  push:
    branches:
      - refactor/phase6-order-storage-runtime-20261013
    paths:
      - tools/phase6_extract_storage.py
      - .github/workflows/phase6-storage-inventory.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase6-order-storage-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Extract storage runtime
        run: python tools/phase6_extract_storage.py
      - name: Validate storage runtime
        run: |
          python -m compileall -q services tests
          python -m pytest -q tests/test_runtime_extraction_boundaries.py tests/test_architecture_growth_budget.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit storage runtime
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_runtime.py services/order_storage_runtime.py tests/test_runtime_extraction_boundaries.py tests/test_architecture_growth_budget.py
          git commit -m "Extract stored-order runtime"
          git pull --rebase origin refactor/phase6-order-storage-runtime-20261013
          git push origin HEAD:refactor/phase6-order-storage-runtime-20261013
