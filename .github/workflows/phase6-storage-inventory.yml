name: Phase6 storage inventory

on:
  push:
    branches:
      - refactor/phase6-order-storage-runtime-20261013
    paths:
      - tools/phase6_storage_inventory.py
      - .github/workflows/phase6-storage-inventory.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase6-order-storage-runtime-20261013
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/phase6_storage_inventory.py
