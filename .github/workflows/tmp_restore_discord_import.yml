name: Temporary Discord import startup hotfix

on:
  push:
    branches:
      - fix/restore-discord-import-20261017

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-discord-import-20261017
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore discord module import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('bot.py')
          source = bot.read_text(encoding='utf-8')
          if '\nimport discord\n' not in f'\n{source}':
              marker = 'import os\n'
              if marker not in source:
                  raise SystemExit('bot.py import marker not found')
              source = source.replace(marker, marker + 'import discord\n', 1)
              bot.write_text(source, encoding='utf-8')

          test = Path('tests/test_bot_discord_import_regression.py')
          test.write_text(
              '''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nBOT_PATH = ROOT / "bot.py"\n\n\ndef test_bot_imports_discord_module_before_using_discord_namespace():\n    tree = ast.parse(BOT_PATH.read_text(encoding="utf-8"))\n    imported_discord = any(\n        isinstance(node, ast.Import)\n        and any(alias.name == "discord" for alias in node.names)\n        for node in tree.body\n    )\n    assert imported_discord, "bot.py uses discord.* and must import the discord module"\n''',
              encoding='utf-8',
          )
          PY

      - name: Validate startup import fix
        shell: bash
        run: |
          python -m py_compile bot.py
          python - <<'PY'
          from pathlib import Path
          size = Path('bot.py').stat().st_size
          print(f'bot.py size: {size} / 235000')
          assert size <= 235000
          source = Path('bot.py').read_text(encoding='utf-8')
          assert 'import discord\n' in source
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          rm -f .github/workflows/tmp_restore_discord_import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_bot_discord_import_regression.py .github/workflows/tmp_restore_discord_import.yml
          git commit -m "Restore Discord module import"
          git push origin HEAD:fix/restore-discord-import-20261017
