name: Remove Black Tide legacy active rules

on:
  push:
    paths:
      - scripts/remove_black_tide_legacy_20261029.py
      - .github/workflows/remove_black_tide_legacy_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply canonical Black Tide rules
        run: python scripts/remove_black_tide_legacy_20261029.py
      - name: Commit canonical source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_rules.py services/multi_seat_order_policy_20261028.py web/app/services/order_groups.py tests/test_companion_count_finish_20261028.py
          git commit -m "Remove legacy Black Tide seat variants from active catalog"
          git push origin HEAD:main
