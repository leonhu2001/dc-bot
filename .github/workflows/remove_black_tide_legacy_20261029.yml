name: Remove Black Tide legacy active rules

on:
  push:
    paths:
      - .github/workflows/remove_black_tide_legacy_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove legacy Black Tide variants from active rules
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # 1) Canonical source rules: remove the 8 old fixed-seat Black Tide rules.
          path = Path('services/order_rules.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# 舊 Black Tide 1～4 人 key 只供已建立訂單／快照回查；新 catalog 不使用。')
          end = text.index('# ========= APEX Legends 陪玩 =========', start)
          text = text[:start] + '# 黑潮爆破新單只保留娛樂陪／技術陪；人數由獨立 1～4 人欄位決定。\n\n\n' + text[end:]
          path.write_text(text, encoding='utf-8')

          # 2) Kill the old installer path too, so no future import can recreate them.
          path = Path('services/multi_seat_order_policy_20261028.py')
          text = path.read_text(encoding='utf-8')
          legacy_start = text.index('_BLACK_TIDE_LEGACY_VARIANTS = (')
          legacy_end = text.index('\n\n_BLACK_TIDE_CANONICAL = (', legacy_start)
          text = text[:legacy_start] + '_BLACK_TIDE_LEGACY_VARIANTS: tuple = ()' + text[legacy_end:]
          loop_start = text.index('    for key, label, template_key, staff_count, price in _BLACK_TIDE_LEGACY_VARIANTS:')
          loop_end = text.index('    for key, label, template_key, price_table in _BLACK_TIDE_CANONICAL:', loop_start)
          text = text[:loop_start] + text[loop_end:]
          path.write_text(text, encoding='utf-8')

          # 3) Web storefront gets one canonical Black Tide group with only 2 service types.
          path = Path('web/app/services/order_groups.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    {
        "key": "oil",
        "category": "delta_desktop_basic",
'''
          block = '''    {
        "key": "black_tide",
        "category": "delta_desktop_basic",
        "label": "黑潮爆破",
        "selector_label": "服務類型",
        "description": "黑潮爆破只選娛樂陪或技術陪；陪玩人數另選 1～4 人。",
        "variants": [
            ("basic_black_tide_entertain", "娛樂陪"),
            ("basic_black_tide_tech", "技術陪"),
        ],
    },

'''
          if '"key": "black_tide"' not in text:
              if anchor not in text:
                  raise SystemExit('web Black Tide insertion anchor not found')
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 4) Regression: active source/UI must never expose old Black Tide seat variants again.
          path = Path('tests/test_companion_count_finish_20261028.py')
          text = path.read_text(encoding='utf-8')
          extra = '''\n\ndef test_black_tide_legacy_seat_variants_are_not_active_rules() -> None:\n    legacy = {\n        f"basic_black_tide_{tier}_{count}"\n        for tier in ("entertain", "tech")\n        for count in range(1, 5)\n    }\n    assert legacy.isdisjoint(order_rules.ORDER_RULES)\n\n\ndef test_black_tide_discord_catalog_has_only_service_type_then_count() -> None:\n    details = _discord_details("delta_desktop_basic", "黑潮爆破")\n    assert [item["label"] for item in details] == ["娛樂陪", "技術陪"]\n    assert [item["rule_key"] for item in details] == [\n        "basic_black_tide_entertain",\n        "basic_black_tide_tech",\n    ]\n    for item in details:\n        rule = order_rules.ORDER_RULES[item["rule_key"]]\n        assert rule.required_staff_count == "player_count"\n        assert rule.player_count_enabled is True\n        assert rule.min_player_count == 1\n        assert rule.max_player_count == 4\n\n\ndef test_black_tide_web_catalog_has_only_two_canonical_variants() -> None:\n    from web.app.services import order_groups\n\n    group = next(\n        item for item in order_groups.get_grouped_order_catalog("delta_desktop_basic")\n        if item["key"] == "black_tide"\n    )\n    assert [item["label"] for item in group["variants"]] == ["娛樂陪", "技術陪"]\n    assert [item["rule_key"] for item in group["variants"]] == [\n        "basic_black_tide_entertain",\n        "basic_black_tide_tech",\n    ]\n    assert all(item["player_count_enabled"] for item in group["variants"])\n    assert all(item["max_player_count"] == 4 for item in group["variants"])\n'''
          if 'test_black_tide_legacy_seat_variants_are_not_active_rules' not in text:
              text += extra
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_rules.py services/multi_seat_order_policy_20261028.py web/app/services/order_groups.py tests/test_companion_count_finish_20261028.py
          git commit -m "Remove legacy Black Tide seat variants from active catalog"
          git push origin HEAD:main
