name: Apply point benefit update

on:
  push:
    branches:
      - fix/point-benefits-store-funded

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch point benefit rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web/app/services/checkout_preview.py')
          text = path.read_text(encoding='utf-8')

          def sub_once(pattern: str, replacement: str, source: str) -> str:
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected exactly one match: {pattern[:80]!r}, got {count}')
              return updated

          point_items = '''POINT_ITEMS = [
              {
                  "key": "discount_20",
                  "cost": 10,
                  "name": "20T 折價券",
                  "kind": "cash_discount",
                  "amount": 20,
              },
              {
                  "key": "discount_30",
                  "cost": 15,
                  "name": "30T 折價券",
                  "kind": "cash_discount",
                  "amount": 30,
              },
              {
                  "key": "free_specify_fee",
                  "cost": 30,
                  "name": "免指定費 1 次",
                  "kind": "free_specify_fee",
              },
              {
                  "key": "discount_100",
                  "cost": 45,
                  "name": "100T 折價券",
                  "kind": "cash_discount",
                  "amount": 100,
              },
              {
                  "key": "extra_hour_30m",
                  "cost": 60,
                  "name": "加時 30 分鐘",
                  "kind": "extra_hours",
                  "hours": 0.5,
                  "pricing_types": ("hourly",),
              },
              {
                  "key": "extra_hour_1h",
                  "cost": 110,
                  "name": "加時 1 小時",
                  "kind": "extra_hours",
                  "hours": 1,
                  "pricing_types": ("hourly",),
              },
              {
                  "key": "extra_game_1",
                  "cost": 40,
                  "name": "加 1 局",
                  "kind": "extra_games",
                  "games": 1,
                  "pricing_types": ("game",),
              },
              {
                  "key": "extra_game_2",
                  "cost": 70,
                  "name": "加 2 局",
                  "kind": "extra_games",
                  "games": 2,
                  "pricing_types": ("game",),
              },
          ]'''

          text = sub_once(
              r'POINT_ITEMS = \[.*?\n\]\n\n\nPOINT_ITEM_MAP = \{',
              point_items + '\n\n\nPOINT_ITEM_MAP = {',
              text,
          )

          point_item_for_rule = '''def _point_item_for_rule(rule, item: dict) -> dict:
              return dict(item or {})'''
          text = sub_once(
              r'def _point_item_for_rule\(rule, item: dict\) -> dict:.*?\n\ndef point_item_status',
              point_item_for_rule + '\n\n\ndef point_item_status',
              text,
          )

          point_item_status = '''def point_item_status(
              *,
              rule_key: str,
              point_item_key: str,
              point_balance: int,
              quantity: int,
              has_specified_staff: bool,
          ) -> dict:

              rule = ORDER_RULES.get(str(rule_key))
              item = POINT_ITEM_MAP.get(str(point_item_key))

              if rule is None or item is None:
                  return {
                      "allowed": False,
                      "reason": "不支援這個點數福利。",
                  }

              if point_balance < int(item["cost"]):
                  return {
                      "allowed": False,
                      "reason": "點數不足。",
                  }

              if not bool(rule.point_benefits_allowed):
                  return {
                      "allowed": False,
                      "reason": "此方案不可使用點數福利。",
                  }

              category = str(rule.category)

              if category == "steam":
                  return {
                      "allowed": False,
                      "reason": "Steam遊戲目前不可使用點數福利。",
                  }

              if category in {
                  "fun",  # 歷史訂單
                  "delta_desktop_fun",
                  "title",
              }:
                  return {
                      "allowed": False,
                      "reason": "趣味單不可使用點數福利。",
                  }

              if str(rule_key).startswith("basic_trial_"):
                  return {
                      "allowed": False,
                      "reason": "體驗單不可使用點數福利。",
                  }

              pricing_types = tuple(item.get("pricing_types") or ())
              pricing_type = str(rule.pricing_type)
              if pricing_types and pricing_type not in pricing_types:
                  label = "計時" if "hourly" in pricing_types else "計局"
                  return {
                      "allowed": False,
                      "reason": f"此點數福利只適用{label}方案。",
                  }

              kind = str(item["kind"])

              if kind == "free_specify_fee":
                  if not rule.allow_specify:
                      return {
                          "allowed": False,
                          "reason": "此方案不開放指定。",
                      }

                  if pricing_type == "hourly" and int(quantity) >= 2:
                      return {
                          "allowed": False,
                          "reason": "2 小時以上本來就免指定費。",
                      }

                  if not has_specified_staff:
                      return {
                          "allowed": False,
                          "requires_specified": True,
                          "reason": "需先指定人員。",
                      }

              if kind == "extra_hours" and pricing_type != "hourly":
                  return {
                      "allowed": False,
                      "reason": "加時只適用計時方案。",
                  }

              if kind == "extra_games" and pricing_type != "game":
                  return {
                      "allowed": False,
                      "reason": "加局只適用計局方案。",
                  }

              return {
                  "allowed": True,
                  "reason": "",
              }'''
          text = sub_once(
              r'def point_item_status\(.*?\n\ndef list_point_options',
              point_item_status + '\n\n\ndef list_point_options',
              text,
          )

          list_point_options = '''def list_point_options(
              *,
              rule_key: str,
              point_balance: int,
              quantity: int,
              has_specified_staff: bool = False,
          ) -> list[dict]:

              rule = ORDER_RULES.get(str(rule_key))
              if rule is None:
                  return []

              pricing_type = str(rule.pricing_type)
              result = []

              for item in POINT_ITEMS:
                  pricing_types = tuple(item.get("pricing_types") or ())
                  if pricing_types and pricing_type not in pricing_types:
                      continue

                  status = point_item_status(
                      rule_key=rule_key,
                      point_item_key=item["key"],
                      point_balance=point_balance,
                      quantity=quantity,
                      has_specified_staff=has_specified_staff,
                  )

                  data = _point_item_for_rule(rule, item)
                  data.update(status)
                  result.append(data)

              return result'''
          text = sub_once(
              r'def list_point_options\(.*?\n\n# ============================================================\n# Financial calculation',
              list_point_options + '\n\n\n# ============================================================\n# Financial calculation',
              text,
          )

          financial_helpers = '''def calculate_point_service_value(
              *,
              quote: dict,
              vip_pay_rate: int,
              point_item: dict | None,
          ) -> int:
              """Return the payout-base value of store-funded extra time/games."""
              if not point_item:
                  return 0

              kind = str(point_item.get("kind") or "")
              if kind == "extra_hours":
                  units = float(point_item.get("hours") or 0)
              elif kind == "extra_games":
                  units = float(point_item.get("games") or 0)
              else:
                  return 0

              if units <= 0:
                  return 0

              quantity = max(1, int(quote.get("quantity") or 1))
              service_amount = max(0, int(quote.get("customer_pay_amount") or 0))
              gross_extra_value = int(round((service_amount / quantity) * units))
              rate = max(0, min(100, int(vip_pay_rate or 100)))
              return max(0, int(round(gross_extra_value * rate / 100)))


def calculate_checkout_financials(
              *,
              service_amount: int,
              vip_pay_rate: int,
              specify_fee: int,
              point_item: dict | None,
              wallet_balance: int,
              use_wallet: bool,
              point_service_value: int = 0,
          ) -> dict:

              service_amount = max(0, int(service_amount or 0))
              vip_pay_rate = max(0, min(100, int(vip_pay_rate or 100)))
              specify_fee = max(0, int(specify_fee or 0))
              wallet_balance = max(0, int(wallet_balance or 0))
              point_service_value = max(0, int(point_service_value or 0))

              after_vip = int(round(service_amount * vip_pay_rate / 100))
              vip_discount_amount = max(0, service_amount - after_vip)

              point_cash_discount = 0
              point_waived_specify = 0
              point_service_note = ""

              if point_item:
                  kind = str(point_item.get("kind") or "")

                  if kind == "cash_discount":
                      point_cash_discount = min(
                          after_vip,
                          max(0, int(point_item.get("amount") or 0)),
                      )
                  elif kind == "free_specify_fee":
                      point_waived_specify = specify_fee
                  elif kind == "extra_hours":
                      hours = float(point_item.get("hours") or 0)
                      if hours == 0.5:
                          point_service_note = "服務時間 +30 分鐘"
                      else:
                          point_service_note = f"服務時間 +{hours:g} 小時"
                  elif kind == "extra_games":
                      games = int(point_item.get("games") or 0)
                      point_service_note = f"服務局數 +{games} 局"

              effective_specify_fee = max(0, specify_fee - point_waived_specify)
              after_point = max(0, after_vip - point_cash_discount)
              subtotal = max(0, after_point + effective_specify_fee)

              wallet_use = min(wallet_balance, subtotal) if use_wallet else 0
              remaining = max(0, subtotal - wallet_use)

              # 點數福利由店裡吸收：
              # - 折價券不降低分潤基底
              # - 免指定費仍按原指定費計入分潤
              # - 加時 / 加局把對應服務價值加入分潤基底
              payout_base = max(
                  0,
                  after_vip + specify_fee + point_service_value,
              )
              point_store_absorbed = max(
                  0,
                  point_cash_discount
                  + point_waived_specify
                  + point_service_value,
              )

              return {
                  "service_amount": service_amount,
                  "original_amount": service_amount,
                  "vip_pay_rate": vip_pay_rate,
                  "manual_discount_percent": vip_pay_rate,
                  "discount_rate_percent": vip_pay_rate,
                  "vip_discount_amount": vip_discount_amount,
                  "manual_discount_amount": vip_discount_amount,
                  "percent_discount_amount": vip_discount_amount,
                  "service_after_vip": after_vip,
                  "specify_fee": specify_fee,
                  # 官網目前沒有客服固定折扣入口；
                  # 點數折價必須獨立保存，不能誤當固定折扣。
                  "cash_coupon_amount": 0,
                  "fixed_discount_amount": 0,
                  "point_cash_discount": point_cash_discount,
                  "point_discount_coupon_amount": point_cash_discount,
                  "point_waived_specify_fee": point_waived_specify,
                  "effective_specify_fee": effective_specify_fee,
                  "point_service_note": point_service_note,
                  "point_service_value": point_service_value,
                  "point_store_absorbed_amount": point_store_absorbed,
                  "subtotal_before_wallet": subtotal,
                  "customer_pay_amount": subtotal,
                  "wallet_use_amount": wallet_use,
                  "remaining_pay_amount": remaining,
                  # 正式建單與 Discord 同步都使用 canonical 欄位；
                  # *_preview 保留給舊前端相容。
                  "payout_base_amount": payout_base,
                  "payout_base_preview": payout_base,
                  "store_absorbed_amount": point_store_absorbed,
                  "store_absorbed_preview": point_store_absorbed,
              }'''

          text = sub_once(
              r'def calculate_checkout_financials\(.*?\n\n# ============================================================\n# Checkout endpoints data',
              financial_helpers + '\n\n\n# ============================================================\n# Checkout endpoints data',
              text,
          )

          old = '''            point_item=\n                selected_point_item,\n\n            wallet_balance='''
          new = '''            point_item=\n                selected_point_item,\n\n            point_service_value=\n                calculate_point_service_value(\n                    quote=quote,\n                    vip_pay_rate=vip_rate,\n                    point_item=selected_point_item,\n                ),\n\n            wallet_balance='''
          if old not in text:
              raise SystemExit('checkout financial call insertion point not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_checkout_point_benefits.py <<'PY'
          from services.order_rules import OrderRule
          from web.app.services import checkout_preview as checkout


          def _rule(key: str, pricing_type: str) -> OrderRule:
              return OrderRule(
                  category="basic",
                  key=key,
                  label=key,
                  pricing_type=pricing_type,
                  price=300,
                  allow_specify=True,
                  max_specified_count=1,
                  specify_fee_default=100,
                  point_benefits_allowed=True,
              )


          def test_point_catalog_prices_and_removed_legacy_reward():
              items = {item["key"]: item for item in checkout.POINT_ITEMS}

              assert items["discount_20"]["cost"] == 10
              assert items["discount_30"]["cost"] == 15
              assert items["free_specify_fee"]["cost"] == 30
              assert items["discount_100"]["cost"] == 45
              assert items["extra_hour_30m"]["cost"] == 60
              assert items["extra_hour_1h"]["cost"] == 110
              assert items["extra_game_1"]["cost"] == 40
              assert items["extra_game_2"]["cost"] == 70

              assert "extra_15" not in items
              assert all(item.get("kind") != "extra_game" for item in items.values())


          def test_hourly_and_game_service_rewards_are_separate(monkeypatch):
              monkeypatch.setitem(checkout.ORDER_RULES, "test_hourly", _rule("test_hourly", "hourly"))
              monkeypatch.setitem(checkout.ORDER_RULES, "test_game", _rule("test_game", "game"))

              hourly = checkout.list_point_options(
                  rule_key="test_hourly",
                  point_balance=999,
                  quantity=1,
                  has_specified_staff=True,
              )
              game = checkout.list_point_options(
                  rule_key="test_game",
                  point_balance=999,
                  quantity=1,
                  has_specified_staff=True,
              )

              hourly_keys = {item["key"] for item in hourly}
              game_keys = {item["key"] for item in game}

              assert {"extra_hour_30m", "extra_hour_1h"} <= hourly_keys
              assert "extra_game_1" not in hourly_keys
              assert "extra_game_2" not in hourly_keys

              assert {"extra_game_1", "extra_game_2"} <= game_keys
              assert "extra_hour_30m" not in game_keys
              assert "extra_hour_1h" not in game_keys

              shared = {
                  "discount_20",
                  "discount_30",
                  "free_specify_fee",
                  "discount_100",
              }
              assert shared <= hourly_keys
              assert shared <= game_keys


          def test_store_absorbs_waived_specify_fee_without_reducing_payout_base():
              finance = checkout.calculate_checkout_financials(
                  service_amount=600,
                  vip_pay_rate=100,
                  specify_fee=100,
                  point_item={"kind": "free_specify_fee"},
                  wallet_balance=0,
                  use_wallet=False,
              )

              assert finance["customer_pay_amount"] == 600
              assert finance["payout_base_amount"] == 700
              assert finance["store_absorbed_amount"] == 100
              assert finance["point_waived_specify_fee"] == 100


          def test_store_absorbs_extra_service_and_keeps_customer_price_unchanged():
              point_item = {
                  "kind": "extra_hours",
                  "hours": 0.5,
              }
              service_value = checkout.calculate_point_service_value(
                  quote={
                      "quantity": 2,
                      "customer_pay_amount": 600,
                  },
                  vip_pay_rate=100,
                  point_item=point_item,
              )
              assert service_value == 150

              finance = checkout.calculate_checkout_financials(
                  service_amount=600,
                  vip_pay_rate=100,
                  specify_fee=0,
                  point_item=point_item,
                  point_service_value=service_value,
                  wallet_balance=0,
                  use_wallet=False,
              )

              assert finance["customer_pay_amount"] == 600
              assert finance["payout_base_amount"] == 750
              assert finance["store_absorbed_amount"] == 150
              assert finance["point_service_note"] == "服務時間 +30 分鐘"


          def test_point_cash_coupon_remains_store_absorbed():
              finance = checkout.calculate_checkout_financials(
                  service_amount=600,
                  vip_pay_rate=100,
                  specify_fee=0,
                  point_item={"kind": "cash_discount", "amount": 100},
                  wallet_balance=0,
                  use_wallet=False,
              )

              assert finance["customer_pay_amount"] == 500
              assert finance["payout_base_amount"] == 600
              assert finance["store_absorbed_amount"] == 100
          PY

      - name: Run targeted tests
        run: |
          python -m pip install -r requirements.txt -r web/requirements-web.txt pytest
          pytest -q \
            tests/test_checkout_point_benefits.py \
            tests/test_order_discounts.py \
            tests/test_checkout_preview_structure.py

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet -- web/app/services/checkout_preview.py tests/test_checkout_point_benefits.py; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/services/checkout_preview.py tests/test_checkout_point_benefits.py
          git commit -m "Rebalance point benefits and make rewards store-funded"
          git push origin HEAD:fix/point-benefits-store-funded
