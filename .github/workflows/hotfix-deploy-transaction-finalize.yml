name: Finalize deploy transaction safety hotfix

on:
  push:
    branches:
      - hotfix/deploy-transaction-truth-20261013

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/deploy-transaction-truth-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: |
          python -m pip install -r requirements.txt -r web/requirements-web.txt pytest
      - name: Make post-reset mismatch transactional
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/deploy_main.sh')
          source = path.read_text(encoding='utf-8')
          old = '''if [ "$(git rev-parse HEAD)" != "$TARGET" ]; then
              echo "ERROR: HEAD does not match target."
              exit 1
          fi
          '''
          new = '''if [ "$(git rev-parse HEAD)" != "$TARGET" ]; then
              echo "ERROR: HEAD does not match target."
              false
          fi
          '''
          if old not in source:
              raise SystemExit('post-reset mismatch block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate shell and deploy safety regressions
        run: |
          bash -n scripts/deploy_main.sh
          python -m pytest -q tests/test_deploy_transaction_safety.py tests/test_deploy_runtime_import_preflight.py tests/test_deploy_nginx_sync.py
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/hotfix-deploy-transaction-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/deploy_main.sh tests/test_deploy_transaction_safety.py .github/workflows/hotfix-deploy-transaction-finalize.yml
          git commit -m 'Harden deploy transaction stability and rollback truthfulness'
          git push origin HEAD:hotfix/deploy-transaction-truth-20261013
