name: Canonical companion follow-up

on:
  push:
    paths:
      - .github/workflows/canonical_followup_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve loyalty families and add real selector regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          loyalty = Path('services/loyalty_benefits.py')
          text = loyalty.read_text(encoding='utf-8')
          old = '''    "basic_entertain_single": "basic_entertain",
              "basic_entertain_double": "basic_entertain",
              "basic_mobile_entertain_single": "basic_mobile_entertain",
              "basic_mobile_entertain_double": "basic_mobile_entertain",
          '''
          new = '''    "basic_entertain_single": "basic_entertain",
              "basic_entertain_double": "basic_entertain",
              "basic_entertain_female_single": "basic_entertain",
              "basic_entertain_male_single": "basic_entertain",
              "basic_entertain_female_double": "basic_entertain",
              "basic_entertain_male_double": "basic_entertain",
              "basic_mobile_entertain_single": "basic_mobile_entertain",
              "basic_mobile_entertain_double": "basic_mobile_entertain",
              "basic_mobile_entertain_female_single": "basic_mobile_entertain",
              "basic_mobile_entertain_male_single": "basic_mobile_entertain",
              "basic_mobile_entertain_female_double": "basic_mobile_entertain",
              "basic_mobile_entertain_male_double": "basic_mobile_entertain",
              "basic_black_tide_entertain": "basic_black_tide_entertain",
          '''
          if old not in text:
              raise SystemExit('loyalty alias anchor not found')
          loyalty.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_companion_count_finish_20261028.py')
          tests = test_path.read_text(encoding='utf-8')
          extra = r'''


def test_actual_quantity_selector_is_enabled_after_delta_spec_selection(monkeypatch) -> None:
    from services import order_runtime
    from services.orders import get_order_item_detail_for_selection
    from services.self_service_selection_state import apply_self_service_detail_selection

    channel_id = 991001
    detail = get_order_item_detail_for_selection(
        "delta_desktop_basic", "技術陪", "secret_single"
    )
    assert detail is not None
    assert detail["label"] == "機密"

    data = {"category": "delta_desktop_basic", "item_group": "技術陪"}
    apply_self_service_detail_selection(data, detail)
    monkeypatch.setattr(
        order_runtime,
        "_RUNTIME_STATE",
        SimpleNamespace(order_selections={channel_id: data}),
    )

    selector = order_runtime.SelfServiceOrderQuantitySelect(
        customer_id=123,
        channel_id=channel_id,
        selected_item=data["item"],
        selected_quantity=data["quantity"],
    )
    assert selector.disabled is False
    assert selector.placeholder == "請選擇 1～24 小時"
    assert selector.options[0].value == "1"
    assert selector.options[-1].value == "24"


def test_entertainment_gender_variants_share_loyalty_progress_family() -> None:
    from services.loyalty_benefits import loyalty_scope_key

    desktop = {
        loyalty_scope_key("basic_entertain_single"),
        loyalty_scope_key("basic_entertain_female_single"),
        loyalty_scope_key("basic_entertain_male_single"),
        loyalty_scope_key("basic_entertain_double"),
    }
    mobile = {
        loyalty_scope_key("basic_mobile_entertain_single"),
        loyalty_scope_key("basic_mobile_entertain_female_single"),
        loyalty_scope_key("basic_mobile_entertain_male_single"),
        loyalty_scope_key("basic_mobile_entertain_double"),
    }
    assert len(desktop) == 1
    assert len(mobile) == 1
'''
          if 'test_actual_quantity_selector_is_enabled_after_delta_spec_selection' not in tests:
              test_path.write_text(tests + extra, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/loyalty_benefits.py tests/test_companion_count_finish_20261028.py
          git commit -m "Preserve canonical companion loyalty and selector flow"
          git push origin HEAD:main
