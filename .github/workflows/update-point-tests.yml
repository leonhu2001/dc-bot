name: Update point tests

on:
  push:
    branches:
      - fix/point-benefits-store-funded

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test updates
        run: python tools/update_point_regression_tests.py

      - name: Commit test updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dispatch_claim_access.py tests/test_game_service_rules.py
          git commit -m "Update point reward regression expectations"
          git push origin HEAD:fix/point-benefits-store-funded
