name: Temporary architecture budget correction

on:
  push:
    branches:
      - refactor/order-runtime-bind-and-panel-bump-20261017

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply architecture correction
        run: echo '' | base64 --decode > /tmp/patch.py && python /tmp/patch.py
      - name: Install validation dependencies
        run: |
          python -m pip install -q -r requirements.txt -r web/requirements-web.txt -r requirements-dev.txt
      - name: Run focused validation and growth budget
        run: |
          python -m compileall -q bot.py services/order_runtime.py services/order_operation_panel_runtime.py
          python -m pytest -q tests/test_order_runtime_dependency_boundary.py tests/test_order_operation_panel_reposition_regression.py tests/test_architecture_growth_budget.py
      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-architecture-budget-correction.yml
          git add bot.py services/order_runtime.py services/order_operation_panel_runtime.py tests/test_order_operation_panel_reposition_regression.py
          git commit -m "Extract order operation panel runtime"
          git push origin HEAD
