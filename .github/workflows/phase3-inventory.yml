name: Phase3 inventory

on:
  push:
    branches:
      - refactor/phase3-csp-modules-20261013
    paths:
      - tools/phase3_inventory.py
      - .github/workflows/phase3-inventory.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inventory remaining phase3 debt
        run: python tools/phase3_inventory.py
