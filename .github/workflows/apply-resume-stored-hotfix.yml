name: Apply stored order resume hotfix

on:
  push:
    branches:
      - fix/resume-stored-order-refresh-20261017

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resume-stored-order-refresh-20261017
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch resume assignment refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/order_storage_runtime.py')
          source = path.read_text(encoding='utf-8')

          helper_marker = '\n\nasync def lock_dispatch_claim_panel(guild: discord.Guild, order_channel_id: int):\n'
          if helper_marker not in source:
              raise SystemExit('helper insertion marker not found')

          helper = r'''


def _refresh_claim_workers_from_active_assignments(
    claim_data: dict,
    order_id: int | None,
) -> bool:
    """Refresh displayed claim workers from canonical active assignments."""
    if order_id is None:
        return False

    from sqlalchemy import text
    from shared.db import engine

    with engine.begin() as conn:
        rows = conn.execute(
            text(
                """
                SELECT worker_discord_id, role_type
                FROM order_assignments
                WHERE order_id = :order_id
                  AND is_active = 1
                ORDER BY id ASC
                """
            ),
            {"order_id": int(order_id)},
        ).mappings().all()

    # Legacy active orders may predate formal assignments. In that case keep the
    # saved claim snapshot instead of erasing the only receiver information.
    if not rows:
        return False

    companion_ids: set[int] = set()
    booster_ids: set[int] = set()

    for row in rows:
        worker_id = _to_int(row.get("worker_discord_id"))
        if worker_id is None:
            continue

        role_type = str(row.get("role_type") or "").strip().lower()
        if role_type == "companion":
            companion_ids.add(worker_id)
        else:
            booster_ids.add(worker_id)

    if not companion_ids and not booster_ids:
        return False

    claim_data["companion"] = companion_ids
    claim_data["booster"] = booster_ids
    return True
'''

          source = source.replace(helper_marker, helper + helper_marker, 1)

          resume_marker = '''    except Exception as exc:\n        raise ValueError(f"恢復付款前接單狀態失敗：{exc}") from exc\n\n    claim_data["locked"] = False\n'''
          if resume_marker not in source:
              raise SystemExit('resume refresh insertion marker not found')

          resume_refresh = '''    except Exception as exc:\n        raise ValueError(f"恢復付款前接單狀態失敗：{exc}") from exc\n\n    if resume_status == "active":\n        assignment_order_id = acceptance_order_id or _to_int(data.get("web_order_id"))\n\n        if assignment_order_id is None:\n            try:\n                from services.order_credentials import get_order_id_by_ticket_channel\n\n                assignment_order_id = get_order_id_by_ticket_channel(order_channel.id)\n            except Exception as exc:\n                print(\n                    f"[resume] resolve web order failed channel_id={order_channel.id}: {exc}",\n                    flush=True,\n                )\n\n        if assignment_order_id is not None:\n            try:\n                if _refresh_claim_workers_from_active_assignments(\n                    claim_data,\n                    int(assignment_order_id),\n                ):\n                    print(\n                        f"[resume] refreshed active assignments order_id={assignment_order_id}",\n                        flush=True,\n                    )\n            except Exception as exc:\n                print(\n                    f"[resume] refresh active assignments failed "\n                    f"order_id={assignment_order_id}: {type(exc).__name__}: {exc}",\n                    flush=True,\n                )\n\n    claim_data["locked"] = False\n'''

          source = source.replace(resume_marker, resume_refresh, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_order_resume_assignment_refresh.py')
          test_path.write_text(
              '''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE = (ROOT / "services" / "order_storage_runtime.py").read_text(encoding="utf-8")\n\n\ndef test_active_resume_refreshes_receiver_list_from_canonical_assignments():\n    assert "def _refresh_claim_workers_from_active_assignments(" in SOURCE\n    assert "SELECT worker_discord_id, role_type" in SOURCE\n    assert "AND is_active = 1" in SOURCE\n    assert 'claim_data["companion"] = companion_ids' in SOURCE\n    assert 'claim_data["booster"] = booster_ids' in SOURCE\n    assert 'if resume_status == "active":' in SOURCE\n    assert 'acceptance_order_id or _to_int(data.get("web_order_id"))' in SOURCE\n    assert "get_order_id_by_ticket_channel(order_channel.id)" in SOURCE\n    assert "_refresh_claim_workers_from_active_assignments(" in SOURCE\n''',
              encoding='utf-8',
          )
          PY

      - name: Compile changed runtime
        run: python -m py_compile services/order_storage_runtime.py services/order_operation_panel_runtime.py

      - name: Run focused regression tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_order_operation_panel_reposition_regression.py \
            tests/test_order_resume_assignment_refresh.py

      - name: Commit hotfix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-resume-stored-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_storage_runtime.py services/order_operation_panel_runtime.py tests/test_order_operation_panel_reposition_regression.py tests/test_order_resume_assignment_refresh.py .github/workflows/apply-resume-stored-hotfix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix stored order resume refresh"
          git push origin HEAD:fix/resume-stored-order-refresh-20261017
