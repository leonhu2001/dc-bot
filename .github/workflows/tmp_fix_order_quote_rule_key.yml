name: Temporary fix order quote rule key

on:
  push:
    branches:
      - fix/order-quote-selected-variant-20261018

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fix quote rule-key source and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          quote_path = Path('web/app/static/js/mw_order_quote.js')
          source = quote_path.read_text(encoding='utf-8')

          helper_anchor = '\n\n    function invalidatePrice() {'
          assert source.count(helper_anchor) == 1, 'quote helper anchor changed'

          helper = '\n'.join([
              '',
              '',
              '    function readSelectedRuleKey() {',
              '',
              '        const select =',
              '            byId(',
              '                "mw-variant"',
              '            );',
              '',
              '',
              '        if (',
              '            !select',
              '            || select.selectedIndex < 0',
              '        ) {',
              '            return "";',
              '        }',
              '',
              '',
              '        const option =',
              '            select.options[',
              '                select.selectedIndex',
              '            ];',
              '',
              '',
              '        return String(',
              '            option?.dataset?.ruleKey',
              '            || option?.getAttribute(',
              '                "data-rule-key"',
              '            )',
              '            || option?.value',
              '            || select.value',
              '            || ""',
              '        ).trim();',
              '    }',
          ])
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old_block = '\n'.join([
              '        const ruleKey =',
              '            String(',
              '                byId(',
              '                    "mw-rule-key"',
              '                )?.textContent',
              '                || ""',
              '            ).trim();',
          ])
          assert source.count(old_block) == 2, 'expected two legacy rule-key reads'
          source = source.replace(
              old_block,
              '        const ruleKey =\n            readSelectedRuleKey();',
          )

          assert '"mw-rule-key"' not in source
          assert source.count('readSelectedRuleKey();') == 2
          assert '"mw-variant"' in source
          quote_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_order_quote_rule_key_source.py')
          test_path.write_text('\n'.join([
              'from pathlib import Path',
              '',
              '',
              'ROOT = Path(__file__).resolve().parents[1]',
              'QUOTE_SOURCE = (ROOT / "web/app/static/js/mw_order_quote.js").read_text(encoding="utf-8")',
              '',
              '',
              'def test_quote_reads_rule_key_from_selected_variant():',
              '    assert "function readSelectedRuleKey()" in QUOTE_SOURCE',
              '    assert "\\\"mw-variant\\\"" in QUOTE_SOURCE',
              '    assert "selectedIndex" in QUOTE_SOURCE',
              '    assert "option?.value" in QUOTE_SOURCE',
              '    assert QUOTE_SOURCE.count("readSelectedRuleKey();") == 2',
              '',
              '',
              'def test_quote_does_not_depend_on_removed_rule_key_node():',
              '    assert "\\\"mw-rule-key\\\"" not in QUOTE_SOURCE',
              '',
          ]) + '\n', encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          node --check web/app/static/js/mw_order_quote.js
          python -m pytest -q tests/test_order_quote_rule_key_source.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_fix_order_quote_rule_key.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/static/js/mw_order_quote.js tests/test_order_quote_rule_key_source.py .github/workflows/tmp_fix_order_quote_rule_key.yml
          git commit -m 'Fix website order quote variant selection'
          git push origin HEAD:fix/order-quote-selected-variant-20261018
