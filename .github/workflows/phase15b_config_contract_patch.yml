name: Phase 15b config contract patch

on:
  push:
    branches:
      - refactor/phase15b-self-service-config-contract-20261013

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase15b-self-service-config-contract-20261013
          fetch-depth: 0
      - name: Apply config contract patch
        run: python tools/phase15b_config_contract_patch.py
      - name: Remove temporary files
        run: git rm tools/phase15b_config_contract_patch.py .github/workflows/phase15b_config_contract_patch.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/self_service_runtime.py
          git commit -m "Use module-owned self-service config dependencies"
          git push origin HEAD:refactor/phase15b-self-service-config-contract-20261013
