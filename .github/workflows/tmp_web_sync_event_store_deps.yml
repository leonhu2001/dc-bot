name: Temporary web sync event store extraction

on:
  push:
    branches:
      - refactor/web-sync-event-store-deps-20261018

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Move event store dependencies out of namespace bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/web_sync/runtime.py')
          source = path.read_text(encoding='utf-8')

          anchor = 'import discord\n\n\n_CONFIGURED = False\n'
          assert source.count(anchor) == 1, 'runtime import anchor changed'
          imports = (
              'import discord\n\n'
              'from services.web_sync.event_store import (\n'
              '    load_order_created_bundle as _web_order_created_load_bundle,\n'
              '    mark_order_created_processing as _web_order_created_mark_processing,\n'
              '    update_order_created_links as _web_order_created_update_links,\n'
              '    mark_event_done as _web_sync_mark_event_done,\n'
              '    mark_event_failed as _web_sync_mark_event_failed,\n'
              ')\n\n\n'
              '_CONFIGURED = False\n'
          )
          source = source.replace(anchor, imports, 1)

          names = (
              '_web_order_created_load_bundle',
              '_web_order_created_mark_processing',
              '_web_order_created_update_links',
              '_web_sync_mark_event_done',
              '_web_sync_mark_event_failed',
          )
          for name in names:
              line = f'        "{name}",\n'
              assert source.count(line) == 1, f'allowlist entry changed: {name}'
              source = source.replace(line, '', 1)

          assert 'def configure_web_sync_runtime(namespace: Mapping[str, Any])' in source
          path.write_text(source, encoding='utf-8')
          PY
      - name: Compile and static guard
        run: |
          python -m compileall -q services/web_sync/runtime.py services/web_sync/event_store.py
          python - <<'PY'
          from pathlib import Path
          source = Path('services/web_sync/runtime.py').read_text(encoding='utf-8')
          assert 'load_order_created_bundle as _web_order_created_load_bundle' in source
          assert 'mark_event_failed as _web_sync_mark_event_failed' in source
          assert 'def configure_web_sync_runtime(namespace: Mapping[str, Any])' in source
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_web_sync_event_store_deps.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/web_sync/runtime.py .github/workflows/tmp_web_sync_event_store_deps.yml
          git commit -m 'Move web sync event-store dependencies to owner module'
          git push origin HEAD:refactor/web-sync-event-store-deps-20261018
