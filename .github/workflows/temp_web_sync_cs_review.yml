name: Temporary Web Sync CS Review Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v7
        with:
          ref: refactor/web-sync-cs-review-20261018

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract CS review gate
        run: |
          python - <<'PY'
          import re as script_re
          from pathlib import Path

          runtime_path = Path("services/web_sync/runtime.py")
          source = runtime_path.read_text(encoding="utf-8")

          start_marker = "# zYao 3C3B2R3 CS review gate v1\n"
          end_marker = "async def _process_web_order_created_event(\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("CS review extraction markers not found exactly once")

          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end].strip() + "\n"
          source = source[:start] + source[end:]

          helper_start_marker = "def _web_dashboard_db_path_for_bot() -> str:\n"
          helper_end_marker = "# zYao 3C3B web order created bridge v1\n"
          if source.count(helper_start_marker) != 1 or source.count(helper_end_marker) != 1:
              raise SystemExit("dashboard db helper markers not found exactly once")
          helper_start = source.index(helper_start_marker)
          helper_end = source.index(helper_end_marker, helper_start)
          source = source[:helper_start] + source[helper_end:]

          amount_pattern = script_re.compile(
              r'    amount_text = \(\n'
              r'\s+_format_plain_amount\(\n\s+amount\n\s+\)\n'
              r'\s+if "_format_plain_amount"\n\s+in globals\(\)\n'
              r'\s+else format_t_amount\(\n\s+amount\n\s+\)\n\s+\)\n'
          )
          block, amount_replacements = amount_pattern.subn(
              "    amount_text = _format_plain_amount(amount)\n",
              block,
              count=1,
          )
          if amount_replacements != 1:
              raise SystemExit(
                  f"expected one CS amount fallback, replaced {amount_replacements}"
              )

          if block.count("_web_order_created_ensure_dispatch(") != 1:
              raise SystemExit("unexpected CS ensure-dispatch call count")
          block = block.replace(
              "_web_order_created_ensure_dispatch(",
              "_ensure_dispatch(",
              1,
          )
          if block.count("_web_order_created_seed_state(") != 1:
              raise SystemExit("unexpected CS seed-state call count")
          block = block.replace(
              "_web_order_created_seed_state(",
              "_seed_state(",
              1,
          )

          prefix = '''from __future__ import annotations

          import asyncio
          import re
          import sqlite3
          from pathlib import Path
          from typing import Any, Callable

          import discord

          from core.database import (
              delete_order_row_from_db,
              remember_order_data,
              save_bot_data,
          )
          from core.permissions import is_customer_staff
          from services.acceptance.runtime import refresh_acceptance_dispatch_from_web_order
          from services.logging_service import send_order_log
          from services.order_lifecycle_runtime import (
              CANCEL_REASON_OPTIONS,
              OrderCancellationReasonSelect,
          )
          from services.orders import _to_int
          from services.self_service_financials import _format_plain_amount
          from services.web_sync.discord_helpers import (
              has_footer as _web_order_created_has_footer,
          )
          from services.web_sync.event_store import (
              load_order_created_bundle as _web_order_created_load_bundle,
          )
          from services.web_sync.presentation import (
              build_order_created_details as _web_order_created_details,
          )


          _CONFIGURED = False

          SELF_SERVICE_ORDER_SELECTIONS: dict[int, dict[str, Any]]
          _ensure_dispatch: Callable[..., Any]
          _seed_state: Callable[..., Any]


          def configure_web_sync_cs_review(
              *,
              order_selections: dict[int, dict[str, Any]],
              ensure_dispatch: Callable[..., Any],
              seed_state: Callable[..., Any],
          ) -> None:
              """Bind the small set of runtime callbacks/state used by the CS review UI."""
              global _CONFIGURED
              global SELF_SERVICE_ORDER_SELECTIONS, _ensure_dispatch, _seed_state

              SELF_SERVICE_ORDER_SELECTIONS = order_selections
              _ensure_dispatch = ensure_dispatch
              _seed_state = seed_state
              _CONFIGURED = True


          def _web_dashboard_db_path_for_bot() -> str:
              return str(Path(__file__).resolve().parents[2] / "web_dashboard.db")


          '''
          Path("services/web_sync/cs_review.py").write_text(
              prefix + block,
              encoding="utf-8",
          )

          source = source.replace("import asyncio\nimport re\nimport sqlite3\n", "", 1)

          old_core_db = '''from core.database import (
              delete_order_row_from_db,
              remember_claim_data,
              remember_order_data,
              save_bot_data,
          )
          '''
          new_core_db = '''from core.database import (
              remember_claim_data,
              remember_order_data,
              save_bot_data,
          )
          '''
          if old_core_db not in source:
              raise SystemExit("runtime core.database import block not found")
          source = source.replace(old_core_db, new_core_db, 1)

          if "from core.permissions import is_customer_staff\n" not in source:
              raise SystemExit("runtime permissions import not found")
          source = source.replace("from core.permissions import is_customer_staff\n", "", 1)

          old_acceptance = '''from services.acceptance.runtime import (
              _apply_acceptance_state_to_claim_data,
              refresh_acceptance_dispatch_from_web_order,
          )
          '''
          new_acceptance = '''from services.acceptance.runtime import _apply_acceptance_state_to_claim_data
          '''
          if old_acceptance not in source:
              raise SystemExit("runtime acceptance import block not found")
          source = source.replace(old_acceptance, new_acceptance, 1)

          old_lifecycle = '''from services.order_lifecycle_runtime import (
              CANCEL_REASON_OPTIONS,
              OrderCancellationReasonSelect,
          )
          '''
          if old_lifecycle not in source:
              raise SystemExit("runtime lifecycle import block not found")
          source = source.replace(old_lifecycle, "", 1)

          bridge_import = '''from services.web_sync.self_service_bridge import (
              configure_web_sync_self_service_bridge,
              _r13_ensure_website_unified_panels,
              _r13_seed_website_order_into_self_service,
          )
          '''
          cs_import = '''from services.web_sync.cs_review import (
              WEB_ORDER_PENDING_CS_DISPATCH,
              WebsiteOrderCsConfirmView,
              WebsitePendingCancelConfirmView,
              configure_web_sync_cs_review,
              _web_dashboard_db_path_for_bot,
              _web_cs_order_id_from_channel,
              _web_cs_set_status,
              _web_cs_ensure_review_panel,
          )
          '''
          if bridge_import not in source:
              raise SystemExit("self-service bridge import anchor not found")
          source = source.replace(bridge_import, cs_import + bridge_import, 1)

          configure_anchor = '''    configure_web_sync_self_service_bridge(
              customer_role_id=CUSTOMER_ROLE_ID,
              order_control_view_type=order_control_view_type,
              order_selections=SELF_SERVICE_ORDER_SELECTIONS,
          )
              _CONFIGURED = True
          '''
          configure_replacement = '''    configure_web_sync_cs_review(
              order_selections=SELF_SERVICE_ORDER_SELECTIONS,
              ensure_dispatch=lambda *args, **kwargs: _web_order_created_ensure_dispatch(
                  *args, **kwargs
              ),
              seed_state=lambda *args, **kwargs: _web_order_created_seed_state(
                  *args, **kwargs
              ),
          )
              configure_web_sync_self_service_bridge(
              customer_role_id=CUSTOMER_ROLE_ID,
              order_control_view_type=order_control_view_type,
              order_selections=SELF_SERVICE_ORDER_SELECTIONS,
          )
              _CONFIGURED = True
          '''
          if configure_anchor not in source:
              raise SystemExit("runtime configure anchor not found")
          source = source.replace(configure_anchor, configure_replacement, 1)
          runtime_path.write_text(source, encoding="utf-8")

          boundary_test = '''import inspect
          from pathlib import Path

          from services.web_sync import cs_review
          from services.web_sync import runtime as web_sync_runtime


          EXPECTED_CS_REVIEW_DEPENDENCIES = {
              "order_selections",
              "ensure_dispatch",
              "seed_state",
          }


          def test_web_sync_cs_review_uses_explicit_dependencies():
              signature = inspect.signature(cs_review.configure_web_sync_cs_review)
              assert set(signature.parameters) == EXPECTED_CS_REVIEW_DEPENDENCIES
              assert all(
                  parameter.kind is inspect.Parameter.KEYWORD_ONLY
                  for parameter in signature.parameters.values()
              )


          def test_cs_review_gate_is_physically_extracted():
              runtime_source = Path("services/web_sync/runtime.py").read_text(
                  encoding="utf-8"
              )
              cs_source = Path("services/web_sync/cs_review.py").read_text(
                  encoding="utf-8"
              )

              for definition in (
                  "def _web_cs_order_id_from_channel",
                  "def _web_cs_set_status",
                  "async def _web_cs_ensure_review_panel",
                  "class WebsiteOrderCsConfirmView",
                  "class WebsitePendingCancelConfirmView",
              ):
                  assert definition not in runtime_source
                  assert definition in cs_source

              assert "import bot" not in cs_source
              assert "from bot import" not in cs_source
              assert "globals()" not in cs_source
              assert web_sync_runtime.WebsiteOrderCsConfirmView is cs_review.WebsiteOrderCsConfirmView
              assert (
                  web_sync_runtime.WebsitePendingCancelConfirmView
                  is cs_review.WebsitePendingCancelConfirmView
              )
              assert (
                  web_sync_runtime._web_cs_ensure_review_panel
                  is cs_review._web_cs_ensure_review_panel
              )
          '''
          Path("tests/test_web_sync_cs_review_boundary.py").write_text(
              boundary_test,
              encoding="utf-8",
          )

          extraction_path = Path("tests/test_runtime_extraction_boundaries.py")
          extraction_source = extraction_path.read_text(encoding="utf-8")
          import_anchor = "from services.web_sync import runtime as web_sync_runtime\n"
          if import_anchor not in extraction_source:
              raise SystemExit("runtime extraction test import anchor not found")
          extraction_source = extraction_source.replace(
              import_anchor,
              "from services.web_sync import cs_review as web_sync_cs_review\n" + import_anchor,
              1,
          )
          old_assert = '    assert "class WebsiteOrderCsConfirmView" in web_source\n'
          new_assert = '''    cs_review_source = Path("services/web_sync/cs_review.py").read_text(
                  encoding="utf-8"
              )
              assert "class WebsiteOrderCsConfirmView" not in web_source
              assert "class WebsiteOrderCsConfirmView" in cs_review_source
              assert (
                  web_sync_runtime.WebsiteOrderCsConfirmView
                  is web_sync_cs_review.WebsiteOrderCsConfirmView
              )
          '''
          if old_assert not in extraction_source:
              raise SystemExit("legacy WebsiteOrderCsConfirmView assertion not found")
          extraction_source = extraction_source.replace(old_assert, new_assert, 1)
          extraction_path.write_text(extraction_source, encoding="utf-8")

          growth_path = Path("tests/test_architecture_growth_budget.py")
          growth_source = growth_path.read_text(encoding="utf-8")
          old_budget = '    "services/web_sync/runtime.py": 53_000,\n'
          new_budget = (
              '    "services/web_sync/runtime.py": 36_000,\n'
              '    "services/web_sync/cs_review.py": 25_000,\n'
          )
          if old_budget not in growth_source:
              raise SystemExit("Web Sync runtime budget anchor not found")
          growth_source = growth_source.replace(old_budget, new_budget, 1)
          growth_path.write_text(growth_source, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile extracted modules
        run: |
          python -m compileall -q \
            services/web_sync/runtime.py \
            services/web_sync/cs_review.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Run targeted extraction tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_web_sync_cs_review.yml
          git add \
            services/web_sync/runtime.py \
            services/web_sync/cs_review.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py
          git commit -m "Extract Web Sync CS review gate"
          git push origin HEAD:refactor/web-sync-cs-review-20261018
