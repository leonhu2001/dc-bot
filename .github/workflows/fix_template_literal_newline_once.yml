name: Fix template literal newline once

on:
  push:
    branches:
      - fix/template-literal-newline-20261013

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/template-literal-newline-20261013
          fetch-depth: 0

      - name: Scan and fix rendered literal newline artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('web/app/templates')
          pattern = re.compile(r'\\n(?=[ \t\r\n]*</(?:head|body|html)>)', re.IGNORECASE)
          fixed = []
          for path in sorted(root.rglob('*.html')):
              source = path.read_text(encoding='utf-8-sig')
              matches = pattern.findall(source)
              if not matches:
                  continue
              updated = pattern.sub('', source)
              path.write_text(updated, encoding='utf-8')
              fixed.append((str(path), len(matches)))

          print(f'TOTAL_FIXED_FILES={len(fixed)}')
          print(f'TOTAL_FIXED_ARTIFACTS={sum(count for _, count in fixed)}')
          for path, count in fixed:
              print(f'FIXED {path} x{count}')

          remaining = []
          for path in sorted(root.rglob('*.html')):
              source = path.read_text(encoding='utf-8-sig')
              if pattern.search(source):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('remaining literal newline artifacts: ' + ', '.join(remaining))
          PY

      - name: Add all-template regression guard
        shell: bash
        run: |
          cat > tests/test_template_literal_newline_artifacts.py <<'PY'
          from pathlib import Path
          import re


          ROOT = Path(__file__).resolve().parents[1]
          TEMPLATES = ROOT / "web" / "app" / "templates"
          LITERAL_DOCUMENT_NEWLINE = re.compile(
              r"\\n(?=[ \t\r\n]*</(?:head|body|html)>)",
              re.IGNORECASE,
          )


          def test_templates_do_not_render_literal_newline_escape_artifacts():
              bad: dict[str, int] = {}
              for path in sorted(TEMPLATES.rglob("*.html")):
                  source = path.read_text(encoding="utf-8-sig")
                  count = len(LITERAL_DOCUMENT_NEWLINE.findall(source))
                  if count:
                      bad[str(path.relative_to(ROOT))] = count

              assert not bad, (
                  "literal \\n escape token found next to document closing tag: "
                  + ", ".join(f"{path} x{count}" for path, count in bad.items())
              )
          PY

      - name: Run focused regression
        shell: bash
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_template_literal_newline_artifacts.py

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix_template_literal_newline_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/templates tests/test_template_literal_newline_artifacts.py .github/workflows/fix_template_literal_newline_once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove rendered literal newline artifacts from templates"
          git push origin HEAD:fix/template-literal-newline-20261013
