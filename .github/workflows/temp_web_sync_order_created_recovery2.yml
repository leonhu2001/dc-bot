name: Temporary Web Sync Order Created Recovery 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v7
        with:
          ref: refactor/web-sync-order-created-20261018

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply structural extraction
        run: |
          python - <<'PY'
          import textwrap
          from pathlib import Path

          workflow = Path(".github/workflows/temp_web_sync_order_created.yml").read_text(
              encoding="utf-8"
          )
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])

          old_guard = '''if "globals()" in tail:
              raise SystemExit("order-created pipeline still contains globals()")
          '''
          structural_cleanup = '''seed_start_marker = '    data["amount_text"] = (\\n'
          seed_end_marker = '\\n\\n    for key in (\\n'
          if tail.count(seed_start_marker) != 1:
              raise SystemExit(
                  f"expected one seed amount block, found {tail.count(seed_start_marker)}"
              )
          seed_start = tail.index(seed_start_marker)
          seed_end = tail.index(seed_end_marker, seed_start)
          seed_block = tail[seed_start:seed_end]
          if "globals()" not in seed_block:
              raise SystemExit("seed amount block no longer contains expected legacy fallback")
          tail = (
              tail[:seed_start]
              + '    data["amount_text"] = _format_plain_amount(amount)'
              + tail[seed_end:]
          )
          if "globals()" in tail:
              raise SystemExit("order-created pipeline still contains globals()")
          '''
          if old_guard not in script:
              raise SystemExit("original globals guard not found")
          script = script.replace(
              old_guard,
              textwrap.dedent(structural_cleanup),
              1,
          )
          exec(compile(script, "order_created_extraction", "exec"), {})
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile extracted modules
        run: |
          python -m compileall -q \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Run targeted extraction tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Commit extraction and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/temp_web_sync_order_created.yml \
            .github/workflows/temp_web_sync_order_created_recovery.yml \
            .github/workflows/temp_web_sync_order_created_recovery2.yml
          git add \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py
          git commit -m "Extract Web Sync order-created pipeline"
          git push origin HEAD:refactor/web-sync-order-created-20261018
