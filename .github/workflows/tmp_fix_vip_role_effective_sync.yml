name: Prepare VIP role sync fix

on:
  push:
    branches:
      - tmp/fix-vip-role-effective-sync

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/fix-vip-role-effective-sync
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest<9,>=8.3'
      - name: Patch base VIP role sync and add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/rewards.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('async def sync_vip_tier_roles(')
          end = source.index('\nasync def ensure_reward_member_benefits', start)
          replacement = '''async def sync_vip_tier_roles(guild, member, data: dict) -> list[str]:
              """依目前實際生效的 VIP 階級同步 Discord 身分組。"""
              notices: list[str] = []

              if guild is None or member is None or not _VIP_ROLE_TIERS:
                  return notices

              # Discord 身分組必須跟「有效 VIP 階級」一致，不能只用歷史累積消費。
              # 正常會員的有效階級仍由累積消費決定；人工/保級降階後則尊重
              # vip_level_index + reset baseline，避免剛降階就被 total_spent 拉回高階。
              effective_level = get_effective_member_level(data)
              try:
                  effective_threshold = int(effective_level.get("threshold", 0) or 0)
              except Exception:
                  effective_threshold = 0

              target_tier = None
              for tier in _VIP_ROLE_TIERS:
                  try:
                      if effective_threshold >= int(tier.get("threshold", 0) or 0):
                          target_tier = tier
                  except Exception:
                      continue

              tier_role_ids = {
                  int(tier.get("role_id"))
                  for tier in _VIP_ROLE_TIERS
                  if str(tier.get("role_id") or "").isdigit()
              }

              target_role_id = int(target_tier["role_id"]) if target_tier else None
              current_role_ids = {role.id for role in getattr(member, "roles", [])}

              roles_to_remove = [
                  role
                  for role in getattr(member, "roles", [])
                  if role.id in tier_role_ids and role.id != target_role_id
              ]

              roles_to_add = []
              if target_role_id and target_role_id not in current_role_ids:
                  role = guild.get_role(target_role_id)
                  if role is not None:
                      roles_to_add.append(role)

              # 升 / 降到另一個 VIP 階級時先加新身分組、再移除舊身分組，
              # 避免中間短暫出現「完全沒有 VIP 身分」而誤刪永久 VIP 包廂。
              if roles_to_add:
                  await member.add_roles(*roles_to_add, reason="魔丸娛樂 VIP 階級同步")
                  notices.append(f"已獲得 {target_tier.get('name', 'VIP')} 身分組")

              if roles_to_remove:
                  await member.remove_roles(*roles_to_remove, reason="魔丸娛樂 VIP 階級同步")
                  notices.append("已移除其他 VIP 階級身分組")

              return notices
          '''
          # Remove indentation introduced only to keep this YAML block readable.
          import textwrap
          replacement = textwrap.dedent(replacement)
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          test = Path('tests/test_vip_role_sync_effective_level.py')
          test.write_text('''import asyncio\n\nfrom core.vip_levels import BASE_MEMBER_LEVELS, VIP_ROLE_TIERS\nfrom services import rewards\n\n\nclass FakeRole:\n    def __init__(self, role_id):\n        self.id = int(role_id)\n\n\nclass FakeGuild:\n    def __init__(self, roles):\n        self._roles = {role.id: role for role in roles}\n\n    def get_role(self, role_id):\n        return self._roles.get(int(role_id))\n\n\nclass FakeMember:\n    def __init__(self, roles):\n        self.roles = list(roles)\n\n    async def add_roles(self, *roles, reason=None):\n        for role in roles:\n            if role not in self.roles:\n                self.roles.append(role)\n\n    async def remove_roles(self, *roles, reason=None):\n        removed = {role.id for role in roles}\n        self.roles = [role for role in self.roles if role.id not in removed]\n\n\ndef _runtime():\n    rewards.configure_rewards(member_levels=[dict(level) for level in BASE_MEMBER_LEVELS])\n    rewards.configure_reward_benefits(vip_role_tiers=[dict(tier) for tier in VIP_ROLE_TIERS])\n    roles = [FakeRole(tier["role_id"]) for tier in VIP_ROLE_TIERS]\n    return FakeGuild(roles)\n\n\ndef _tier(name):\n    return next(tier for tier in VIP_ROLE_TIERS if tier["name"] == name)\n\n\ndef test_manual_downgrade_syncs_discord_role_to_effective_vip_level():\n    guild = _runtime()\n    old_role = guild.get_role(_tier("白鑽魔丸")["role_id"])\n    target_role_id = int(_tier("鑽石魔丸")["role_id"])\n    member = FakeMember([old_role])\n    data = {\n        "total_spent": 50000,\n        "vip_level_index": 4,\n        "vip_progress_base_total_spent": 50000,\n        "vip_progress_reset_active": True,\n        "vip_downgrade_logs": [{"source": "manual_vip_review"}],\n    }\n\n    asyncio.run(rewards.sync_vip_tier_roles(guild, member, data))\n\n    assert {role.id for role in member.roles} == {target_role_id}\n\n\ndef test_manual_downgrade_to_normal_removes_historical_high_vip_role():\n    guild = _runtime()\n    black_role = guild.get_role(_tier("黑鑽魔丸")["role_id"])\n    member = FakeMember([black_role])\n    data = {\n        "total_spent": 88888,\n        "vip_level_index": 0,\n        "vip_progress_base_total_spent": 88888,\n        "vip_progress_reset_active": True,\n        "vip_downgrade_logs": [{"source": "manual_vip_review"}],\n    }\n\n    asyncio.run(rewards.sync_vip_tier_roles(guild, member, data))\n\n    assert member.roles == []\n\n\ndef test_normal_cumulative_vip_role_sync_is_unchanged():\n    guild = _runtime()\n    member = FakeMember([])\n    expected_role_id = int(_tier("白鑽魔丸")["role_id"])\n    data = {\n        "total_spent": 50000,\n        "vip_level_index": None,\n        "vip_progress_base_total_spent": None,\n        "vip_progress_reset_active": False,\n        "vip_downgrade_logs": [],\n    }\n\n    asyncio.run(rewards.sync_vip_tier_roles(guild, member, data))\n\n    assert {role.id for role in member.roles} == {expected_role_id}\n''', encoding='utf-8')

          Path('.github/workflows/tmp_fix_vip_role_effective_sync.yml').unlink()
          PY
      - name: Run VIP role regression tests
        run: python -m pytest -q tests/test_vip_role_sync_effective_level.py
      - name: Commit prepared fix to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Discord VIP role sync after manual level changes'
          git push origin HEAD:tmp/fix-vip-role-effective-sync
