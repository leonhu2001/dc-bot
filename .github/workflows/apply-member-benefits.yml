name: Apply member benefits patch

on:
  push:
    branches:
      - feature/member-benefits-portal

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/member-benefits-portal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply final fixes
        run: python tools/finalize_member_benefits.py
      - name: Compile changed Python
        run: python -m compileall -q bot.py cogs services shared views web/app tests
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests
          git commit -m "Harden loyalty benefits and archived profile behavior"
          git push origin HEAD:feature/member-benefits-portal
