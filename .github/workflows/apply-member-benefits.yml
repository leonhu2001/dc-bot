name: Apply member benefits patch

on:
  push:
    branches:
      - feature/member-benefits-portal

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/member-benefits-portal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply final integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rw(path, fn):
              p = Path(path)
              old = p.read_text(encoding="utf-8")
              new = fn(old)
              if new != old:
                  p.write_text(new, encoding="utf-8")
                  print("patched", path)

          def staff_test(text):
              return text.replace(
                  '    assert [call["archived"] for call in thread.edit_calls] == [False]\n    assert thread.archived is False\n    assert len(thread.message.edits) == 1\n',
                  '    assert thread.edit_calls == []\n    assert thread.archived is True\n    assert len(thread.message.edits) == 0\n',
                  1,
              )
          rw("tests/test_staff_profile_archived_thread_refresh.py", staff_test)

          def game_test(text):
              pattern = r'def test_buy_8_get_1_and_prices\(\):.*?(?=\n\ndef test_new_game_orders_split_hourly_and_game_point_rewards)'
              replacement = '''def test_same_order_buy_get_is_disabled_and_loyalty_is_enabled():
              rule = ORDER_RULES["valorant_radiant_ranked"]
              result = calculate_price(rule, quantity=8, player_count=2)
              assert rule.price == 400
              assert result.base_amount == 6400
              assert result.service_quantity == 8
              assert rule.loyalty_benefits_enabled is True
              assert set(get_allowed_role_ids(rule)) == {"1545357782906314782"}

              lol = ORDER_RULES["lol_entertain_aram"]
              assert lol.price == 300
              assert lol.unit_label == "H"
              assert lol.loyalty_benefits_enabled is True
              assert calculate_price(lol, quantity=8, player_count=1).service_quantity == 8
              '''
              replacement = re.sub(r'^              ', '', replacement, flags=re.M)
              return re.sub(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          rw("tests/test_game_service_rules.py", game_test)

          def self_service(text):
              text = text.replace(
                  'default=parent_view.selected_key is None,',
                  'default=(parent_view.selected_key is None and parent_view.selected_coupon_id is None),',
                  1,
              )
              text = text.replace(
                  'placeholder="選擇這張單要使用的點數福利",',
                  'placeholder="選擇點數 / 會員福利",',
                  1,
              )
              text = text.replace(
                  'label="選擇點數福利",',
                  'label="點數 / 會員福利",',
                  1,
              )
              if '會員福利：' not in text:
                  marker = '    # service_promotion_web_note_v1\n'
                  insert = '''    if price_adjustment.get("benefit_coupon_title"):
              benefit_note = str(price_adjustment.get("benefit_service_note") or "").strip()
              web_note_parts.append(
                  "會員福利："
                  f"{price_adjustment['benefit_coupon_title']}"
                  + (f"｜{benefit_note}" if benefit_note else "")
              )

              '''
                  insert = re.sub(r'^              ', '', insert, flags=re.M)
                  if marker not in text:
                      raise SystemExit("service promotion marker missing")
                  text = text.replace(marker, insert + marker, 1)
              return text
          rw("services/self_service_runtime.py", self_service)

          def loyalty(text):
              text = text.replace(
                  '''            SELECT id, customer_discord_id, order_rule_key, quantity,
                         customer_pay_amount, status, created_at, updated_at, closed_at,
                         price_snapshot_json, ticket_channel_id
              ''',
                  '''            SELECT id, customer_discord_id, order_rule_key, quantity,
                         amount, original_amount, customer_pay_amount, status, created_at, updated_at, closed_at,
                         price_snapshot_json, ticket_channel_id
              ''',
                  1,
              )
              if 'qualifying_paid_amount = int(row.get("customer_pay_amount")' in text:
                  return text
              old = '''        elif int(row.get("customer_pay_amount") or 0) <= 0:
                  note = "no_paid_amount"
              else:
                  player_count = 1
                  try:
                      import json
                      snapshot = json.loads(str(row.get("price_snapshot_json") or "{}"))
                      if isinstance(snapshot, dict):
                          preview = snapshot.get("preview") if isinstance(snapshot.get("preview"), dict) else snapshot
                          quote = preview.get("quote") if isinstance(preview, dict) and isinstance(preview.get("quote"), dict) else {}
                          input_data = snapshot.get("input") if isinstance(snapshot.get("input"), dict) else {}
                          player_count = int(quote.get("player_count") or input_data.get("player_count") or 1)
                  except Exception:
                      player_count = 1
              '''
              old = re.sub(r'^              ', '', old, flags=re.M)
              new = '''        else:
                  player_count = 1
                  qualifying_paid_amount = int(row.get("customer_pay_amount") or row.get("amount") or 0)
                  try:
                      import json
                      snapshot = json.loads(str(row.get("price_snapshot_json") or "{}"))
                      if isinstance(snapshot, dict):
                          preview = snapshot.get("preview") if isinstance(snapshot.get("preview"), dict) else snapshot
                          quote = preview.get("quote") if isinstance(preview, dict) and isinstance(preview.get("quote"), dict) else {}
                          input_data = snapshot.get("input") if isinstance(snapshot.get("input"), dict) else {}
                          finance = preview.get("finance") if isinstance(preview, dict) and isinstance(preview.get("finance"), dict) else {}
                          player_count = int(quote.get("player_count") or input_data.get("player_count") or snapshot.get("player_count") or 1)
                          if "subtotal_before_wallet" in finance:
                              qualifying_paid_amount = int(finance.get("subtotal_before_wallet") or 0)
                          elif "customer_pay_amount" in snapshot:
                              qualifying_paid_amount = int(snapshot.get("customer_pay_amount") or 0)
                  except Exception:
                      player_count = 1

                  if qualifying_paid_amount <= 0:
                      note = "no_paid_amount"
                  else:
              '''
              new = re.sub(r'^              ', '', new, flags=re.M)
              if old not in text:
                  raise SystemExit("loyalty paid gate anchor missing")
              text = text.replace(old, new, 1)
              start = text.index('                rule = _rule_for_key(rule_key)', text.index('qualifying_paid_amount'))
              end = text.index('\n\n        conn.execute(text("""\n            INSERT INTO loyalty_order_events', start)
              block = text[start:end]
              block = '\n'.join(('    ' + line if line.strip() else line) for line in block.split('\n'))
              return text[:start] + block + text[end:]
          rw("services/loyalty_benefits.py", loyalty)

          def checkout_test(text):
              if 'test_point_added_service_uses_full_value_even_with_vip_discount' in text:
                  return text
              return text + '''

          def test_point_added_service_uses_full_value_even_with_vip_discount():
              point_item = {"kind": "extra_hours", "hours": 0.5}
              service_value = checkout.calculate_point_service_value(
                  quote={"quantity": 2, "customer_pay_amount": 600},
                  vip_pay_rate=94,
                  point_item=point_item,
              )
              assert service_value == 150
              finance = checkout.calculate_checkout_financials(
                  service_amount=600,
                  vip_pay_rate=94,
                  specify_fee=0,
                  point_item=point_item,
                  point_service_value=service_value,
                  wallet_balance=0,
                  use_wallet=False,
              )
              assert finance["customer_pay_amount"] == 564
              assert finance["payout_base_amount"] == 714
              assert finance["point_store_absorbed_amount"] == 150
          '''.replace('\n          ', '\n')
          rw("tests/test_checkout_point_benefits.py", checkout_test)
          PY

      - name: Compile changed Python
        run: python -m compileall -q bot.py cogs services shared views web/app tests

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests
          git commit -m "Harden loyalty benefits and archived profile behavior"
          git push origin HEAD:feature/member-benefits-portal
