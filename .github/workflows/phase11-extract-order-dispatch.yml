name: Phase 11 order dispatch extraction

on:
  push:
    branches:
      - refactor/phase11-order-dispatch-runtime-20261013
    paths:
      - tools/phase11_extract_order_dispatch.py
      - .github/workflows/phase11-extract-order-dispatch.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-phase11-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase11-order-dispatch-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Extract canonical dispatch runtime
        run: python tools/phase11_extract_order_dispatch.py
      - name: Validate extraction
        run: |
          python -m compileall -q bot.py cogs core services shared views web/app tools scripts tests
          python tools/runtime_import_smoke.py
          python -m pytest -q tests/test_order_dispatch_runtime_boundary.py tests/test_architecture_growth_budget.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit extracted runtime
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Discord order dispatch runtime"
          git push origin HEAD:refactor/phase11-order-dispatch-runtime-20261013
