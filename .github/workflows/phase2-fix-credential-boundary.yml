name: Phase2 fix credential boundary

on:
  push:
    branches:
      - refactor/phase2-runtime-assets-20261013
    paths:
      - .github/workflows/phase2-fix-credential-boundary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase2-runtime-assets-20261013
          fetch-depth: 0
      - name: Restore persistence service and isolate Discord runtime
        run: |
          set -Eeuo pipefail
          git mv services/order_credentials.py services/order_credential_runtime.py
          git checkout bcec07e2e28a2a7d2dc98baa405bff4886c896d6 -- services/order_credentials.py
          python - <<'PY'
          from pathlib import Path
          path = Path('services/order_runtime.py')
          source = path.read_text(encoding='utf-8')
          old = 'from services.order_credentials import (\n    configure_order_credentials,'
          new = 'from services.order_credential_runtime import (\n    configure_order_credentials,'
          if old not in source:
              raise SystemExit('parent runtime credential import marker not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify boundary and compile
        run: |
          grep -q 'def ensure_order_credential_tables' services/order_credentials.py
          grep -q 'def configure_order_credentials' services/order_credential_runtime.py
          grep -q 'from services.order_credentials import' services/order_credential_runtime.py
          python -m compileall -q services/order_credentials.py services/order_credential_runtime.py services/order_runtime.py bot.py
      - name: Commit boundary fix
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_credentials.py services/order_credential_runtime.py services/order_runtime.py
          git commit -m "Separate credential persistence from Discord runtime"
          git pull --rebase origin refactor/phase2-runtime-assets-20261013
          git push origin HEAD:refactor/phase2-runtime-assets-20261013
