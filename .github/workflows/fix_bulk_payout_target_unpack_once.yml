name: Fix bulk payout target collection

on:
  push:
    branches:
      - fix/report-button-payout-notification-20261013

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-button-payout-notification-20261013
          fetch-depth: 0
      - name: Apply fix
        run: python tools/one_shot_bulk_payout_target_fix.py
      - name: Verify compile
        run: python -m compileall -q web/app/routers/admin_payout_summary.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix_bulk_payout_target_unpack_once.yml
          rm -f tools/one_shot_bulk_payout_target_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/routers/admin_payout_summary.py tests/test_payout_notifications.py .github/workflows/fix_bulk_payout_target_unpack_once.yml tools/one_shot_bulk_payout_target_fix.py
          git diff --cached --check
          git commit -m "Fix bulk payout notification target collection"
          git push origin HEAD:fix/report-button-payout-notification-20261013
