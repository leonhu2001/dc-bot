name: Bind self-service smart dispatch dependencies

on:
  push:
    branches:
      - refactor/self-service-dispatch-runtime-20261015

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-dispatch-runtime-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind smart dispatch helpers to owning module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/self_service_runtime.py')
          s = p.read_text(encoding='utf-8')

          import_anchor = '''from services.smart_dispatch import create_smart_dispatch_plan, set_specified_dm_results\n'''
          import_block = import_anchor + '''from views.smart_dispatch import (\n    prepare_initial_smart_dispatch,\n    send_initial_smart_dispatch_alert,\n    send_specified_staff_dispatch_dms,\n)\n'''
          if 'from views.smart_dispatch import (' not in s:
              if import_anchor not in s:
                  raise SystemExit('smart_dispatch import anchor missing')
              s = s.replace(import_anchor, import_block, 1)

          allow_anchor = '        "set_specified_dm_results",\n'
          additions = (
              '        "prepare_initial_smart_dispatch",\n'
              '        "send_initial_smart_dispatch_alert",\n'
              '        "send_specified_staff_dispatch_dms",\n'
          )
          if '        "send_specified_staff_dispatch_dms",\n' not in s:
              if allow_anchor not in s:
                  raise SystemExit('module-owned allowlist anchor missing')
              s = s.replace(allow_anchor, allow_anchor + ''.join(additions), 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile services/self_service_runtime.py services/self_service_dispatch_runtime.py
      - name: Commit dependency fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/self_service_runtime.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Bind self-service smart dispatch dependencies explicitly"
          git push origin HEAD:refactor/self-service-dispatch-runtime-20261015
