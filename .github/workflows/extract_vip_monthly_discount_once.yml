name: Extract VIP monthly discount domain
on:
  push:
    branches: [fix/vip-monthly-self-service-and-individual-payout-dm-20261013]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vip-monthly-self-service-and-individual-payout-dm-20261013
          fetch-depth: 0
      - name: Extract monthly discount logic
        run: python tools/one_shot_extract_vip_monthly_discount.py
      - name: Compile changed modules
        run: python -m compileall -q services/self_service_financials.py services/vip_monthly_order_discount.py tests/test_vip_monthly_order_discount.py tests/test_self_service_financial_runtime_contract.py
      - name: Verify architecture budget
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('services/self_service_financials.py').stat().st_size
          assert size <= 42000, size
          print(f'self_service_financials.py={size}')
          PY
      - name: Commit extraction
        run: |
          rm -f .github/workflows/extract_vip_monthly_discount_once.yml tools/one_shot_extract_vip_monthly_discount.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git diff --cached --check
          git commit -m "Extract VIP monthly order discount logic"
          git push origin HEAD:fix/vip-monthly-self-service-and-individual-payout-dm-20261013