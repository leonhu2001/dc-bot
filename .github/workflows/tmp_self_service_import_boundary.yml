name: Temporary self service import boundary

on:
  push:
    branches:
      - refactor/self-service-import-boundary-20261015

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-import-boundary-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow self service import-shadow protection
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/self_service_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          old = '''_MODULE_OWNED_RUNTIME_NAMES = frozenset(\n    {\n        "json",'''
          new = '''_MODULE_OWNED_RUNTIME_NAMES = frozenset(\n    {\n        "Any",\n        "Mapping",\n        "discord",\n        "json",'''
          if old not in text:
              raise SystemExit('expected self-service owned-name block not found')
          runtime_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_self_service_runtime_import_boundary.py').write_text('''from typing import Any, Mapping\n\nimport discord\n\nfrom services import self_service_runtime\n\n\ndef test_self_service_legacy_injection_cannot_shadow_basic_module_imports():\n    originals = {\n        "Any": Any,\n        "Mapping": Mapping,\n        "discord": discord,\n    }\n    marker = object()\n\n    self_service_runtime.configure_self_service_runtime(\n        {\n            **{name: object() for name in originals},\n            "_self_service_import_boundary_marker": marker,\n        }\n    )\n\n    for name, original in originals.items():\n        assert getattr(self_service_runtime, name) is original\n    assert self_service_runtime._self_service_import_boundary_marker is marker\n\n\ndef test_self_service_basic_module_import_names_are_owned():\n    for name in ("Any", "Mapping", "discord"):\n        assert name in self_service_runtime._MODULE_OWNED_RUNTIME_NAMES\n''', encoding='utf-8')
          PY
          python -m py_compile services/self_service_runtime.py tests/test_self_service_runtime_import_boundary.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_self_service_import_boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/self_service_runtime.py tests/test_self_service_runtime_import_boundary.py .github/workflows/tmp_self_service_import_boundary.yml
          git commit -m "Protect self-service imports from legacy injection"
          git push origin HEAD:refactor/self-service-import-boundary-20261015
