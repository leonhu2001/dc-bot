name: Canonical sweet direct keys

on:
  push:
    paths:
      - .github/workflows/canonical_sweet_keys_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make new sweet rules canonical and keep legacy keys fixed
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('services/order_rules.py')
          s = path.read_text(encoding='utf-8')
          start = s.index('def _add_sweet_rule(')
          end = s.index('\n\n_add_sweet_rule(\n    "basic_sweet_female_single"', start)
          replacement = '''def _add_sweet_rule(
              key: str,
              label: str,
              *,
              price: int,
              required_staff_count: int,
              allowed_roles: tuple[RoleKey, ...],
              category: str = "general",
              required_game_roles: tuple[str, ...] = (),
          ) -> None:
              # 舊甜蜜單 key 保持固定單／雙陪語意，只供歷史訂單與舊快照回查。
              _add(OrderRule(
                  category,
                  key,
                  label,
                  "hourly",
                  price,
                  "H",
                  allowed_roles=allowed_roles,
                  allowed_game_roles=(),
                  required_game_roles=required_game_roles,
                  required_staff_count=required_staff_count,
                  allow_specify=True,
                  max_specified_count=required_staff_count,
                  specify_fee_default=100,
                  specify_fee_by_role={role: 100 for role in allowed_roles},
                  specify_free_min_units=2,
                  specify_free_basis="quantity",
              ))


          def _add_selectable_sweet_rule(
              key: str,
              label: str,
              *,
              allowed_roles: tuple[RoleKey, ...],
              category: str,
              required_game_roles: tuple[str, ...],
          ) -> None:
              # 新甜蜜單只選性別／不限；陪玩人數由獨立欄位選 1～2。
              _add(OrderRule(
                  category,
                  key,
                  label,
                  "hourly",
                  520,
                  "H",
                  allowed_roles=allowed_roles,
                  allowed_game_roles=(),
                  required_game_roles=(*required_game_roles, SWEET_COMPANION_ROLE_KEY),
                  required_staff_count="player_count",
                  player_count_enabled=True,
                  min_player_count=1,
                  max_player_count=2,
                  price_multiply_player_count=False,
                  player_count_prices={1: 520, 2: 1314},
                  allow_specify=True,
                  max_specified_count=2,
                  specify_fee_default=100,
                  specify_fee_by_role={role: 100 for role in allowed_roles},
                  specify_free_min_units=2,
                  specify_free_basis="quantity",
              ))
          '''
          s = s[:start] + replacement + s[end:]

          marker = '\n\n_GAME_TEACHING_SPECS = ('
          insert = '''

          # 新下單使用不含人數語意的 canonical sweet keys；舊 fixed-seat keys 留給歷史資料。
          for _prefix, _category, _game_label, _required_game_roles in _GAME_SHARED_SERVICE_SPECS:
              _add_selectable_sweet_rule(
                  f"{_prefix}_sweet_female",
                  f"{_game_label}｜甜蜜單｜女陪",
                  category=_category,
                  allowed_roles=("female_companion",),
                  required_game_roles=_required_game_roles,
              )
              _add_selectable_sweet_rule(
                  f"{_prefix}_sweet_male",
                  f"{_game_label}｜甜蜜單｜男陪",
                  category=_category,
                  allowed_roles=("male_companion",),
                  required_game_roles=_required_game_roles,
              )
              _add_selectable_sweet_rule(
                  f"{_prefix}_sweet_any",
                  f"{_game_label}｜甜蜜單｜不限",
                  category=_category,
                  allowed_roles=COMPANION_ROLES,
                  required_game_roles=_required_game_roles,
              )
          '''
          if marker not in s:
              raise SystemExit('teaching marker missing')
          s = s.replace(marker, insert + marker, 1)
          path.write_text(s, encoding='utf-8')

          path = Path('services/orders.py')
          s = path.read_text(encoding='utf-8')
          old_group = '''def _sweet_catalog_group(prefix: str) -> dict:
              return {
                  "label": "甜蜜單",
                  "details": [
                      {"label": "女陪", "value": "female_single", "rule_key": f"{prefix}_sweet_female_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      {"label": "男陪", "value": "male_single", "rule_key": f"{prefix}_sweet_male_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      {"label": "不限", "value": "double_any", "rule_key": f"{prefix}_sweet_double_any", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                  ],
              }
          '''
          new_group = '''def _sweet_catalog_group(prefix: str) -> dict:
              return {
                  "label": "甜蜜單",
                  "details": [
                      {"label": "女陪", "value": "female", "rule_key": f"{prefix}_sweet_female", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      {"label": "男陪", "value": "male", "rule_key": f"{prefix}_sweet_male", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      {"label": "不限", "value": "any", "rule_key": f"{prefix}_sweet_any", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                  ],
              }
          '''
          if old_group not in s:
              raise SystemExit('active sweet catalog anchor missing')
          s = s.replace(old_group, new_group, 1)

          old_general = '''            "details": [
                          {"label": "女陪", "value": "female_single", "rule_key": "basic_sweet_female_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "男陪", "value": "male_single", "rule_key": "basic_sweet_male_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "不限", "value": "double_any", "rule_key": "basic_sweet_double_any", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      ],
          '''
          new_general = '''            "details": [
                          {"label": "女單陪", "value": "female_single", "rule_key": "basic_sweet_female_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "男單陪", "value": "male_single", "rule_key": "basic_sweet_male_single", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "女雙陪", "value": "female_double", "rule_key": "basic_sweet_female_double", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "男雙陪", "value": "male_double", "rule_key": "basic_sweet_male_double", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                          {"label": "雙陪(不限)", "value": "double_any", "rule_key": "basic_sweet_double_any", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24},
                      ],
          '''
          if old_general not in s:
              raise SystemExit('legacy sweet catalog anchor missing')
          s = s.replace(old_general, new_general, 1)
          s = s.replace(
              'for suffix in ("female_single", "male_single", "double_any")',
              'for suffix in ("female", "male", "any")',
          )
          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/order_rules.py services/orders.py
          git commit -m "Use canonical sweet keys without changing legacy seats"
          git push origin HEAD:main
