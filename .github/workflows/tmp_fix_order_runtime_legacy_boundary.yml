name: Temporary fix stale legacy boundary

on:
  push:
    branches:
      - refactor/remove-order-runtime-legacy-adapter-20261018

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Align remaining migration-stage boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_runtime_extraction_boundaries.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if hasattr(order_runtime, "_order_runtime_test_marker"):\n        delattr(order_runtime, "_order_runtime_test_marker")\n    order_runtime.configure_order_runtime(\n        {\n            "_order_runtime_test_marker": object(),\n        }\n    )\n'''
          new = '''    if hasattr(order_runtime, "_order_runtime_test_marker"):\n        delattr(order_runtime, "_order_runtime_test_marker")\n    assert callable(order_runtime.configure_order_runtime_explicit)\n    assert not hasattr(order_runtime, "configure_order_runtime")\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile corrected test
        run: python -m compileall -q tests/test_runtime_extraction_boundaries.py
      - name: Static boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('tests/test_runtime_extraction_boundaries.py').read_text(encoding='utf-8')
          assert 'order_runtime.configure_order_runtime(' not in text
          assert 'order_runtime.configure_order_runtime_explicit' in text
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_fix_order_runtime_legacy_boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_runtime_extraction_boundaries.py .github/workflows/tmp_fix_order_runtime_legacy_boundary.yml
          git commit -m 'Align order runtime migration boundary test'
          git push origin HEAD:refactor/remove-order-runtime-legacy-adapter-20261018
