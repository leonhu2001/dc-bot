name: point-v2-test-migration

on:
  push:
    branches:
      - feat/point-redemption-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update game service point tests
        run: python scripts/update_point_v2_game_tests.py

      - name: Remove one-shot migration helpers
        run: |
          git rm scripts/update_point_v2_game_tests.py
          git rm .github/workflows/point-v2-test-migration.yml

      - name: Commit updated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_game_service_rules.py
          git commit -m "Update game service tests for point redemption v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
