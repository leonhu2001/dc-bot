name: Restore full Golden runtime file

on:
  push:
    branches:
      - refactor/self-service-dispatch-runtime-20261015

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-dispatch-runtime-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore main Golden file and apply only required contract changes
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:tests/golden/test_critical_runtime_flows.py > /tmp/golden_main.py
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/golden_main.py').read_text(encoding='utf-8')

          old = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n'''
          new = '''class _FakeMessage:\n    def __init__(self, message_id: int, channel_id: int):\n        self.id = int(message_id)\n        self.jump_url = f"https://discord.com/channels/123/{channel_id}/{message_id}"\n        self.edits = []\n\n    async def edit(self, **kwargs):\n        self.edits.append(kwargs)\n        return self\n'''
          if old not in source:
              raise SystemExit('FakeMessage anchor missing in main Golden file')
          source = source.replace(old, new, 1)

          old = '''        self.mention = f"<#{channel_id}>"\n        self.sent = []\n\n    async def send(self, **kwargs):\n        self.sent.append(kwargs)\n        return _FakeMessage(7001, self.id)\n'''
          new = '''        self.mention = f"<#{channel_id}>"\n        self.sent = []\n        self.last_message = None\n\n    async def send(self, **kwargs):\n        self.sent.append(kwargs)\n        self.last_message = _FakeMessage(7001, self.id)\n        return self.last_message\n'''
          if old not in source:
              raise SystemExit('FakeTextChannel anchor missing in main Golden file')
          source = source.replace(old, new, 1)

          old = '''    assert len(dispatch_channel.sent) == 1\n    assert len(web_upserts) == 1\n'''
          new = '''    assert len(dispatch_channel.sent) == 1\n    assert dispatch_channel.sent[0]["view"] is None\n    assert dispatch_channel.last_message is not None\n    assert len(dispatch_channel.last_message.edits) == 1\n    assert dispatch_channel.last_message.edits[0]["view"] is not None\n    assert len(web_upserts) == 1\n'''
          if old not in source:
              raise SystemExit('Golden assertion anchor missing in main file')
          source = source.replace(old, new, 1)

          Path('tests/golden/test_critical_runtime_flows.py').write_text(source, encoding='utf-8')
          PY
      - name: Commit restored Golden file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/test_critical_runtime_flows.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Restore complete Golden Flow coverage"
          git push origin HEAD:refactor/self-service-dispatch-runtime-20261015
