name: Apply wallet retry safety

on:
  push:
    branches:
      - fix/wallet-payment-idempotent-retry-20261013

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallet-payment-idempotent-retry-20261013
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: python tools/apply_wallet_retry_safety.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Validate wallet retry safety
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile services/wallet_service.py services/order_runtime.py services/order_payment_runtime.py services/order_wallet_reconciliation.py
          python -m pytest -q tests/test_wallet_service_canonicalization.py tests/test_payment_method_runtime_contract.py tests/test_order_wallet_reconciliation.py tests/test_wallet_order_amount_adjustment_flow.py
      - name: Commit patch and remove one-shot tooling
        run: |
          rm .github/workflows/apply_wallet_retry_safety.yml tools/apply_wallet_retry_safety.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make wallet order payment retries idempotent"
          git push
