name: Apply loyalty edit reconciliation

on:
  push:
    branches:
      - fix/reconcile-loyalty-after-closed-order-edit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/reconcile-loyalty-after-closed-order-edit
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/_apply_loyalty_edit_reconcile.py

      - name: Validate formatting
        run: git diff --check

      - name: Compile changed Python
        run: |
          python -m compileall -q \
            services/loyalty_benefits.py \
            web/app/routers/admin.py \
            web/app/services/admin_customer_loyalty.py \
            tests/test_loyalty_benefits.py \
            tests/test_admin_customer_loyalty.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Run targeted tests
        env:
          WEB_SECRET_KEY: ci-only-secret-key-not-for-production
          WEB_COOKIE_HTTPS_ONLY: "false"
          WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
          DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
        run: |
          python -m pytest -q \
            tests/test_loyalty_benefits.py \
            tests/test_admin_customer_loyalty.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/loyalty_benefits.py \
            web/app/routers/admin.py \
            web/app/services/admin_customer_loyalty.py \
            web/app/templates/admin_customer_benefits.html \
            tests/test_loyalty_benefits.py \
            tests/test_admin_customer_loyalty.py
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "Reconcile loyalty after closed order edits"
          git push origin HEAD:fix/reconcile-loyalty-after-closed-order-edit
