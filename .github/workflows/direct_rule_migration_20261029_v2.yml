name: Direct canonical order rule migration v2

on:
  push:
    paths:
      - .github/workflows/direct_rule_migration_20261029_v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply canonical source migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/direct_rule_migration_20261029.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n          git config user.name"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          script = script.replace(
              "s = once(s, old, new, 'latest direct game price')",
              "s = s.replace(old, new)",
          )
          compile(script, '<canonical-migration>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests/test_companion_count_finish_20261028.py
          if git diff --cached --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git commit -m "Make companion count rules canonical"
          git push origin HEAD:main
