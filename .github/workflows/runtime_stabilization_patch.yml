name: Runtime Stabilization Patch

on:
  push:
    branches:
      - fix/runtime-extraction-stabilization

permissions:
  contents: write

jobs:
  apply-runtime-import-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-extraction-stabilization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply guarded import fix
        run: python scripts/apply_runtime_extraction_stabilization.py

      - name: Commit bot.py if changed
        shell: bash
        run: |
          if git diff --quiet -- bot.py; then
            echo "bot.py already stabilized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Fix canonical runtime imports in bot entrypoint"
          git push origin HEAD:fix/runtime-extraction-stabilization
