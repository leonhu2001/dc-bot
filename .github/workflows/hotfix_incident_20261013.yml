name: Incident hotfix 20261013

on:
  push:
    branches:
      - hotfix/incident-20261013-order-admin
    paths:
      - tools/hotfix_incident_20261013.py
      - .github/workflows/hotfix_incident_20261013.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-incident-hotfix.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/incident-20261013-order-admin
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply incident hotfix
        run: python tools/hotfix_incident_20261013.py

      - name: Validate incident hotfix
        run: |
          python -m compileall -q bot.py services web/app tests tools
          python tools/runtime_import_smoke.py
          python -m pytest -q tests/test_incident_hotfix_20261013.py tests/test_deploy_runtime_import_preflight.py

      - name: Commit hotfix and remove one-shot scaffold
        run: |
          set -Eeuo pipefail
          rm -f tools/hotfix_incident_20261013.py .github/workflows/hotfix_incident_20261013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix self-service send and admin dashboard regressions"
          git push origin HEAD:hotfix/incident-20261013-order-admin
