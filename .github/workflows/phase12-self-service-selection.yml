name: Phase 12 self-service selection extraction

on:
  push:
    branches:
      - refactor/phase12-self-service-selection-runtime-20261013
    paths:
      - tools/phase12_extract_self_service_selection.py
      - .github/workflows/phase12-self-service-selection.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-phase12-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase12-self-service-selection-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Extract selection runtime
        run: python tools/phase12_extract_self_service_selection.py
      - name: Validate extracted runtime
        run: |
          python -m compileall -q bot.py services views tests tools
          python tools/runtime_import_smoke.py
          python -m pytest -q tests/test_self_service_selection_runtime_extraction.py tests/test_architecture_growth_budget.py tests/test_deploy_runtime_import_preflight.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit extracted runtime
        run: |
          set -Eeuo pipefail
          rm -f tools/phase12_extract_self_service_selection.py .github/workflows/phase12-self-service-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract self-service selection runtime"
          git push origin HEAD:refactor/phase12-self-service-selection-runtime-20261013
