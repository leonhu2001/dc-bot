name: Apply member portal marker migration

on:
  push:
    branches:
      - fix/member-portal-marker-migration

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[member-portal-marker-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/member-portal-marker-migration
          fetch-depth: 0

      - name: Patch legacy marker detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogs/staff_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if str(message.embeds[0].footer.text or "") == MEMBER_PORTAL_MARKER:\n                    existing = message\n                    break\n'''
          new = '''                footer_text = str(message.embeds[0].footer.text or "")\n                if footer_text in {MEMBER_PORTAL_MARKER, "MAWAN_MEMBER_PORTAL_V1"}:\n                    existing = message\n                    break\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/_apply_member_portal_marker_migration.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cogs/staff_sync.py .github/workflows/_apply_member_portal_marker_migration.yml
          git commit -m "Migrate existing member portal panel marker [member-portal-marker-done]"
          git push origin HEAD:fix/member-portal-marker-migration
