name: Apply VIP member move permission fix

on:
  push:
    branches:
      - fix/vip-member-move-permission

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vip-move-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/vip-member-move-permission
          fetch-depth: 0

      - name: Patch source permission policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("views/voice.py")
          text = path.read_text(encoding="utf-8")

          helper_anchor = (
              "        manage_messages=True if manage_channels else None,\n"
              "    )"
          )
          helper = (
              "\n\n\n"
              "def build_vip_owner_overwrite() -> discord.PermissionOverwrite:\n"
              "    \"\"\"VIP 房主不明確覆寫「移動成員」，讓該權限維持 Discord 的繼承狀態。\"\"\"\n"
              "    overwrite = build_full_temp_voice_overwrite(connect=True)\n"
              "    overwrite.move_members = None\n"
              "    return overwrite"
          )
          if text.count(helper_anchor) != 1:
              raise SystemExit(f"owner helper anchor count={text.count(helper_anchor)}")
          text = text.replace(helper_anchor, helper_anchor + helper, 1)

          start = text.index("def build_vip_whitelist_overwrite() -> discord.PermissionOverwrite:")
          end = text.index("\n\n\nasync def grant_vip_whitelist_access", start)
          block = text[start:end]
          if block.count("        move_members=False,\n") != 1:
              raise SystemExit("VIP whitelist move_members marker changed")
          block = block.replace("        move_members=False,\n", "        move_members=None,\n", 1)
          text = text[:start] + block + text[end:]

          start = text.index("async def sync_vip_whitelist_permissions(")
          end = text.index("\n\n\ndef build_play_lobby_overwrites", start)
          block = text[start:end]
          old_doc = "    \"\"\"把 DB 白名單補回 Discord overwrite；Bot 重啟後仍有效。\"\"\"\n"
          if block.count(old_doc) != 1:
              raise SystemExit("VIP sync doc marker changed")
          owner_sync = (
              "    \"\"\"同步 VIP 房主與白名單個人權限；Bot 重啟後也會修正既有房間。\"\"\"\n"
              "    owner = voice_channel.guild.get_member(int(owner_id))\n"
              "    if owner is not None and not owner.bot:\n"
              "        owner_overwrite = voice_channel.overwrites_for(owner)\n"
              "        if owner_overwrite.move_members is not None:\n"
              "            owner_overwrite.move_members = None\n"
              "            await voice_channel.set_permissions(\n"
              "                owner,\n"
              "                overwrite=owner_overwrite,\n"
              "                reason=\"Normalize VIP owner move-members permission\",\n"
              "            )\n\n"
          )
          block = block.replace(old_doc, owner_sync, 1)
          text = text[:start] + block + text[end:]

          start = text.index("def build_vip_room_overwrites(guild: discord.Guild, member: discord.Member) -> dict:")
          end = text.index("\n\ndef build_public_lobby_overwrites", start)
          block = text[start:end]
          old_owner = "        member: build_full_temp_voice_overwrite(connect=True),"
          if block.count(old_owner) != 1:
              raise SystemExit("VIP room owner builder marker changed")
          block = block.replace(old_owner, "        member: build_vip_owner_overwrite(),", 1)
          text = text[:start] + block + text[end:]

          owner_tail = (
              "    owner_overwrite.use_external_stickers = True\n"
              "    overwrites[owner] = owner_overwrite"
          )
          owner_tail_fixed = (
              "    owner_overwrite.use_external_stickers = True\n"
              "    owner_overwrite.move_members = None\n"
              "    overwrites[owner] = owner_overwrite"
          )

          for function_name, next_name in (
              ("async def apply_voice_lock_state(", "\n\nasync def apply_voice_hidden_state("),
              ("async def apply_voice_hidden_state(", "\nVOICE_ROOM_NAME_SEPARATORS"),
          ):
              start = text.index(function_name)
              end = text.index(next_name, start)
              block = text[start:end]
              if block.count(owner_tail) != 1:
                  raise SystemExit(f"owner control marker changed in {function_name}")
              block = block.replace(owner_tail, owner_tail_fixed, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/test_vip_voice_move_permissions.py <<'PY'
          import asyncio

          import discord

          from views import voice


          def test_vip_owner_move_members_is_inherited():
              overwrite = voice.build_vip_owner_overwrite()

              assert overwrite.move_members is None
              assert overwrite.view_channel is True
              assert overwrite.connect is True
              assert overwrite.manage_channels is False


          def test_vip_whitelist_move_members_is_inherited():
              overwrite = voice.build_vip_whitelist_overwrite()

              assert overwrite.move_members is None
              assert overwrite.view_channel is True
              assert overwrite.connect is True
              assert overwrite.manage_channels is False


          def test_default_temp_voice_policy_is_unchanged():
              overwrite = voice.build_full_temp_voice_overwrite(connect=True)

              assert overwrite.move_members is False


          def test_existing_vip_owner_explicit_deny_is_normalized(monkeypatch):
              class Owner:
                  id = 123
                  bot = False

              owner = Owner()
              existing = discord.PermissionOverwrite(
                  view_channel=True,
                  connect=True,
                  move_members=False,
              )

              class Guild:
                  def get_member(self, user_id):
                      return owner if int(user_id) == owner.id else None

              class Channel:
                  guild = Guild()

                  def __init__(self):
                      self.updated = None

                  def overwrites_for(self, member):
                      assert member is owner
                      return existing

                  async def set_permissions(self, member, *, overwrite, reason):
                      assert member is owner
                      self.updated = overwrite

              channel = Channel()
              monkeypatch.setattr(voice, "get_vip_room_whitelist_user_ids", lambda _owner_id: set())

              asyncio.run(voice.sync_vip_whitelist_permissions(channel, owner.id))

              assert channel.updated is not None
              assert channel.updated.move_members is None
              assert channel.updated.view_channel is True
              assert channel.updated.connect is True
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate patch
        run: |
          python -m py_compile views/voice.py
          python -m pytest -q tests/test_vip_voice_move_permissions.py

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vip-member-move-permission-fix.yml
          git add views/voice.py tests/test_vip_voice_move_permissions.py
          git commit -m "Fix VIP personal move-member inheritance [vip-move-fix-applied]"
          git push origin HEAD:fix/vip-member-move-permission
