name: Phase7 worker tips extraction

on:
  push:
    branches:
      - refactor/phase7-review-tips-20261013
    paths:
      - tools/phase7_extract_worker_tips.py
      - tools/phase7_fix_worker_tip_store.py
      - .github/workflows/phase7-worker-tips.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase7-review-tips-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile extractors
        run: python -m py_compile tools/phase7_extract_worker_tips.py tools/phase7_fix_worker_tip_store.py
      - name: Extract worker-tip service and views
        run: |
          python tools/phase7_extract_worker_tips.py
          python tools/phase7_fix_worker_tip_store.py
      - name: Validate worker-tip extraction
        run: |
          python -m compileall -q services views tests
          python -m pytest -q tests/test_worker_tip_extraction.py tests/test_architecture_growth_budget.py tests/test_post_close_status.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit extracted worker-tip modules
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker_tips.py views/worker_tips.py views/review.py tests/test_worker_tip_extraction.py tests/test_architecture_growth_budget.py
          git commit -m "Extract worker-tip service and views"
          git pull --rebase origin refactor/phase7-review-tips-20261013
          git push origin HEAD:refactor/phase7-review-tips-20261013
