name: Extract self-service dispatch runtime

on:
  push:
    branches:
      - refactor/self-service-dispatch-runtime-20261015

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/self-service-dispatch-runtime-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract dispatch creation core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/self_service_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          start_marker = 'async def create_waiting_acceptance_order_from_self_service(\n'
          end_marker = 'async def retract_waiting_acceptance_order_from_self_service(\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          function_source = text[start:end].rstrip() + '\n'

          old_header = '''async def create_waiting_acceptance_order_from_self_service(\n    interaction: discord.Interaction,\n    *,\n    customer_id: int,\n    channel_id: int,\n) -> str:\n'''
          new_header = '''async def create_waiting_acceptance_order(\n    interaction: discord.Interaction,\n    *,\n    customer_id: int,\n    channel_id: int,\n    deps: SelfServiceDispatchDeps,\n) -> str:\n    DISPATCH_CHANNEL_ID = int(deps.dispatch_channel_id)\n    SELF_SERVICE_ORDER_SELECTIONS = deps.order_selections\n    ORDER_CLAIMS = deps.order_claims\n    _to_int = deps.to_int\n    _get_rule_from_self_service_data = deps.get_rule_from_data\n    normalize_self_service_staff_count = deps.normalize_staff_count\n    _resolve_specified_roles_for_price = deps.resolve_specified_roles\n    apply_self_service_financials_to_order_data = deps.apply_financials\n    ORDER_CATEGORY_LABELS = deps.category_labels\n    _member_display_name = deps.member_display_name\n    build_self_service_order_embed = deps.build_order_embed\n    _format_plain_amount = deps.format_amount\n    add_self_service_financial_breakdown_fields = deps.add_financial_fields\n    prepare_initial_smart_dispatch = deps.prepare_initial_dispatch\n    DispatchClaimView = deps.dispatch_claim_view\n    remember_order_data = deps.remember_order\n    is_customer_staff = deps.is_customer_staff\n    create_smart_dispatch_plan = deps.create_dispatch_plan\n    send_specified_staff_dispatch_dms = deps.send_specified_dms\n    set_specified_dm_results = deps.set_specified_dm_results\n    get_taipei_now_iso = deps.now_iso\n    remember_claim_data = deps.remember_claim\n    save_bot_data = deps.save_data\n    send_initial_smart_dispatch_alert = deps.send_initial_alert\n    send_order_log = deps.order_log_sender\n    get_self_service_quantity_unit = deps.quantity_unit\n    log_self_service_proxy_action = deps.proxy_logger\n'''
          if not function_source.startswith(old_header):
              raise SystemExit('dispatch function header did not match expected source')
          moved_function = function_source.replace(old_header, new_header, 1)

          module = '''from __future__ import annotations\n\nimport json\nfrom dataclasses import dataclass\nfrom typing import Any, Callable, Mapping\n\nimport discord\n\n\n@dataclass(frozen=True)\nclass SelfServiceDispatchDeps:\n    dispatch_channel_id: int\n    order_selections: dict\n    order_claims: dict\n    to_int: Callable[..., Any]\n    get_rule_from_data: Callable[[dict], Any]\n    normalize_staff_count: Callable[[dict], Any]\n    resolve_specified_roles: Callable[..., Any]\n    apply_financials: Callable[..., dict]\n    category_labels: Mapping[str, str]\n    member_display_name: Callable[..., str]\n    build_order_embed: Callable[..., discord.Embed]\n    format_amount: Callable[..., str]\n    add_financial_fields: Callable[..., Any]\n    prepare_initial_dispatch: Callable[..., dict]\n    dispatch_claim_view: Callable[..., discord.ui.View]\n    remember_order: Callable[..., Any]\n    is_customer_staff: Callable[..., bool]\n    create_dispatch_plan: Callable[..., Any]\n    send_specified_dms: Callable[..., Any]\n    set_specified_dm_results: Callable[..., Any]\n    now_iso: Callable[[], str]\n    remember_claim: Callable[..., Any]\n    save_data: Callable[[], Any]\n    send_initial_alert: Callable[..., Any]\n    order_log_sender: Callable[..., Any]\n    quantity_unit: Callable[..., str]\n    proxy_logger: Callable[..., Any]\n\n\n'''
          Path('services/self_service_dispatch_runtime.py').write_text(
              module + moved_function,
              encoding='utf-8',
          )

          import_anchor = 'from services.self_service_dispatch_cleanup import cleanup_failed_self_service_dispatch\n'
          import_block = import_anchor + '''from services.self_service_dispatch_runtime import (\n    SelfServiceDispatchDeps,\n    create_waiting_acceptance_order as create_self_service_waiting_acceptance_order,\n)\n'''
          if import_anchor not in text:
              raise SystemExit('dispatch cleanup import anchor missing')
          text = text.replace(import_anchor, import_block, 1)

          wrapper = '''async def create_waiting_acceptance_order_from_self_service(\n    interaction: discord.Interaction,\n    *,\n    customer_id: int,\n    channel_id: int,\n) -> str:\n    return await create_self_service_waiting_acceptance_order(\n        interaction,\n        customer_id=customer_id,\n        channel_id=channel_id,\n        deps=SelfServiceDispatchDeps(\n            dispatch_channel_id=DISPATCH_CHANNEL_ID,\n            order_selections=SELF_SERVICE_ORDER_SELECTIONS,\n            order_claims=ORDER_CLAIMS,\n            to_int=_to_int,\n            get_rule_from_data=_get_rule_from_self_service_data,\n            normalize_staff_count=normalize_self_service_staff_count,\n            resolve_specified_roles=_resolve_specified_roles_for_price,\n            apply_financials=apply_self_service_financials_to_order_data,\n            category_labels=ORDER_CATEGORY_LABELS,\n            member_display_name=_member_display_name,\n            build_order_embed=build_self_service_order_embed,\n            format_amount=_format_plain_amount,\n            add_financial_fields=add_self_service_financial_breakdown_fields,\n            prepare_initial_dispatch=prepare_initial_smart_dispatch,\n            dispatch_claim_view=DispatchClaimView,\n            remember_order=remember_order_data,\n            is_customer_staff=is_customer_staff,\n            create_dispatch_plan=create_smart_dispatch_plan,\n            send_specified_dms=send_specified_staff_dispatch_dms,\n            set_specified_dm_results=set_specified_dm_results,\n            now_iso=get_taipei_now_iso,\n            remember_claim=remember_claim_data,\n            save_data=save_bot_data,\n            send_initial_alert=send_initial_smart_dispatch_alert,\n            order_log_sender=send_order_log,\n            quantity_unit=get_self_service_quantity_unit,\n            proxy_logger=log_self_service_proxy_action,\n        ),\n    )\n\n\n'''
          text = text[:start] + wrapper + text[end:]

          allow_anchor = '        "cleanup_failed_self_service_dispatch",\n'
          if allow_anchor not in text:
              raise SystemExit('module-owned allowlist anchor missing')
          text = text.replace(
              allow_anchor,
              allow_anchor
              + '        "SelfServiceDispatchDeps",\n'
              + '        "create_self_service_waiting_acceptance_order",\n',
              1,
          )

          runtime_path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile services/self_service_runtime.py services/self_service_dispatch_runtime.py
      - name: Commit extracted runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/self_service_runtime.py services/self_service_dispatch_runtime.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Extract self-service dispatch creation runtime"
          git push origin HEAD:refactor/self-service-dispatch-runtime-20261015
