name: Verify order payment runtime

on:
  push:
    branches:
      - verify/order-payment-runtime-20261018

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-payment-verify.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile payment runtime paths
        run: python -m compileall -q bot.py services shared views web/app
      - name: Run payment runtime verification
        run: |
          python -m pytest -q \
            tests/test_order_payment_composition.py \
            tests/test_order_child_composition.py \
            tests/test_payment_method_runtime_contract.py \
            tests/test_payment_panel_and_dispatch_source_regressions.py \
            tests/test_payment_review_runtime_dependencies.py \
            tests/test_payment_review_runtime_import_boundary.py \
            tests/test_payment_reviews.py \
            tests/test_acceptance_payment_panel_boundary.py \
            tests/test_order_close_payment_guard.py \
            tests/test_order_wallet_reconciliation.py \
            tests/test_wallet_order_amount_adjustment_flow.py \
            tests/test_wallet_principal_bonus_policy.py \
            tests/test_wallet_refunds.py \
            tests/test_zero_amount_checkout.py \
            tests/test_deploy_runtime_import_preflight.py
      - name: Run golden flows
        run: python -m pytest -q tests/golden
