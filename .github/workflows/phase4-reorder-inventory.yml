name: Phase4 reorder inventory

on:
  push:
    branches:
      - refactor/phase4-reorder-runtime-20261013
    paths:
      - tools/phase4_reorder_inventory.py
      - .github/workflows/phase4-reorder-inventory.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase4-reorder-runtime-20261013
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/phase4_reorder_inventory.py
