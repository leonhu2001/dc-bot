name: Temporary order payment composition patch

on:
  push:
    branches:
      - refactor/order-payment-composition-20261018

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/order-payment-composition-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply bounded patch
        run: python tools/tmp_patch_order_payment_composition.py
      - name: Compile changed Python
        run: python -m py_compile services/wallet_discord_runtime.py services/order_payment_composition.py services/order_child_composition.py services/order_runtime.py bot.py
      - name: Run bounded static checks
        run: |
          python -m pytest -q tests/test_architecture_growth_budget.py
          python - <<'PY'
          from pathlib import Path
          order_runtime = Path('services/order_runtime.py').read_text(encoding='utf-8')
          child = Path('services/order_child_composition.py').read_text(encoding='utf-8')
          bot = Path('bot.py').read_text(encoding='utf-8')
          assert 'payment_keys =' not in order_runtime
          assert 'configure_order_payment_runtime(' not in order_runtime
          assert 'storage_keys =' in order_runtime
          assert 'configure_order_payment_composition(' in child
          assert 'from services.wallet_discord_runtime import (' in bot
          assert 'def adjust_customer_wallet_balance(' not in bot
          PY
      - name: Remove temporary helpers and commit
        run: |
          rm tools/tmp_patch_order_payment_composition.py
          rm .github/workflows/tmp_order_payment_composition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move order payment composition out of legacy runtime'
          git push origin HEAD:refactor/order-payment-composition-20261018
