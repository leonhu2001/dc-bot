name: Phase 10 CSP style attrs

on:
  push:
    branches:
      - refactor/phase10-csp-style-attrs-v3-20261013
    paths:
      - tools/phase10_remove_style_attrs.py
      - tools/phase10_update_http_security_test.py
      - .github/workflows/phase10-style-attrs.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-phase10-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase10-csp-style-attrs-v3-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Generate canonical CSP migration
        run: |
          python tools/phase10_remove_style_attrs.py
          python tools/phase10_update_http_security_test.py
      - name: Validate generated tree
        run: |
          python -m compileall -q bot.py cogs core services shared views web/app tools scripts tests
          python tools/audit_templates.py
          python -m pytest -q tests/test_csp_style_attr_lockdown.py tests/test_http_security.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit generated source
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire template style attributes under strict CSP"
          git push origin HEAD:refactor/phase10-csp-style-attrs-v3-20261013
