name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            bot.py \
            cogs \
            core \
            services \
            shared \
            views \
            web/app \
            tools \
            scripts

      - name: Audit templates and static references
        continue-on-error: true
        run: |
          python tools/audit_templates.py

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r web/requirements-web.txt

      - name: Validate deploy shell
        run: |
          bash -n scripts/deploy_main.sh

      - name: Run Golden Flows
        run: |
          python -m pytest -q tests/golden

      - name: Run VIP timer payout regression
        run: |
          python -m pytest -q tests/test_vip_timer_roster_v7.py

      - name: Install Chromium for browser tests
        run: |
          python -m playwright install --with-deps chromium

      - name: Run browser smoke flows
        run: |
          set -Eeuo pipefail
          python -m uvicorn web.app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            >/tmp/dc-bot-web-ci.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/dc-bot-web-ci.log
            exit 1
          fi

          python -m pytest -q tests/e2e
