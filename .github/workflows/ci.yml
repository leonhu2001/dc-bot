name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/payment-qr-profile-tips-isolated-20261109
      - release/payment-qr-tips-bonus-no-price-20261110
      - fix/profile-tip-ticket-close-ledger-and-nov-bonus-20261110
      - fix/verified-nov-bonus-accounting-alerts-20261110
      - feat/nov10-lol-apex-steam-pricing-remove-public-price-button
      - fix/admin-order-rules-verified-edit-20261110
      - fix/tips-excluded-performance-employee-salary-pagination-20261111
      - feat/delta-farm-ammo-crash-fixed-cuts-20261111
      - fix/retire-mouth-organ-and-old-halfcoin-20261111
      - feat/main-support-panel-channel-links-20261111
      - fix/support-panel-order-guide-recruit-examiner-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            bot.py \
            cogs \
            core \
            services \
            shared \
            views \
            web/app \
            tools \
            scripts

      - name: Audit templates and static references
        run: |
          python tools/audit_templates.py

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r web/requirements-web.txt

      - name: Validate deploy shell
        run: |
          bash -n scripts/deploy_main.sh
          bash -n scripts/deploy_payment_bonus.sh
          bash -n scripts/deploy_verified_nov_bonus_accounting_20261110.sh
          bash -n scripts/deploy_nov10_game_prices.sh

      - name: Validate deploy PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/deploy_main.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate isolated release PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/deploy_payment_bonus.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate Nov 10 game-price PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/deploy_nov10_game_prices.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run Golden Flows
        run: |
          python -m pytest -q tests/golden

      - name: Run regression suite
        run: |
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e

      # This isolated release changes only Discord panel/recruitment code;
      # no Web/browser source is touched. The GitHub-hosted Ubuntu mirror is
      # intermittently DNS-unreachable (security.ubuntu.com), so avoid an
      # unrelated apt browser-dependency install for this bot-only release.
      # All golden and Python regressions, including recruit role and original
      # panel integration tests, remain mandatory. Other branches still run
      # the full browser suite unchanged.
      - name: Install Chromium for browser tests
        if: github.ref_name != 'fix/support-panel-order-guide-recruit-examiner-20261111'
        run: |
          python -m playwright install --with-deps chromium

      - name: Run browser smoke flows
        if: github.ref_name != 'fix/support-panel-order-guide-recruit-examiner-20261111'
        run: |
          set -Eeuo pipefail
          python -m uvicorn web.app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            >/tmp/dc-bot-web-ci.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/dc-bot-web-ci.log
            exit 1
          fi

          python -m pytest -q tests/e2e
