name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply one-shot source repair
        if: github.event_name == 'push' && github.event.head_commit.message == 'Retry source repair through CI'
        run: |
          python .github/repair_payment_dispatch_source.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q             bot.py             cogs             core             services             shared             web/app

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r web/requirements-web.txt

      - name: Validate deploy shell
        run: |
          bash -n scripts/deploy_main.sh

      - name: Run Golden Flows
        run: |
          python -m pytest -q tests/golden

      - name: Run regression suite
        run: |
          python -m pytest -q tests --ignore=tests/golden

      - name: Commit repaired source
        if: github.event_name == 'push' && github.event.head_commit.message == 'Retry source repair through CI'
        run: |
          if git diff --quiet -- bot.py views/smart_dispatch.py tests/test_payment_panel_and_dispatch_source_regressions.py; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py views/smart_dispatch.py tests/test_payment_panel_and_dispatch_source_regressions.py
          git commit -m "Fix payment panel copy and dispatch reminder stages"
          git push origin HEAD:main
