name: Phase3 extract static inline

on:
  push:
    branches:
      - refactor/phase3-csp-runtime-20261013
    paths:
      - tools/phase3_extract_static_inline.py
      - .github/workflows/phase3-extract-static-inline.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase3-csp-runtime-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install template audit dependency
        run: python -m pip install "jinja2==3.1.6"
      - name: Extract static inline blocks
        run: python tools/phase3_extract_static_inline.py
      - name: Audit extracted tree
        run: python tools/audit_templates.py
      - name: Commit extracted assets
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract static inline CSS and JavaScript"
          git pull --rebase origin refactor/phase3-csp-runtime-20261013
          git push origin HEAD:refactor/phase3-csp-runtime-20261013
