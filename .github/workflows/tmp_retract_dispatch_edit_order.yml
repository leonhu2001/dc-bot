name: Temporary retract dispatch edit order

on:
  push:
    branches:
      - feature/retract-dispatch-edit-order-20261015

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-retract-test.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retract-dispatch-edit-order-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply patch
        run: python .github/tmp_patch_retract.py
      - name: Targeted validation
        run: |
          python -m py_compile services/self_service_runtime.py shared/web_order_sync.py bot.py tests/test_self_service_retract_dispatch.py
          python -m pytest -q tests/test_self_service_retract_dispatch.py tests/golden/test_critical_runtime_flows.py
      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/workflows/tmp_retract_dispatch_edit_order.yml .github/tmp_patch_retract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add retract dispatch edit flow"
          git push origin HEAD:feature/retract-dispatch-edit-order-20261015
