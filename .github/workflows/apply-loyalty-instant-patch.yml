name: Apply loyalty instant patch

on:
  push:
    branches:
      - feature/entertainment-ranked-instant-loyalty

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/entertainment-ranked-instant-loyalty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python scripts/apply_loyalty_instant_patch.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 0
          fi
          git commit -m "Enable instant entertainment loyalty redemption"
          git push origin HEAD:feature/entertainment-ranked-instant-loyalty
