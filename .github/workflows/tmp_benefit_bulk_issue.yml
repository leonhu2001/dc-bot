name: Temporary benefit bulk issue patch

on:
  push:
    branches:
      - feature/benefit-bulk-issue-20261018
    paths:
      - .github/workflows/tmp_benefit_bulk_issue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/benefit-bulk-issue-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply bounded patch
        run: python tools/tmp_patch_benefit_bulk_issue.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile changed Python
        run: |
          python -m py_compile services/promotion_benefit_presentation.py web/app/routers/admin_benefits.py web/app/routers/site.py views/member_portal.py
      - name: Run focused tests
        env:
          WEB_SECRET_KEY: focused-test-secret
          WEB_COOKIE_HTTPS_ONLY: 'false'
          WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
          DATABASE_URL: sqlite:////tmp/dc-bot-benefit-focused.db
        run: |
          python -m pytest -q \
            tests/test_promotion_benefits.py \
            tests/test_promotion_benefit_admin.py \
            tests/test_member_center_template_render.py \
            tests/test_member_portal_polish.py \
            tests/test_member_benefit_expiry_display.py
      - name: Remove temporary helpers and commit
        run: |
          rm -f tools/tmp_patch_benefit_bulk_issue.py .github/workflows/tmp_benefit_bulk_issue.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add bulk benefit issue notifications and customer visibility'
          git push origin HEAD:feature/benefit-bulk-issue-20261018
