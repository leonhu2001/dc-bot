name: Temporary Web Sync Self-Service Bridge Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v7
        with:
          ref: refactor/web-sync-self-service-bridge-20261018

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract self-service bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("services/web_sync/runtime.py")
          source = runtime_path.read_text(encoding="utf-8")
          start_marker = "# BEGIN MAWAN_R13_UNIFIED_WEBSITE_ORDER_FLOW\n"
          end_marker = "# END MAWAN_R13_UNIFIED_WEBSITE_ORDER_FLOW\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("R13 self-service bridge markers not found exactly once")

          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          block = source[start:end].strip() + "\n"
          source = source[:start] + source[end:]

          bridge_prefix = '''from __future__ import annotations

          from typing import Any

          import discord

          from core.database import remember_order_data, save_bot_data
          from services.orders import (
              ORDER_CATEGORY_LABELS,
              ORDER_ITEM_GROUPS_BY_CATEGORY,
              _to_int,
              get_order_item_details_for_group,
              get_order_item_group_label,
          )
          from services.self_service_ui_runtime import (
              SelfServiceOrderView,
              build_self_service_panel_embed,
          )
          from services.web_sync.discord_helpers import (
              has_footer as _web_order_created_has_footer,
          )
          from services.web_sync.presentation import (
              build_order_created_details as _web_order_created_details,
          )
          from shared.order_state import (
              PENDING_CS_DISPATCH as WEB_ORDER_PENDING_CS_DISPATCH,
          )


          _CONFIGURED = False

          CUSTOMER_ROLE_ID: int
          OrderControlView: type[discord.ui.View]
          SELF_SERVICE_ORDER_SELECTIONS: dict[int, dict[str, Any]]


          def configure_web_sync_self_service_bridge(
              *,
              customer_role_id: int,
              order_control_view_type: type[discord.ui.View],
              order_selections: dict[int, dict[str, Any]],
          ) -> None:
              """Bind only bot-owned state needed by the website self-service bridge."""
              global _CONFIGURED
              global CUSTOMER_ROLE_ID, OrderControlView, SELF_SERVICE_ORDER_SELECTIONS

              CUSTOMER_ROLE_ID = int(customer_role_id)
              OrderControlView = order_control_view_type
              SELF_SERVICE_ORDER_SELECTIONS = order_selections
              _CONFIGURED = True


          '''
          bridge_path = Path("services/web_sync/self_service_bridge.py")
          bridge_path.write_text(bridge_prefix + block, encoding="utf-8")

          old_orders_import = '''from services.orders import (
              ORDER_CATEGORY_LABELS,
              ORDER_ITEM_GROUPS_BY_CATEGORY,
              _to_int,
              get_order_item_details_for_group,
              get_order_item_group_label,
          )
          '''
          if old_orders_import not in source:
              raise SystemExit("services.orders import block not found")
          source = source.replace(old_orders_import, "from services.orders import _to_int\n", 1)

          old_ui_import = '''from services.self_service_ui_runtime import (
              SelfServiceOrderView,
              build_self_service_panel_embed,
          )
          '''
          if old_ui_import not in source:
              raise SystemExit("self_service_ui_runtime import block not found")
          source = source.replace(old_ui_import, "", 1)

          presentation_import = '''from services.web_sync.presentation import (
              build_order_created_details as _web_order_created_details,
          )
          '''
          bridge_import = '''from services.web_sync.self_service_bridge import (
              configure_web_sync_self_service_bridge,
              _r13_ensure_website_unified_panels,
              _r13_seed_website_order_into_self_service,
          )
          '''
          if presentation_import not in source:
              raise SystemExit("presentation import anchor not found")
          source = source.replace(
              presentation_import,
              presentation_import + bridge_import,
              1,
          )

          source = source.replace(
              "OrderControlView: type[discord.ui.View]\n",
              "",
              1,
          )
          old_global = "    global ORDER_CLAIMS, OrderControlView, SELF_SERVICE_ORDER_SELECTIONS, bot\n"
          new_global = "    global ORDER_CLAIMS, SELF_SERVICE_ORDER_SELECTIONS, bot\n"
          if old_global not in source:
              raise SystemExit("runtime global declaration anchor not found")
          source = source.replace(old_global, new_global, 1)
          assignment = "    OrderControlView = order_control_view_type\n"
          if assignment not in source:
              raise SystemExit("OrderControlView assignment not found")
          source = source.replace(assignment, "", 1)

          configured_anchor = '''    SELF_SERVICE_ORDER_SELECTIONS = order_selections
              bot = bot_instance
              _CONFIGURED = True
          '''
          configured_replacement = '''    SELF_SERVICE_ORDER_SELECTIONS = order_selections
              bot = bot_instance
              configure_web_sync_self_service_bridge(
                  customer_role_id=CUSTOMER_ROLE_ID,
                  order_control_view_type=order_control_view_type,
                  order_selections=SELF_SERVICE_ORDER_SELECTIONS,
              )
              _CONFIGURED = True
          '''
          if configured_anchor not in source:
              raise SystemExit("runtime configuration anchor not found")
          source = source.replace(configured_anchor, configured_replacement, 1)
          runtime_path.write_text(source, encoding="utf-8")

          boundary_test = '''import inspect
          from pathlib import Path

          from services.web_sync import runtime as web_sync_runtime
          from services.web_sync import self_service_bridge


          EXPECTED_BRIDGE_DEPENDENCIES = {
              "customer_role_id",
              "order_control_view_type",
              "order_selections",
          }


          def test_web_sync_self_service_bridge_uses_explicit_dependencies():
              signature = inspect.signature(
                  self_service_bridge.configure_web_sync_self_service_bridge
              )
              assert set(signature.parameters) == EXPECTED_BRIDGE_DEPENDENCIES
              assert all(
                  parameter.kind is inspect.Parameter.KEYWORD_ONLY
                  for parameter in signature.parameters.values()
              )


          def test_r13_self_service_bridge_is_physically_extracted():
              runtime_source = Path("services/web_sync/runtime.py").read_text(
                  encoding="utf-8"
              )
              bridge_source = Path(
                  "services/web_sync/self_service_bridge.py"
              ).read_text(encoding="utf-8")

              assert "def _r13_seed_website_order_into_self_service" not in runtime_source
              assert "async def _r13_ensure_website_unified_panels" not in runtime_source
              assert "def _r13_seed_website_order_into_self_service" in bridge_source
              assert "async def _r13_ensure_website_unified_panels" in bridge_source
              assert "import bot" not in bridge_source
              assert "from bot import" not in bridge_source
              assert (
                  web_sync_runtime._r13_seed_website_order_into_self_service
                  is self_service_bridge._r13_seed_website_order_into_self_service
              )
              assert (
                  web_sync_runtime._r13_ensure_website_unified_panels
                  is self_service_bridge._r13_ensure_website_unified_panels
              )
          '''
          Path("tests/test_web_sync_self_service_bridge_boundary.py").write_text(
              boundary_test,
              encoding="utf-8",
          )

          growth_path = Path("tests/test_architecture_growth_budget.py")
          growth_source = growth_path.read_text(encoding="utf-8")
          old_budget = '    "services/web_sync/runtime.py": 62_000,\n'
          new_budget = (
              '    "services/web_sync/runtime.py": 54_000,\n'
              '    "services/web_sync/self_service_bridge.py": 18_000,\n'
          )
          if old_budget not in growth_source:
              raise SystemExit("Web Sync runtime budget anchor not found")
          growth_source = growth_source.replace(old_budget, new_budget, 1)
          growth_path.write_text(growth_source, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile extracted modules
        run: |
          python -m compileall -q \
            services/web_sync/runtime.py \
            services/web_sync/self_service_bridge.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_architecture_growth_budget.py

      - name: Run targeted extraction tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_web_sync_self_service_bridge.yml
          git add \
            services/web_sync/runtime.py \
            services/web_sync/self_service_bridge.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_architecture_growth_budget.py
          git commit -m "Extract Web Sync self-service bridge"
          git push origin HEAD:refactor/web-sync-self-service-bridge-20261018
