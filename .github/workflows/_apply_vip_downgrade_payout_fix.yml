name: Apply VIP downgrade and payout repair fix

on:
  push:
    branches:
      - fix/vip-downgrade-benefits-payout-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/vip-downgrade-benefits-payout-repair
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/_patch_vip_downgrade_and_payout_repair.py

      - name: Normalize files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              "shared/payout.py",
              "web/app/services/order_service.py",
              "web/app/services/accounting_reconciliation.py",
              "services/vip_monthly_benefits.py",
              "tests/test_vip_monthly_benefits.py",
              "tests/test_accounting_reconciliation.py",
              "tests/test_accounting_repair.py",
          ]:
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validate formatting
        run: git diff --check

      - name: Compile changed Python
        run: |
          python -m compileall -q \
            shared/payout.py \
            web/app/services/order_service.py \
            web/app/services/accounting_reconciliation.py \
            services/vip_monthly_benefits.py \
            tests/test_vip_monthly_benefits.py \
            tests/test_accounting_reconciliation.py \
            tests/test_accounting_repair.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Run targeted tests
        env:
          WEB_SECRET_KEY: ci-only-secret-key-not-for-production
          WEB_COOKIE_HTTPS_ONLY: "false"
          WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
          DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
        run: |
          python -m pytest -q \
            tests/test_vip_monthly_benefits.py \
            tests/test_vip_monthly_ui_contract.py \
            tests/test_accounting_reconciliation.py \
            tests/test_accounting_repair.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shared/payout.py \
            web/app/services/order_service.py \
            web/app/services/accounting_reconciliation.py \
            services/vip_monthly_benefits.py \
            tests/test_vip_monthly_benefits.py \
            tests/test_accounting_reconciliation.py \
            tests/test_accounting_repair.py
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "Fix VIP downgrade benefits and payout repair reconciliation"
          git push origin HEAD:fix/vip-downgrade-benefits-payout-repair
