name: Temporary Web Sync Order Created Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-ci-web.db
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v7
        with:
          ref: refactor/web-sync-order-created-20261018

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract order-created pipeline
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          runtime_path = Path("services/web_sync/runtime.py")
          source = runtime_path.read_text(encoding="utf-8")
          marker = "# zYao 3C3B web order created bridge v1\n"
          if source.count(marker) != 1:
              raise SystemExit(f"expected one order-created marker, found {source.count(marker)}")
          tail = source[source.index(marker):]

          amount_pattern = re.compile(
              r'        amount_text = \(\n'
              r'\s+_format_plain_amount\(\n\s+details\["amount"\]\n\s+\)\n'
              r'\s+if "_format_plain_amount"\n\s+in globals\(\)\n'
              r'\s+else format_t_amount\(\n\s+details\["amount"\]\n\s+\)\n\s+\)\n'
          )
          tail, replaced = amount_pattern.subn(
              '        amount_text = _format_plain_amount(details["amount"])\n',
              tail,
              count=1,
          )
          if replaced != 1:
              raise SystemExit(f"expected one amount-format globals fallback, replaced {replaced}")
          if "globals()" in tail:
              raise SystemExit("order-created pipeline still contains globals()")

          order_created_prefix = '''from __future__ import annotations

          from typing import Any

          import discord

          from core.database import (
              remember_claim_data,
              remember_order_data,
              save_bot_data,
          )
          from core.time_utils import get_taipei_now_iso
          from services.acceptance.runtime import _apply_acceptance_state_to_claim_data
          from services.logging_service import send_order_log
          from services.orders import _to_int
          from services.self_service_financials import _format_plain_amount
          from services.smart_dispatch import (
              create_smart_dispatch_plan,
              get_smart_dispatch_plan,
              set_specified_dm_results,
          )
          from services.ticket_identity import build_ticket_channel_name
          from services.web_sync.cs_review import WEB_ORDER_PENDING_CS_DISPATCH
          from services.web_sync.discord_helpers import (
              find_ticket as _web_order_created_find_ticket,
              get_channel as _web_order_created_get_channel,
              get_member as _web_order_created_get_member,
              has_footer as _web_order_created_has_footer,
          )
          from services.web_sync.event_store import (
              load_order_created_bundle as _web_order_created_load_bundle,
              mark_order_created_processing as _web_order_created_mark_processing,
              update_order_created_links as _web_order_created_update_links,
              mark_event_done as _web_sync_mark_event_done,
              mark_event_failed as _web_sync_mark_event_failed,
          )
          from services.web_sync.presentation import (
              build_order_created_details as _web_order_created_details,
          )
          from services.web_sync.self_service_bridge import (
              _r13_ensure_website_unified_panels,
          )
          from views.smart_dispatch import (
              prepare_initial_smart_dispatch,
              send_initial_smart_dispatch_alert,
              send_specified_staff_dispatch_dms,
          )


          _CONFIGURED = False

          CUSTOMER_CATEGORY_ID: int
          CUSTOMER_ROLE_ID: int
          DISPATCH_CHANNEL_ID: int
          GUILD_ID: int
          ORDER_CLAIMS: dict[int, dict[str, Any]]
          bot: discord.Client


          def configure_web_sync_order_created(
              *,
              customer_category_id: int,
              customer_role_id: int,
              dispatch_channel_id: int,
              guild_id: int,
              order_claims: dict[int, dict[str, Any]],
              bot_instance: discord.Client,
          ) -> None:
              """Bind only entrypoint-owned state used by the order-created pipeline."""
              global _CONFIGURED
              global CUSTOMER_CATEGORY_ID, CUSTOMER_ROLE_ID, DISPATCH_CHANNEL_ID, GUILD_ID
              global ORDER_CLAIMS, bot

              CUSTOMER_CATEGORY_ID = int(customer_category_id)
              CUSTOMER_ROLE_ID = int(customer_role_id)
              DISPATCH_CHANNEL_ID = int(dispatch_channel_id)
              GUILD_ID = int(guild_id)
              ORDER_CLAIMS = order_claims
              bot = bot_instance
              _CONFIGURED = True


          '''
          Path("services/web_sync/order_created.py").write_text(
              order_created_prefix + tail,
              encoding="utf-8",
          )

          runtime_source = '''from __future__ import annotations

          from typing import Any

          import discord

          from services.web_sync.cs_review import (
              WEB_ORDER_PENDING_CS_DISPATCH,
              WebsiteOrderCsConfirmView,
              WebsitePendingCancelConfirmView,
              configure_web_sync_cs_review,
              _web_dashboard_db_path_for_bot,
              _web_cs_order_id_from_channel,
              _web_cs_set_status,
              _web_cs_ensure_review_panel,
          )
          from services.web_sync.order_created import (
              configure_web_sync_order_created,
              _process_web_order_created_event,
              _web_order_created_ensure_dispatch,
              _web_order_created_ensure_ticket,
              _web_order_created_find_dispatch_message,
              _web_order_created_seed_state,
          )
          from services.web_sync.self_service_bridge import (
              configure_web_sync_self_service_bridge,
              _r13_ensure_website_unified_panels,
              _r13_seed_website_order_into_self_service,
          )


          _CONFIGURED = False


          def configure_web_sync_runtime_explicit(
              *,
              customer_category_id: int,
              customer_role_id: int,
              dispatch_channel_id: int,
              guild_id: int,
              order_claims: dict[int, dict[str, Any]],
              order_control_view_type: type[discord.ui.View],
              order_selections: dict[int, dict[str, Any]],
              bot_instance: discord.Client,
          ) -> None:
              """Compose Web Sync child runtimes using explicit dependencies only."""
              global _CONFIGURED

              configure_web_sync_self_service_bridge(
                  customer_role_id=customer_role_id,
                  order_control_view_type=order_control_view_type,
                  order_selections=order_selections,
              )
              configure_web_sync_order_created(
                  customer_category_id=customer_category_id,
                  customer_role_id=customer_role_id,
                  dispatch_channel_id=dispatch_channel_id,
                  guild_id=guild_id,
                  order_claims=order_claims,
                  bot_instance=bot_instance,
              )
              configure_web_sync_cs_review(
                  order_selections=order_selections,
                  ensure_dispatch=lambda *args, **kwargs: _web_order_created_ensure_dispatch(
                      *args, **kwargs
                  ),
                  seed_state=lambda *args, **kwargs: _web_order_created_seed_state(
                      *args, **kwargs
                  ),
              )
              _CONFIGURED = True
          '''
          runtime_path.write_text(runtime_source, encoding="utf-8")

          boundary_test = '''import inspect
          from pathlib import Path

          from services.web_sync import order_created
          from services.web_sync import runtime as web_sync_runtime


          EXPECTED_ORDER_CREATED_DEPENDENCIES = {
              "customer_category_id",
              "customer_role_id",
              "dispatch_channel_id",
              "guild_id",
              "order_claims",
              "bot_instance",
          }


          def test_web_sync_order_created_uses_explicit_dependencies():
              signature = inspect.signature(order_created.configure_web_sync_order_created)
              assert set(signature.parameters) == EXPECTED_ORDER_CREATED_DEPENDENCIES
              assert all(
                  parameter.kind is inspect.Parameter.KEYWORD_ONLY
                  for parameter in signature.parameters.values()
              )


          def test_order_created_pipeline_is_physically_extracted():
              runtime_source = Path("services/web_sync/runtime.py").read_text(
                  encoding="utf-8"
              )
              owner_source = Path("services/web_sync/order_created.py").read_text(
                  encoding="utf-8"
              )

              definitions = (
                  "async def _web_order_created_ensure_ticket",
                  "async def _web_order_created_find_dispatch_message",
                  "async def _web_order_created_ensure_dispatch",
                  "def _web_order_created_seed_state",
                  "async def _process_web_order_created_event",
              )
              for definition in definitions:
                  assert definition not in runtime_source
                  assert definition in owner_source

              assert "globals()" not in owner_source
              assert "import bot" not in owner_source
              assert "from bot import" not in owner_source
              assert (
                  web_sync_runtime._process_web_order_created_event
                  is order_created._process_web_order_created_event
              )
              assert (
                  web_sync_runtime._web_order_created_ensure_dispatch
                  is order_created._web_order_created_ensure_dispatch
              )
              assert (
                  web_sync_runtime._web_order_created_seed_state
                  is order_created._web_order_created_seed_state
              )
          '''
          Path("tests/test_web_sync_order_created_boundary.py").write_text(
              boundary_test,
              encoding="utf-8",
          )

          extraction_path = Path("tests/test_runtime_extraction_boundaries.py")
          extraction_source = extraction_path.read_text(encoding="utf-8")
          import_anchor = "from services.web_sync import cs_review as web_sync_cs_review\n"
          if import_anchor not in extraction_source:
              raise SystemExit("runtime extraction import anchor not found")
          extraction_source = extraction_source.replace(
              import_anchor,
              import_anchor + "from services.web_sync import order_created as web_sync_order_created\n",
              1,
          )
          old_web_assertions = '''    assert "async def _web_order_created_ensure_ticket" in web_source
              cs_review_source = Path("services/web_sync/cs_review.py").read_text(
                  encoding="utf-8"
              )
          '''
          new_web_assertions = '''    order_created_source = Path("services/web_sync/order_created.py").read_text(
                  encoding="utf-8"
              )
              assert "async def _web_order_created_ensure_ticket" not in web_source
              assert "async def _web_order_created_ensure_ticket" in order_created_source
              assert (
                  web_sync_runtime._web_order_created_ensure_ticket
                  is web_sync_order_created._web_order_created_ensure_ticket
              )
              cs_review_source = Path("services/web_sync/cs_review.py").read_text(
                  encoding="utf-8"
              )
          '''
          if old_web_assertions not in extraction_source:
              raise SystemExit("legacy ensure-ticket extraction assertion not found")
          extraction_source = extraction_source.replace(
              old_web_assertions,
              new_web_assertions,
              1,
          )
          old_process_assert = '    assert "async def _process_web_order_created_event" in web_source\n'
          new_process_assert = '''    assert "async def _process_web_order_created_event" not in web_source
              assert "async def _process_web_order_created_event" in order_created_source
              assert (
                  web_sync_runtime._process_web_order_created_event
                  is web_sync_order_created._process_web_order_created_event
              )
          '''
          if old_process_assert not in extraction_source:
              raise SystemExit("legacy process-event extraction assertion not found")
          extraction_source = extraction_source.replace(
              old_process_assert,
              new_process_assert,
              1,
          )
          extraction_path.write_text(extraction_source, encoding="utf-8")

          growth_path = Path("tests/test_architecture_growth_budget.py")
          growth_source = growth_path.read_text(encoding="utf-8")
          old_budget = '    "services/web_sync/runtime.py": 31_000,\n'
          new_budget = (
              '    "services/web_sync/runtime.py": 6_000,\n'
              '    "services/web_sync/order_created.py": 32_000,\n'
          )
          if old_budget not in growth_source:
              raise SystemExit("Web Sync runtime budget anchor not found")
          growth_source = growth_source.replace(old_budget, new_budget, 1)
          growth_path.write_text(growth_source, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile extracted modules
        run: |
          python -m compileall -q \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Run targeted extraction tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_web_sync_cs_review_boundary.py \
            tests/test_web_sync_self_service_bridge_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py

      - name: Commit extraction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_web_sync_order_created.yml
          git add \
            services/web_sync/runtime.py \
            services/web_sync/order_created.py \
            tests/test_web_sync_order_created_boundary.py \
            tests/test_runtime_extraction_boundaries.py \
            tests/test_architecture_growth_budget.py
          git commit -m "Extract Web Sync order-created pipeline"
          git push origin HEAD:refactor/web-sync-order-created-20261018
