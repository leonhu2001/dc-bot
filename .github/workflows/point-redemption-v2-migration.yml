name: point-redemption-v2-migration

on:
  push:
    branches:
      - feat/point-redemption-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct checkout changes
        run: python scripts/apply_point_redemption_v2_checkout.py

      - name: Remove one-shot migration helpers
        run: |
          git rm web/app/services/checkout_preview_core.py
          git rm scripts/apply_point_redemption_v2_checkout.py
          git rm .github/workflows/point-redemption-v2-migration.yml

      - name: Commit direct checkout implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/services/checkout_preview.py
          git commit -m "Apply point redemption v2 directly to web checkout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
