name: Hotfix payment review import

on:
  push:
    branches:
      - hotfix/payment-review-worker-tip-import-20261013
    paths:
      - tools/hotfix_payment_review_import.py
      - .github/workflows/hotfix-payment-review-import.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-hotfix-web.db
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/payment-review-worker-tip-import-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Repair stale import boundary
        run: python tools/hotfix_payment_review_import.py
      - name: Validate import and regressions
        run: |
          python -m compileall -q bot.py services views tests
          python -c "from services.payment_review_runtime import ensure_payment_review_worker_started; print('payment-review-import-ok')"
          python -m pytest -q tests/test_payment_review_runtime_import_boundary.py tests/test_worker_tip_extraction.py tests/test_payment_reviews.py tests/test_repair_legacy_tip_wallet_references.py tests/test_architecture_growth_budget.py
          python -m pytest -q tests/golden
          python -m pytest -q tests --ignore=tests/golden --ignore=tests/e2e
      - name: Commit repaired runtime
        run: |
          set -Eeuo pipefail
          rm -f tools/hotfix_payment_review_import.py .github/workflows/hotfix-payment-review-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix payment review worker tip import boundary"
          git push origin HEAD:hotfix/payment-review-worker-tip-import-20261013
