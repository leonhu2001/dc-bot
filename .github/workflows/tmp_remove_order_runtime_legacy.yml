name: Temporary remove legacy order runtime adapter

on:
  push:
    branches:
      - refactor/remove-order-runtime-legacy-adapter-20261018

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove legacy adapter and align boundary tests
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/order_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')

          assert 'from typing import Any, Mapping\n\n' in text
          text = text.replace('from typing import Any, Mapping\n\n', '', 1)

          start = text.index('\n\n_CONFIGURED = False\n')
          end = text.index('def configure_order_runtime_explicit(')
          text = text[:start] + '\n\n' + text[end:]

          start = text.index('\ndef configure_order_runtime(namespace: Mapping[str, Any]) -> None:')
          end = text.index('\nclass OrderControlSelect', start)
          text = text[:start] + '\n\n' + text[end + 1:]
          runtime_path.write_text(text, encoding='utf-8')

          Path('tests/test_order_runtime_dependency_boundary.py').write_text('''from services import order_runtime\n\n\nEXPECTED_BINDING_NAMES = frozenset(\n    {\n        "DB_FILE",\n        "DISPATCH_CHANNEL_ID",\n        "ORDER_CONTROL_SELECTIONS",\n        "SELF_SERVICE_ORDER_SELECTIONS",\n        "SelfServiceOrderView",\n        "_defer_and_refresh_self_service_panel",\n        "_get_rule_from_self_service_data",\n        "build_payment_method_embed",\n        "build_self_service_panel_embed",\n        "can_operate_self_service_order",\n        "format_t_amount",\n        "get_order_customer_id_from_channel",\n        "get_wallet_balance",\n        "is_customer_staff",\n        "remember_order_data",\n        "rename_ticket_channel",\n        "send_order_log",\n    }\n)\n\n\ndef test_order_runtime_explicit_binding_assigns_direct_dependencies(monkeypatch):\n    values = {\n        "DB_FILE": object(),\n        "DISPATCH_CHANNEL_ID": 987654,\n        "ORDER_CONTROL_SELECTIONS": object(),\n        "SELF_SERVICE_ORDER_SELECTIONS": object(),\n        "SelfServiceOrderView": object(),\n        "_defer_and_refresh_self_service_panel": object(),\n        "_get_rule_from_self_service_data": object(),\n        "build_payment_method_embed": object(),\n        "build_self_service_panel_embed": object(),\n        "can_operate_self_service_order": object(),\n        "format_t_amount": object(),\n        "get_order_customer_id_from_channel": object(),\n        "get_wallet_balance": object(),\n        "is_customer_staff": object(),\n        "remember_order_data": object(),\n        "rename_ticket_channel": object(),\n        "send_order_log": object(),\n    }\n\n    for name in EXPECTED_BINDING_NAMES:\n        monkeypatch.setattr(order_runtime, name, object(), raising=False)\n\n    order_runtime.configure_order_runtime_explicit(\n        db_file=values["DB_FILE"],\n        dispatch_channel_id=values["DISPATCH_CHANNEL_ID"],\n        order_control_selections=values["ORDER_CONTROL_SELECTIONS"],\n        order_selections=values["SELF_SERVICE_ORDER_SELECTIONS"],\n        self_service_order_view_type=values["SelfServiceOrderView"],\n        defer_and_refresh_self_service_panel=values["_defer_and_refresh_self_service_panel"],\n        self_service_rule_getter=values["_get_rule_from_self_service_data"],\n        payment_method_embed_builder=values["build_payment_method_embed"],\n        self_service_panel_embed_builder=values["build_self_service_panel_embed"],\n        can_operate_self_service_order_func=values["can_operate_self_service_order"],\n        amount_formatter=values["format_t_amount"],\n        order_customer_id_getter=values["get_order_customer_id_from_channel"],\n        wallet_balance_getter=values["get_wallet_balance"],\n        customer_staff_checker=values["is_customer_staff"],\n        remember_order=values["remember_order_data"],\n        ticket_channel_renamer=values["rename_ticket_channel"],\n        order_log_sender=values["send_order_log"],\n    )\n\n    for name, value in values.items():\n        assert getattr(order_runtime, name) is value\n\n\ndef test_order_runtime_legacy_namespace_adapter_is_removed():\n    assert callable(order_runtime.configure_order_runtime_explicit)\n    assert not hasattr(order_runtime, "configure_order_runtime")\n    assert not hasattr(order_runtime, "_ORDER_RUNTIME_BINDING_NAMES")\n    assert not hasattr(order_runtime, "_MODULE_OWNED_RUNTIME_NAMES")\n    assert not hasattr(order_runtime, "_CONFIGURED")\n''', encoding='utf-8')

          startup_path = Path('tests/test_order_runtime_explicit_startup.py')
          startup = startup_path.read_text(encoding='utf-8')
          old = '''def test_legacy_adapter_is_retained_but_not_used_by_startup():\n    assert "def configure_order_runtime(namespace: Mapping[str, Any])" in RUNTIME_SOURCE\n    assert "configure_order_runtime(globals())" not in BOT_SOURCE\n'''
          new = '''def test_legacy_adapter_is_removed_after_explicit_startup_rollout():\n    assert "def configure_order_runtime(namespace:" not in RUNTIME_SOURCE\n    assert "_ORDER_RUNTIME_BINDING_NAMES" not in RUNTIME_SOURCE\n    assert "_CONFIGURED" not in RUNTIME_SOURCE\n    assert "configure_order_runtime(globals())" not in BOT_SOURCE\n'''
          assert old in startup
          startup_path.write_text(startup.replace(old, new, 1), encoding='utf-8')

          boundary_path = Path('tests/test_runtime_extraction_boundaries.py')
          boundary = boundary_path.read_text(encoding='utf-8')
          old = '    assert callable(order_runtime.configure_order_runtime)\n'
          new = '    assert callable(order_runtime.configure_order_runtime_explicit)\n    assert not hasattr(order_runtime, "configure_order_runtime")\n'
          assert old in boundary
          boundary_path.write_text(boundary.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile changed files
        run: python -m compileall -q services/order_runtime.py tests/test_order_runtime_dependency_boundary.py tests/test_order_runtime_explicit_startup.py tests/test_runtime_extraction_boundaries.py
      - name: Static removal guard
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('services/order_runtime.py').read_text(encoding='utf-8')
          bot = Path('bot.py').read_text(encoding='utf-8')
          assert 'def configure_order_runtime_explicit(' in runtime
          assert 'def configure_order_runtime(namespace:' not in runtime
          assert '_ORDER_RUNTIME_BINDING_NAMES' not in runtime
          assert '_MODULE_OWNED_RUNTIME_NAMES' not in runtime
          assert '_CONFIGURED' not in runtime
          assert 'from typing import Any, Mapping' not in runtime
          assert 'configure_order_runtime_explicit(' in bot
          assert 'configure_order_runtime(globals())' not in bot
          assert Path('bot.py').stat().st_size <= 235000
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp_remove_order_runtime_legacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/order_runtime.py tests/test_order_runtime_dependency_boundary.py tests/test_order_runtime_explicit_startup.py tests/test_runtime_extraction_boundaries.py .github/workflows/tmp_remove_order_runtime_legacy.yml
          git commit -m 'Remove legacy order runtime namespace adapter'
          git push origin HEAD:refactor/remove-order-runtime-legacy-adapter-20261018
