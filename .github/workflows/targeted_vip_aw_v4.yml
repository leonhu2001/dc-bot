name: Targeted VIP AW V4

on:
  push:
    branches:
      - ci-vip-aw-v4-20261022

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: "false"
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-targeted-v4.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements-web.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile changed modules
        run: |
          python -m py_compile services/vip_timer_selector_order_v4.py services/aw_collision_business_policy.py services/vip_timer_acceptance.py services/__init__.py
      - name: Existing catalog regressions
        run: |
          python -m pytest -q tests/test_aw_collision_catalog.py tests/test_one_companion_one_guard_catalog.py tests/test_one_companion_one_guard_payout.py
      - name: AW business policy regressions
        run: |
          python -m pytest -q tests/test_aw_collision_business_policy.py tests/test_aw_collision_financial_override.py tests/test_aw_collision_financial_calculation.py
      - name: VIP base catalog regression
        run: |
          python -m pytest -q tests/test_vip_timer_select_flow.py
      - name: VIP four-level regressions
        run: |
          python -m pytest -q tests/test_vip_timer_selector_order_v4.py tests/test_vip_timer_game_select_component_v4.py
