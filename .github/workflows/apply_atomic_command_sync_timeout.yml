name: Apply atomic command sync timeout patch

on:
  push:
    branches:
      - fix/atomic-guild-command-sync
    paths:
      - tools/patch_atomic_command_sync_timeout.py
      - .github/workflows/apply_atomic_command_sync_timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/atomic-guild-command-sync
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python tools/patch_atomic_command_sync_timeout.py
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify atomic command sync patch
        run: |
          python -m compileall -q bot.py core cogs views
          python -m pytest -q tests/test_command_registry.py
      - name: Remove one-time patch files
        run: |
          rm tools/patch_atomic_command_sync_timeout.py
          rm .github/workflows/apply_atomic_command_sync_timeout.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py core/command_registry.py tests/test_command_registry.py tools/patch_atomic_command_sync_timeout.py .github/workflows/apply_atomic_command_sync_timeout.yml
          git commit -m "Publish guild Slash commands atomically"
          git push origin HEAD:fix/atomic-guild-command-sync
