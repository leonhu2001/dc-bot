name: One-shot payment and dispatch source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply repair only on trigger commit
        run: |
          if [ "$(git log -1 --pretty=%s)" != "Run one-shot source repair" ]; then
            echo "Not the repair trigger commit; nothing to do."
            exit 0
          fi
          python .github/repair_payment_dispatch_source.py
          python -m compileall -q bot.py views/smart_dispatch.py
          python -m pytest -q tests/test_payment_panel_and_dispatch_source_regressions.py

      - name: Commit repaired source when changed
        run: |
          if git diff --quiet -- bot.py views/smart_dispatch.py tests/test_payment_panel_and_dispatch_source_regressions.py; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py views/smart_dispatch.py tests/test_payment_panel_and_dispatch_source_regressions.py
          git commit -m "Fix payment panel copy and dispatch reminder stages"
          git push origin HEAD:main
