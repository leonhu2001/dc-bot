name: Apply self-service financial runtime fix

on:
  push:
    branches:
      - fix/self-service-financial-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-service-financial-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: python tools/apply_self_service_financial_runtime_fix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Validate runtime contract
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile services/self_service_financials.py services/self_service_runtime.py
          python -m pytest -q tests/test_self_service_financial_runtime_contract.py tests/test_runtime_extraction_boundaries.py
          python tools/runtime_import_smoke.py
      - name: Commit fix and remove one-shot tooling
        run: |
          rm .github/workflows/apply_self_service_financial_runtime_fix.yml tools/apply_self_service_financial_runtime_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix self-service financial runtime wiring"
          git push
