name: Native Chinese Slash Migration

on:
  push:
    branches:
      - fix/native-chinese-slash-names

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[native-chinese-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/native-chinese-slash-names
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r web/requirements-web.txt
          python -m pip install -r requirements-dev.txt

      - name: Rewrite command declarations at source
        run: python scripts/migrate_native_chinese_commands.py

      - name: Verify migrated source
        run: |
          python -m compileall -q bot.py cogs core views
          python -m pytest -q tests/test_command_registry.py

      - name: Remove migration-only files
        run: |
          rm scripts/migrate_native_chinese_commands.py
          rm .github/workflows/native_chinese_migration.yml

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use native Chinese Slash command names [native-chinese-migrated]"
          git push origin HEAD:fix/native-chinese-slash-names
