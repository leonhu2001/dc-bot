name: Temporary Web Sync Explicit Dependency Refactor

on:
  push:
    branches:
      - refactor/web-sync-explicit-deps-20261018

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply explicit Web Sync dependency boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("services/web_sync/runtime.py")
          runtime_source = runtime_path.read_text(encoding="utf-8")
          marker = "def _web_dashboard_db_path_for_bot() -> str:\n"
          if marker not in runtime_source:
              raise SystemExit("web sync runtime marker not found")
          runtime_tail = runtime_source[runtime_source.index(marker):]
          runtime_prefix = '''from __future__ import annotations

          import asyncio
          import re
          import sqlite3
          from typing import Any

          import discord

          from core.database import (
              delete_order_row_from_db,
              remember_claim_data,
              remember_order_data,
              save_bot_data,
          )
          from core.permissions import is_customer_staff
          from core.time_utils import get_taipei_now_iso
          from services.acceptance.runtime import (
              _apply_acceptance_state_to_claim_data,
              refresh_acceptance_dispatch_from_web_order,
          )
          from services.logging_service import send_order_log
          from services.order_lifecycle_runtime import (
              CANCEL_REASON_OPTIONS,
              OrderCancellationReasonSelect,
          )
          from services.orders import (
              ORDER_CATEGORY_LABELS,
              ORDER_ITEM_GROUPS_BY_CATEGORY,
              _to_int,
              get_order_item_details_for_group,
              get_order_item_group_label,
          )
          from services.rewards import format_t_amount
          from services.self_service_financials import _format_plain_amount
          from services.self_service_ui_runtime import (
              SelfServiceOrderView,
              build_self_service_panel_embed,
          )
          from services.smart_dispatch import (
              create_smart_dispatch_plan,
              get_smart_dispatch_plan,
              set_specified_dm_results,
          )
          from services.ticket_identity import build_ticket_channel_name
          from services.web_sync.discord_helpers import (
              find_ticket as _web_order_created_find_ticket,
              get_channel as _web_order_created_get_channel,
              get_member as _web_order_created_get_member,
              has_footer as _web_order_created_has_footer,
          )
          from services.web_sync.event_store import (
              load_order_created_bundle as _web_order_created_load_bundle,
              mark_order_created_processing as _web_order_created_mark_processing,
              update_order_created_links as _web_order_created_update_links,
              mark_event_done as _web_sync_mark_event_done,
              mark_event_failed as _web_sync_mark_event_failed,
          )
          from services.web_sync.presentation import (
              build_order_created_details as _web_order_created_details,
          )
          from views.smart_dispatch import (
              prepare_initial_smart_dispatch,
              send_initial_smart_dispatch_alert,
              send_specified_staff_dispatch_dms,
          )


          _CONFIGURED = False

          CUSTOMER_CATEGORY_ID: int
          CUSTOMER_ROLE_ID: int
          DISPATCH_CHANNEL_ID: int
          GUILD_ID: int
          ORDER_CLAIMS: dict[int, dict[str, Any]]
          OrderControlView: type[discord.ui.View]
          SELF_SERVICE_ORDER_SELECTIONS: dict[int, dict[str, Any]]
          bot: discord.Client


          def configure_web_sync_runtime_explicit(
              *,
              customer_category_id: int,
              customer_role_id: int,
              dispatch_channel_id: int,
              guild_id: int,
              order_claims: dict[int, dict[str, Any]],
              order_control_view_type: type[discord.ui.View],
              order_selections: dict[int, dict[str, Any]],
              bot_instance: discord.Client,
          ) -> None:
              """Bind only the entrypoint-owned state required by Web sync."""
              global _CONFIGURED
              global CUSTOMER_CATEGORY_ID, CUSTOMER_ROLE_ID, DISPATCH_CHANNEL_ID, GUILD_ID
              global ORDER_CLAIMS, OrderControlView, SELF_SERVICE_ORDER_SELECTIONS, bot

              CUSTOMER_CATEGORY_ID = int(customer_category_id)
              CUSTOMER_ROLE_ID = int(customer_role_id)
              DISPATCH_CHANNEL_ID = int(dispatch_channel_id)
              GUILD_ID = int(guild_id)
              ORDER_CLAIMS = order_claims
              OrderControlView = order_control_view_type
              SELF_SERVICE_ORDER_SELECTIONS = order_selections
              bot = bot_instance
              _CONFIGURED = True


          '''
          runtime_path.write_text(runtime_prefix + runtime_tail, encoding="utf-8")

          bot_path = Path("bot.py")
          bot_source = bot_path.read_text(encoding="utf-8")
          old_import = "    configure_web_sync_runtime,\n"
          new_import = "    configure_web_sync_runtime_explicit,\n"
          if bot_source.count(old_import) != 1:
              raise SystemExit(f"expected one web sync runtime import, found {bot_source.count(old_import)}")
          bot_source = bot_source.replace(old_import, new_import, 1)

          old_call = "configure_web_sync_runtime(globals())"
          new_call = '''configure_web_sync_runtime_explicit(
              customer_category_id=CUSTOMER_CATEGORY_ID,
              customer_role_id=CUSTOMER_ROLE_ID,
              dispatch_channel_id=DISPATCH_CHANNEL_ID,
              guild_id=GUILD_ID,
              order_claims=ORDER_CLAIMS,
              order_control_view_type=OrderControlView,
              order_selections=SELF_SERVICE_ORDER_SELECTIONS,
              bot_instance=bot,
          )'''
          if bot_source.count(old_call) != 1:
              raise SystemExit(f"expected one legacy Web Sync configure call, found {bot_source.count(old_call)}")
          bot_source = bot_source.replace(old_call, new_call, 1)
          bot_path.write_text(bot_source, encoding="utf-8")

          boundary_test = '''import inspect

          from services.web_sync import runtime as web_sync_runtime


          ENTRYPOINT_DEPENDENCIES = {
              "customer_category_id",
              "customer_role_id",
              "dispatch_channel_id",
              "guild_id",
              "order_claims",
              "order_control_view_type",
              "order_selections",
              "bot_instance",
          }


          def test_web_sync_runtime_uses_explicit_entrypoint_dependencies():
              signature = inspect.signature(
                  web_sync_runtime.configure_web_sync_runtime_explicit
              )
              assert set(signature.parameters) == ENTRYPOINT_DEPENDENCIES
              assert all(
                  parameter.kind is inspect.Parameter.KEYWORD_ONLY
                  for parameter in signature.parameters.values()
              )


          def test_web_sync_legacy_namespace_bridge_is_removed():
              assert not hasattr(web_sync_runtime, "configure_web_sync_runtime")
              assert not hasattr(web_sync_runtime, "_ALLOWED_RUNTIME_DEPENDENCY_NAMES")
              assert not hasattr(web_sync_runtime, "_MODULE_OWNED_RUNTIME_NAMES")
              source = inspect.getsource(web_sync_runtime)
              assert "globals().update" not in source
              assert "globals()[name]" not in source
              assert "Mapping[str, Any]" not in source


          def test_web_sync_module_owned_dependencies_are_not_entrypoint_parameters():
              module_owned_names = {
                  "asyncio",
                  "re",
                  "sqlite3",
                  "CANCEL_REASON_OPTIONS",
                  "ORDER_CATEGORY_LABELS",
                  "ORDER_ITEM_GROUPS_BY_CATEGORY",
                  "OrderCancellationReasonSelect",
                  "SelfServiceOrderView",
                  "_apply_acceptance_state_to_claim_data",
                  "_format_plain_amount",
                  "_to_int",
                  "_web_order_created_details",
                  "_web_order_created_find_ticket",
                  "_web_order_created_get_channel",
                  "_web_order_created_get_member",
                  "_web_order_created_has_footer",
                  "build_self_service_panel_embed",
                  "build_ticket_channel_name",
                  "create_smart_dispatch_plan",
                  "delete_order_row_from_db",
                  "format_t_amount",
                  "get_order_item_details_for_group",
                  "get_order_item_group_label",
                  "get_smart_dispatch_plan",
                  "get_taipei_now_iso",
                  "is_customer_staff",
                  "prepare_initial_smart_dispatch",
                  "refresh_acceptance_dispatch_from_web_order",
                  "remember_claim_data",
                  "remember_order_data",
                  "save_bot_data",
                  "send_initial_smart_dispatch_alert",
                  "send_order_log",
                  "send_specified_staff_dispatch_dms",
                  "set_specified_dm_results",
              }
              signature = inspect.signature(
                  web_sync_runtime.configure_web_sync_runtime_explicit
              )
              assert module_owned_names.isdisjoint(signature.parameters)
          '''
          Path("tests/test_web_sync_runtime_dependency_boundary.py").write_text(
              boundary_test,
              encoding="utf-8",
          )

          growth_path = Path("tests/test_architecture_growth_budget.py")
          growth_source = growth_path.read_text(encoding="utf-8")
          if "import re\n" not in growth_source:
              growth_source = growth_source.replace(
                  "from pathlib import Path\n",
                  "from pathlib import Path\nimport re\n",
                  1,
              )
          budget_anchor = '    "services/self_service_runtime.py": 70_000,\n'
          web_sync_budget = '    "services/web_sync/runtime.py": 62_000,\n'
          if web_sync_budget not in growth_source:
              if budget_anchor not in growth_source:
                  raise SystemExit("architecture budget anchor not found")
              growth_source = growth_source.replace(
                  budget_anchor,
                  budget_anchor + web_sync_budget,
                  1,
              )
          guard = '''\n\ndef test_runtime_configurators_do_not_receive_entrypoint_globals() -> None:
              source = (ROOT / "bot.py").read_text(encoding="utf-8")
              pattern = re.compile(
                  r"configure_[A-Za-z0-9_]*runtime\\s*\\(\\s*globals\\s*\\(\\s*\\)\\s*\\)"
              )
              assert pattern.search(source) is None, (
                  "runtime configuration must use explicit dependencies, not globals()"
              )
          '''
          if "def test_runtime_configurators_do_not_receive_entrypoint_globals" not in growth_source:
              growth_source += guard
          growth_path.write_text(growth_source, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile changed Python sources
        run: |
          python -m compileall -q bot.py services/web_sync/runtime.py tests/test_web_sync_runtime_dependency_boundary.py tests/test_architecture_growth_budget.py

      - name: Run targeted architecture tests
        run: |
          python -m pytest -q \
            tests/test_web_sync_runtime_dependency_boundary.py \
            tests/test_architecture_growth_budget.py

      - name: Commit refactor and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_web_sync_explicit_refactor.yml
          git add bot.py services/web_sync/runtime.py tests/test_web_sync_runtime_dependency_boundary.py tests/test_architecture_growth_budget.py
          git commit -m "Refactor web sync runtime to explicit dependencies"
          git push
