name: Repair canonical migration matcher

on:
  push:
    paths:
      - .github/workflows/fix_direct_rule_migration_20261029.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Relax only legacy price text matching
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/direct_rule_migration_20261029.yml')
          text = path.read_text(encoding='utf-8')
          old = "          for old, new in price_replacements.items():\n              s = once(s, old, new, 'latest direct game price')\n"
          new = "          for old, new in price_replacements.items():\n              s = s.replace(old, new)\n"
          if old not in text:
              raise SystemExit('target matcher block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/direct_rule_migration_20261029.yml
          git commit -m "Relax canonical migration legacy price matcher"
          git push origin HEAD:main
