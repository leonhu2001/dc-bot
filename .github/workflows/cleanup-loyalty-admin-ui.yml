name: Clean up loyalty admin UI

on:
  push:
    branches:
      - feature/member-benefits-portal

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/member-benefits-portal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove obsolete buy-get controls
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"anchor missing: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          router = "web/app/routers/admin_order_rules.py"
          replace_once(
              router,
              '''OPTIONAL_INT_FIELDS = {\n    "max_quantity",\n    "max_specified_count",\n    "specify_free_min_units",\n    "max_player_count",\n    "service_bonus_buy",\n}\nINT_FIELDS = {\n    "price",\n    "min_quantity",\n    "specify_fee_default",\n    "min_player_count",\n    "min_protector_count",\n    "service_bonus_gift",\n}\n''',
              '''OPTIONAL_INT_FIELDS = {\n    "max_quantity",\n    "max_specified_count",\n    "specify_free_min_units",\n    "max_player_count",\n}\nINT_FIELDS = {\n    "price",\n    "min_quantity",\n    "specify_fee_default",\n    "min_player_count",\n    "min_protector_count",\n}\n''',
          )
          replace_once(
              router,
              '''    "vip_discount_allowed",\n    "point_benefits_allowed",\n}\n''',
              '''    "vip_discount_allowed",\n    "point_benefits_allowed",\n    "loyalty_benefits_enabled",\n}\n''',
          )
          replace_once(
              router,
              '''    for field in BOOL_FIELDS:\n        payload[field] = field in form\n\n    payload["allowed_roles"] = [\n''',
              '''    for field in BOOL_FIELDS:\n        payload[field] = field in form\n\n    # 舊的同單買幾送幾已全面停用。欄位只保留歷史 payload 相容，\n    # 後台任何新建/修改都強制清空，避免舊 override 將活動復活。\n    payload["service_bonus_buy"] = None\n    payload["service_bonus_gift"] = 0\n\n    payload["allowed_roles"] = [\n''',
          )

          template = "web/app/templates/admin_order_rules.html"
          replace_once(
              template,
              '''                    <p class="muted-text">\n                        VIP 與點數是獨立商品開關；關閉後 Web / DC 都不套用該福利。客服手動折扣不受影響。\n                    </p>\n''',
              '''                    <p class="muted-text">\n                        VIP、點數與跨單累積福利各自獨立。舊的同單「買幾送幾」已全面停用。\n                    </p>\n''',
          )
          replace_once(
              template,
              '''            <div class="new-product-grid new-product-grid--compact">\n                <label class="new-product-field">\n                    <span>買幾送</span>\n                    <input name="service_bonus_buy" type="number" min="1" value="">\n                </label>\n\n                <label class="new-product-field">\n                    <span>贈送數量</span>\n                    <input name="service_bonus_gift" type="number" min="0" value="0">\n                </label>\n            </div>\n\n            <div class="new-product-toggles">\n''',
              '''            <p class="muted-text">\n                跨單累積福利：計時商品每累積 10 個付費小時發 +30 分鐘券；計局商品每累積 20 個付費局發 +1 局券。\n                固定價／單位價商品即使勾選也不會產生累積。\n            </p>\n\n            <div class="new-product-toggles">\n''',
          )
          replace_once(
              template,
              '''                <label><input type="checkbox" name="point_benefits_allowed" checked> <span>可使用點數福利</span></label>\n''',
              '''                <label><input type="checkbox" name="point_benefits_allowed" checked> <span>可使用點數福利</span></label>\n                <label><input type="checkbox" name="loyalty_benefits_enabled"> <span>啟用跨單累積福利</span></label>\n''',
          )
          replace_once(
              template,
              '''                    <div>\n                        <span>買幾送</span>\n                        <input name="service_bonus_buy" type="number" min="1" value="{{ '' if payload.get('service_bonus_buy') is none else payload.get('service_bonus_buy') }}">\n                    </div>\n                    <div>\n                        <span>贈送數量</span>\n                        <input name="service_bonus_gift" type="number" min="0" value="{{ payload.get('service_bonus_gift', 0) }}">\n                    </div>\n''',
              '''                    <div>\n                        <span>跨單累積福利</span>\n                        <strong>{{ '10H → +30分鐘' if payload.get('pricing_type') == 'hourly' else ('20局 → +1局' if payload.get('pricing_type') == 'game' else '此計價方式不適用') }}</strong>\n                    </div>\n''',
          )
          replace_once(
              template,
              '''                    <label><input type="checkbox" name="point_benefits_allowed" {% if payload.get('point_benefits_allowed', True) %}checked{% endif %}> 可使用點數福利</label>\n                </div>\n                <p class="muted-text" style="margin-top:-6px;">\n                    VIP 與點數各自控制；關閉 VIP 仍可由客服另外套用手動折扣。\n                </p>\n''',
              '''                    <label><input type="checkbox" name="point_benefits_allowed" {% if payload.get('point_benefits_allowed', True) %}checked{% endif %}> 可使用點數福利</label>\n                    <label><input type="checkbox" name="loyalty_benefits_enabled" {% if payload.get('loyalty_benefits_enabled', False) %}checked{% endif %}> 啟用跨單累積福利</label>\n                </div>\n                <p class="muted-text" style="margin-top:-6px;">\n                    VIP、點數與跨單累積各自控制；跨單福利僅計真正付費的基礎時數／局數。\n                </p>\n''',
          )
          PY
      - name: Compile
        run: python -m compileall -q web/app services tests
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/routers/admin_order_rules.py web/app/templates/admin_order_rules.html
          git commit -m "Remove obsolete buy-get admin controls"
          git push origin HEAD:feature/member-benefits-portal
