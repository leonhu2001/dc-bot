name: Direct order rule migration v2

on:
  push:
    branches:
      - main
    paths:
      - .github/direct-order-rule-fix-v2.trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical rule changes
        run: python scripts/_direct_order_rule_fix.py

      - name: Syntax check
        run: |
          python -m py_compile \
            services/order_rules.py \
            services/aw_collision_catalog.py \
            services/aw_collision_business_policy.py \
            services/one_companion_one_guard_payout.py \
            services/sweet_companion_policy_20261028.py

      - name: Commit changes
        run: |
          git config user.name "zYao rule migration"
          git config user.email "actions@users.noreply.github.com"
          git add services/order_rules.py services/aw_collision_catalog.py services/aw_collision_business_policy.py services/one_companion_one_guard_payout.py services/sweet_companion_policy_20261028.py
          git diff --cached --check
          git commit -m "fix: make AW and halfcoin rules canonical"
          git push origin HEAD:main
