name: One-shot web sync DB path repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run web sync DB path repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/fix_web_sync_db_path_20261008.py

      - name: Validate
        run: |
          python -m compileall -q services/web_sync/runtime.py
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/web_sync/runtime.py
          git rm scripts/fix_web_sync_db_path_20261008.py
          git commit -m "Fix Bot Web database path"
          git push origin HEAD:main
