name: One-shot bot wallet extraction

on:
  push:
    branches:
      - ceiling-bot-wallet-commands
    paths:
      - scripts/apply_bot_wallet_refactor.py
      - .github/workflows/refactor_bot_wallet_once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceiling-bot-wallet-commands
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic extraction
        run: python scripts/apply_bot_wallet_refactor.py
      - name: Commit bot entrypoint extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --check
          git commit -m "Extract wallet commands from bot entrypoint"
          git push origin HEAD:ceiling-bot-wallet-commands
