name: One-time DC policy source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-dc-policy-fix]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source migration
        run: python tools/apply_dc_policy_fix.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          if [ -f web/requirements-web.txt ]; then pip install -r web/requirements-web.txt; fi

      - name: Compile and run focused regression tests
        run: |
          python -m compileall -q core services shared views web bot.py
          python -m pytest -q \
            tests/test_vip_room_whitelist.py \
            tests/test_vip_whitelist_startup_sync.py \
            tests/test_dispatch_policy_consistency.py \
            tests/test_smart_dispatch_cadence.py \
            tests/test_dispatch_public_lock.py \
            tests/test_service_rules_policy.py

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix DC rules, dispatch presence, and VIP whitelist video"
          git push origin main
