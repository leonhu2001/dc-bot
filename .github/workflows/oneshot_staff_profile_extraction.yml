name: One-shot staff profile command extraction

on:
  push:
    branches:
      - ceiling-staff-profile-commands

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ceiling-staff-profile-commands
          fetch-depth: 0

      - name: Rewrite bot entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          old_import = '''from views.staff_profiles import (
              ensure_staff_profile_tables,
              find_profile_card_image_url,
              upsert_staff_profile,
              get_staff_profile,
              get_staff_profile_panel_rows,
              save_staff_profile_panel_message,
              build_staff_profile_embed,
              list_customer_favorites,
              build_customer_favorites_embed,
              CustomerFavoritesView,
              PublicStaffProfileBrowseView,
              StaffProfilePanelView,
              refresh_staff_profile_panels_for_order,
              configure_staff_profile_order_ticket_creator,
          )'''
          new_import = '''from views.staff_profiles import (
              ensure_staff_profile_tables,
              get_staff_profile_panel_rows,
              StaffProfilePanelView,
              refresh_staff_profile_panels_for_order,
              configure_staff_profile_order_ticket_creator,
          )'''
          if source.count(old_import) != 1:
              raise SystemExit("staff profile import block did not match exactly once")
          source = source.replace(old_import, new_import, 1)

          command_start = source.index('@bot.tree.command(\n    name="my_favorites",')
          fix_start = source.index('@bot.tree.command(\n    name="fix_acceptance_payment_panel",', command_start)
          source = (
              source[:command_start]
              + '# 成員收藏 / 個人牆瀏覽 slash 指令已搬到 cogs/staff_profile_commands.py\n\n'
              + source[fix_start:]
          )

          profile_start = source.index('@bot.tree.command(\n    name="staff_profile_panel",')
          redeem_start = source.index('# ========= 點數兌換面板 =========', profile_start)
          source = (
              source[:profile_start]
              + '# 個人牆建立 / 同步 slash 指令已搬到 cogs/staff_profile_commands.py\n\n\n'
              + source[redeem_start:]
          )

          loader_old = '                "cogs.wallet_commands",\n                "cogs.audit_commands",'
          loader_new = '                "cogs.wallet_commands",\n                "cogs.staff_profile_commands",\n                "cogs.audit_commands",'
          if source.count(loader_old) != 1:
              raise SystemExit("extension loader anchor did not match exactly once")
          source = source.replace(loader_old, loader_new, 1)

          forbidden = (
              'name="my_favorites"',
              'name="browse_staff_profiles"',
              'name="staff_profile_panel"',
              'name="refresh_staff_profile_panel"',
          )
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f"old command still present in bot.py: {marker}")

          if '"cogs.staff_profile_commands"' not in source:
              raise SystemExit("new cog is not registered")

          path.write_text(source, encoding="utf-8")
          print(f"bot.py bytes after extraction: {path.stat().st_size}")
          PY

      - name: Compile extracted files
        run: python -m compileall -q bot.py cogs/staff_profile_commands.py

      - name: Commit generated entrypoint change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "[oneshot-generated] Remove staff profile commands from bot entrypoint"
          git push origin HEAD:ceiling-staff-profile-commands
