name: Run notification repair

on:
  push:
    branches:
      - fix/report-button-payout-notification-20261013

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-button-payout-notification-20261013
          fetch-depth: 0
      - name: Apply repair
        run: python tools/one_shot_notification_repair.py
      - name: Compile changed runtime
        run: python -m compileall -q web/app/services/order_reporting.py web/app/routers/admin_payout_summary.py
      - name: Verify notification contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          reporting = Path('web/app/services/order_reporting.py').read_text(encoding='utf-8')
          assert '"style": 5' in reporting
          assert '"label": "填寫報單"' in reporting
          assert '"url": report_url' in reporting
          assert 'f"填寫報單：{report_url}"' not in reporting

          payouts = Path('web/app/routers/admin_payout_summary.py').read_text(encoding='utf-8')
          assert 'def _collect_bulk_payout_notification_targets' in payouts
          assert 'status="unpaid"' in payouts
          assert 'def _send_bulk_payout_paid_notifications' in payouts
          assert '_send_bulk_payout_paid_notifications(notification_targets)' in payouts
          assert 'send_payout_paid_notification(' in payouts
          PY
      - name: Commit repair
        run: |
          rm -f .github/workflows/fix_report_button_payout_notification_once.yml
          rm -f tools/one_shot_notification_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/services/order_reporting.py web/app/routers/admin_payout_summary.py tests/test_order_reporting.py tests/test_payout_notifications.py .github/workflows/fix_report_button_payout_notification_once.yml tools/one_shot_notification_repair.py
          git diff --cached --check
          git commit -m "Add report DM button and restore bulk payout notifications"
          git push origin HEAD:fix/report-button-payout-notification-20261013
