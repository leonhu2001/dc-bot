name: One-shot routine maintenance 20261007

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  maintain:
    if: github.event.head_commit.message == 'Run routine maintenance 20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply maintenance fixes
        run: python .github/maintenance_20261007.py

      - name: Compile every Python area
        run: |
          python -m compileall -q bot.py cogs core services shared views web/app tools scripts tests
          bash -n scripts/deploy_main.sh
          git diff --check

      - name: Commit maintenance fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/vip_levels.py views/smart_dispatch.py tests .github/workflows/ci.yml scripts/deploy_main.sh
          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
            exit 0
          fi
          git commit -m "Routine maintenance: VIP benefits and dispatch cadence"
          git push origin HEAD:main
