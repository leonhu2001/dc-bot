name: Phase3 extract inline

on:
  push:
    branches:
      - refactor/phase3-csp-modules-20261013
    paths:
      - tools/phase3_extract_static_inline.py
      - .github/workflows/phase3-extract-inline.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/phase3-csp-modules-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "Jinja2>=3.1,<4"
      - name: Extract static inline blocks
        run: python tools/phase3_extract_static_inline.py
      - name: Compile and audit extracted tree
        run: |
          python -m compileall -q bot.py cogs core services shared views web/app tools scripts
          python tools/audit_templates.py
      - name: Commit extracted assets
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/templates web/app/static/css/pages web/app/static/js/pages
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "Extract static inline CSP blocks"
          git pull --rebase origin refactor/phase3-csp-modules-20261013
          git push origin HEAD:refactor/phase3-csp-modules-20261013
