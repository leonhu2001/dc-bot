name: Temporary credential composition patch

on:
  push:
    branches:
      - refactor/order-credential-composition-20261018

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: refactor/order-credential-composition-20261018

      - name: Apply patch
        run: python tools/tmp_refactor_credential_composition.py

      - name: Remove temporary helpers
        run: |
          rm tools/tmp_refactor_credential_composition.py
          rm .github/workflows/tmp_refactor_credential_composition.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move order credential composition out of legacy runtime"
          git push origin HEAD:refactor/order-credential-composition-20261018
