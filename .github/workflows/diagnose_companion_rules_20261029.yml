name: Apply direct companion rule source fix

on:
  push:
    paths:
      - '.github/workflows/diagnose_companion_rules_20261029.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      WEB_SECRET_KEY: ci-only-secret-key-not-for-production
      WEB_COOKIE_HTTPS_ONLY: 'false'
      WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: sqlite:////tmp/dc-bot-direct-fix.db
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Edit authoritative source files directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # services/order_rules.py: migrated player-count rules are now source-authoritative
          # for identity/qualification/headcount. Manager overrides can still change price,
          # benefits and other business switches, but cannot resurrect old single/double shapes.
          replace_once(
              'services/order_rules.py',
              '_BASE_ORDER_RULES = dict(ORDER_RULES)\n\n\nclass EffectiveOrderRules(dict):',
              '_BASE_ORDER_RULES = dict(ORDER_RULES)\n\n# 後來核准為「規格 / 類型 + 獨立陪玩人數」的內建規則，以程式來源為準。\n# 舊後台 override 不得再把這些商品改回單陪／雙陪或舊分組。\nSOURCE_AUTHORITY_RULE_KEYS = frozenset(\n    key\n    for key, rule in _BASE_ORDER_RULES.items()\n    if bool(rule.player_count_enabled) and key != "custom_custom_order"\n)\n\n\nclass EffectiveOrderRules(dict):'
          )
          replace_once(
              'services/order_rules.py',
              '''            if bool(base.player_count_enabled):\n                rule = replace(\n                    rule,\n                    required_staff_count=base.required_staff_count,\n                    player_count_enabled=base.player_count_enabled,\n                    min_player_count=base.min_player_count,\n                    max_player_count=base.max_player_count,\n                    price_multiply_player_count=base.price_multiply_player_count,\n                    player_count_prices=dict(base.player_count_prices),\n                    max_specified_count=base.max_specified_count,\n                )''',
              '''            if key in SOURCE_AUTHORITY_RULE_KEYS:\n                rule = replace(\n                    rule,\n                    label=base.label,\n                    catalog_group_label=base.catalog_group_label,\n                    allowed_roles=base.allowed_roles,\n                    allowed_game_roles=base.allowed_game_roles,\n                    required_game_roles=base.required_game_roles,\n                    required_staff_count=base.required_staff_count,\n                    player_count_enabled=base.player_count_enabled,\n                    min_player_count=base.min_player_count,\n                    max_player_count=base.max_player_count,\n                    price_multiply_player_count=base.price_multiply_player_count,\n                    player_count_prices=dict(base.player_count_prices),\n                    max_specified_count=base.max_specified_count,\n                )'''
          )
          replace_once(
              'services/order_rules.py',
              '    "ROLE_LABELS",\n    "RoleKey",',
              '    "ROLE_LABELS",\n    "SOURCE_AUTHORITY_RULE_KEYS",\n    "RoleKey",'
          )

          # services/orders.py: use the rule source's authority list instead of a second hard-coded list.
          replace_once(
              'services/orders.py',
              '    ORDER_RULES,\n    get_rules_by_category,',
              '    ORDER_RULES,\n    SOURCE_AUTHORITY_RULE_KEYS,\n    get_rules_by_category,'
          )
          p = Path('services/orders.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('CANONICAL_DETAIL_LABEL_RULE_KEYS = {')
          end = text.index('\n\nDYNAMIC_ADMIN_GROUP_LABEL', start)
          text = text[:start] + 'CANONICAL_DETAIL_LABEL_RULE_KEYS = set(SOURCE_AUTHORITY_RULE_KEYS)' + text[end:]
          p.write_text(text, encoding='utf-8')

          # Web GROUP_SPECS is presentation only. It must consume direct rules, never rewrite them.
          p = Path('web/app/services/__init__.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from dataclasses import replace\n\n', '', 1)
          start = text.index('def _catalog_group_for_admin')
          end = text.index('# Public storefront presentation uses', start)
          text = text[:start] + text[end:]
          old = '''# Normalize code rules only after all storefront copy/variant adjustments above\n# have finished, otherwise the admin page could inherit stale legacy labels.\n_install_builtin_catalog_columns()\n\n'''
          if old not in text:
              raise SystemExit('missing web builtin catalog normalization call')
          text = text.replace(old, '# Built-in rule identity now comes directly from services/order_rules.py.\n\n', 1)
          p.write_text(text, encoding='utf-8')

          # Web catalog: remove duplicated headcount from the spec selector and point at canonical rules.
          replace_once(
              'web/app/services/order_groups.py',
              '    ORDER_RULES,\n    get_allowed_role_labels,',
              '    ORDER_RULES,\n    SOURCE_AUTHORITY_RULE_KEYS,\n    get_allowed_role_labels,'
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''    {\n        "key": "tech_play",\n        "category": "delta_desktop_basic",\n        "label": "技術陪",\n        "selector_label": "難度 / 陪玩人數",\n        "description": "三角洲端遊技術陪，依難度與陪玩人數選擇方案。",\n        "variants": [\n            ("basic_tech_secret_single", "機密｜單陪"),\n            ("basic_tech_secret_double", "機密｜雙陪"),\n            ("basic_tech_topsecret_single", "絕密｜單陪"),\n            ("basic_tech_topsecret_double", "絕密｜雙陪"),\n        ],\n    },''',
              '''    {\n        "key": "tech_play",\n        "category": "delta_desktop_basic",\n        "label": "技術陪",\n        "selector_label": "難度",\n        "description": "三角洲端遊技術陪；難度與陪玩人數分開選擇。",\n        "variants": [\n            ("basic_tech_secret_single", "機密"),\n            ("basic_tech_topsecret_single", "絕密"),\n        ],\n    },'''
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''    {\n        "key": "tech_play_mobile",\n        "category": "delta_mobile_basic",\n        "label": "技術陪",\n        "selector_label": "難度 / 陪玩人數",\n        "description": "三角洲手遊技術陪，機密 380T/H、絕密 420T/H。",\n        "variants": [\n            ("basic_mobile_tech_secret_single", "機密｜單陪"),\n            ("basic_mobile_tech_secret_double", "機密｜雙陪"),\n            ("basic_mobile_tech_topsecret_single", "絕密｜單陪"),\n            ("basic_mobile_tech_topsecret_double", "絕密｜雙陪"),\n        ],\n    },''',
              '''    {\n        "key": "tech_play_mobile",\n        "category": "delta_mobile_basic",\n        "label": "技術陪",\n        "selector_label": "難度",\n        "description": "三角洲手遊技術陪；難度與陪玩人數分開選擇。",\n        "variants": [\n            ("basic_mobile_tech_secret_single", "機密"),\n            ("basic_mobile_tech_topsecret_single", "絕密"),\n        ],\n    },'''
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''    {\n        "key": "entertain",\n        "category": "delta_desktop_basic",\n        "label": "娛樂陪",\n        "selector_label": "陪玩人數",\n        "description": "娛樂陪福利累積 10 個服務小時回饋 1 小時，可於達標當單直接折抵。",\n        "variants": [\n            ("basic_entertain_single", "單陪"),\n            ("basic_entertain_double", "雙陪"),\n        ],\n    },''',
              '''    {\n        "key": "entertain",\n        "category": "delta_desktop_basic",\n        "label": "娛樂陪",\n        "selector_label": "陪玩類型",\n        "description": "娛樂陪類型與陪玩人數分開選擇；福利累積 10 個服務小時回饋 1 小時。",\n        "variants": [\n            ("basic_entertain_single", "不限"),\n            ("basic_entertain_female_single", "女陪"),\n            ("basic_entertain_male_single", "男陪"),\n        ],\n    },'''
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''    {\n        "key": "entertain_mobile",\n        "category": "delta_mobile_basic",\n        "label": "娛樂陪",\n        "selector_label": "陪玩人數",\n        "description": "價格與端遊相同；娛樂陪福利累積 10 個服務小時回饋 1 小時，可於達標當單直接折抵。",\n        "variants": [\n            ("basic_mobile_entertain_single", "單陪"),\n            ("basic_mobile_entertain_double", "雙陪"),\n        ],\n    },''',
              '''    {\n        "key": "entertain_mobile",\n        "category": "delta_mobile_basic",\n        "label": "娛樂陪",\n        "selector_label": "陪玩類型",\n        "description": "娛樂陪類型與陪玩人數分開選擇；價格與端遊相同。",\n        "variants": [\n            ("basic_mobile_entertain_single", "不限"),\n            ("basic_mobile_entertain_female_single", "女陪"),\n            ("basic_mobile_entertain_male_single", "男陪"),\n        ],\n    },'''
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''        "selector_label": "陪玩性別／人數",\n        "description": f"{_game_label}限定甜蜜單。",\n        "variants": [\n            (f"{_prefix}_sweet_female_single", "女單陪"),\n            (f"{_prefix}_sweet_male_single", "男單陪"),\n            (f"{_prefix}_sweet_female_double", "女雙陪"),\n            (f"{_prefix}_sweet_male_double", "男雙陪"),\n            (f"{_prefix}_sweet_double_any", "雙陪(不限)"),\n        ],''',
              '''        "selector_label": "陪玩類型",\n        "description": f"{_game_label}限定甜蜜單；陪玩類型與人數分開選擇。",\n        "variants": [\n            (f"{_prefix}_sweet_female", "女陪"),\n            (f"{_prefix}_sweet_male", "男陪"),\n            (f"{_prefix}_sweet_any", "不限"),\n        ],'''
          )
          replace_once(
              'web/app/services/order_groups.py',
              '''            manager_group_label = (\n                str(getattr(rule, "catalog_group_label", "") or "").strip()\n                if rule is not None\n                else ""\n            )\n''',
              '''            manager_group_label = (\n                ""\n                if str(rule_key) in SOURCE_AUTHORITY_RULE_KEYS\n                else (\n                    str(getattr(rule, "catalog_group_label", "") or "").strip()\n                    if rule is not None\n                    else ""\n                )\n            )\n'''
          )

          # The point-benefit bridge no longer patches catalog variants at runtime.
          p = Path('web/app/services/point_benefit_policy_bridge.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def _patch_entertainment_variants')
          end = text.index('def _legacy_service_alias_name', start)
          text = text[:start] + text[end:]
          text = text.replace('    from web.app.services import order_groups\n', '', 1)
          text = text.replace('    _patch_entertainment_variants(order_groups)\n\n', '', 1)
          p.write_text(text, encoding='utf-8')

          # Update old assertions to the now-authoritative direct-source model.
          replace_once(
              'tests/test_game_service_rules.py',
              '        assert sweet["selector_label"] == "陪玩性別／人數"',
              '        assert sweet["selector_label"] == "陪玩類型"'
          )
          replace_once(
              'tests/test_game_service_rules.py',
              '''        ] == [\n            f"{prefix}_sweet_female_single",\n            f"{prefix}_sweet_male_single",\n            f"{prefix}_sweet_female_double",\n            f"{prefix}_sweet_male_double",\n            f"{prefix}_sweet_double_any",\n        ]''',
              '''        ] == [\n            f"{prefix}_sweet_female",\n            f"{prefix}_sweet_male",\n            f"{prefix}_sweet_any",\n        ]'''
          )
          p = Path('tests/test_game_service_rules.py')
          text = p.read_text(encoding='utf-8')
          old_expected = '''    expected = {\n        "basic_tech_secret_single": "機密｜單陪",\n        "basic_tech_secret_double": "機密｜雙陪",\n        "basic_tech_topsecret_single": "絕密｜單陪",\n        "basic_tech_topsecret_double": "絕密｜雙陪",\n        "basic_mobile_tech_secret_single": "機密｜單陪",\n        "basic_mobile_tech_secret_double": "機密｜雙陪",\n        "basic_mobile_tech_topsecret_single": "絕密｜單陪",\n        "basic_mobile_tech_topsecret_double": "絕密｜雙陪",\n        "basic_entertain_single": "單陪",\n        "basic_entertain_double": "雙陪",\n        "basic_mobile_entertain_single": "單陪",\n        "basic_mobile_entertain_double": "雙陪",\n    }'''
          new_expected = '''    expected = {\n        "basic_tech_secret_single": "技術陪〈端遊〉｜機密",\n        "basic_tech_secret_double": "技術陪〈端遊〉｜機密雙陪",\n        "basic_tech_topsecret_single": "技術陪〈端遊〉｜絕密",\n        "basic_tech_topsecret_double": "技術陪〈端遊〉｜絕密雙陪",\n        "basic_mobile_tech_secret_single": "技術陪〈手遊〉｜機密",\n        "basic_mobile_tech_secret_double": "技術陪〈手遊〉｜機密雙陪",\n        "basic_mobile_tech_topsecret_single": "技術陪〈手遊〉｜絕密",\n        "basic_mobile_tech_topsecret_double": "技術陪〈手遊〉｜絕密雙陪",\n        "basic_entertain_single": "娛樂陪〈端遊〉｜不限",\n        "basic_entertain_double": "娛樂陪〈端遊〉｜雙陪",\n        "basic_mobile_entertain_single": "娛樂陪〈手遊〉｜不限",\n        "basic_mobile_entertain_double": "娛樂陪〈手遊〉｜雙陪",\n    }'''
          if old_expected not in text:
              raise SystemExit('missing direct label test block')
          text = text.replace(old_expected, new_expected, 1)
          old_web = '''    ] == [\n        "basic_mobile_tech_secret_single",\n        "basic_mobile_tech_secret_double",\n        "basic_mobile_tech_topsecret_single",\n        "basic_mobile_tech_topsecret_double",\n    ]\n    assert [\n        variant["price"]\n        for variant in mobile_groups["tech_play_mobile"]["variants"]\n    ] == [380, 760, 420, 840]'''
          new_web = '''    ] == [\n        "basic_mobile_tech_secret_single",\n        "basic_mobile_tech_topsecret_single",\n    ]\n    assert [\n        variant["price"]\n        for variant in mobile_groups["tech_play_mobile"]["variants"]\n    ] == [380, 420]'''
          if old_web not in text:
              raise SystemExit('missing web mobile tech expectations')
          text = text.replace(old_web, new_web, 1)
          p.write_text(text, encoding='utf-8')

          # Regression: importing Web services must never mutate shared/base rules again.
          p = Path('tests/test_companion_count_finish_20261028.py')
          text = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_web_service_import_never_rewrites_authoritative_order_rules() -> None:\n    from services.order_rules import get_base_rule\n\n    expected = {\n        "basic_tech_secret_single": "技術陪〈端遊〉｜機密",\n        "basic_entertain_single": "娛樂陪〈端遊〉｜不限",\n        "valorant_sweet_female": "特戰英豪｜甜蜜單｜女陪",\n    }\n    before = {key: get_base_rule(key).label for key in expected}\n\n    import web.app.services  # noqa: F401\n\n    after = {key: get_base_rule(key).label for key in expected}\n    assert before == expected\n    assert after == expected\n\n'''
          if 'test_web_service_import_never_rewrites_authoritative_order_rules' not in text:
              text += addition
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies and run focused regression
        shell: bash
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q -r web/requirements-web.txt
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q services web/app tests
          python -m pytest -q tests/test_companion_count_finish_20261028.py tests/test_game_service_rules.py
      - name: Commit direct-source fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/diagnose_companion_rules_20261029.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/order_rules.py services/orders.py web/app/services/__init__.py web/app/services/order_groups.py web/app/services/point_benefit_policy_bridge.py tests/test_companion_count_finish_20261028.py tests/test_game_service_rules.py
          git commit -m 'Make latest companion rules authoritative at source'
          git push origin HEAD:main
