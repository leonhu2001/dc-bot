name: Canonical regression fixes

on:
  push:
    paths:
      - .github/workflows/canonical_regression_fix_20261029.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply later-approved rules directly and align regression contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Discord catalog/group resolver: migrated built-ins must ignore stale
          # manager group labels so old 單陪/雙陪 metadata cannot come back.
          # ------------------------------------------------------------------
          path = Path('services/orders.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''def _effective_builtin_group_label(rule, fallback: str) -> str:
              manager_label = str(
                  getattr(rule, "catalog_group_label", "")
                  or ""
              ).strip()
              return manager_label or str(fallback)
          ''',
              '''def _effective_builtin_group_label(rule, fallback: str) -> str:
              # 後來核准的「規格與人數分離」是這批內建商品的結構規則。
              # 舊 manager catalog_group_label 不能再把它們合併、改名或重新帶回
              # 單陪／雙陪；自訂商品仍照後台分組設定運作。
              rule_key = str(getattr(rule, "key", "") or "") if rule is not None else ""
              if rule_key in CANONICAL_DETAIL_LABEL_RULE_KEYS:
                  return str(fallback)

              manager_label = str(
                  getattr(rule, "catalog_group_label", "")
                  or ""
              ).strip()
              return manager_label or str(fallback)
          ''',
              'canonical group resolver',
          )

          # Latest approved LoL ordering: mode first, headcount is separate.
          for tier in ('entertain', 'master', 'grandmaster', 'elite'):
              group_label = {
                  'entertain': '娛樂陪',
                  'master': '大師陪',
                  'grandmaster': '宗師陪',
                  'elite': '菁英陪',
              }[tier]
              aram_key = f'lol_{tier}_aram'
              ng_key = f'lol_{tier}_ng'
              ranked_key = f'lol_{tier}_ranked'
              old = f'''        {{"label": "{group_label}", "details": [
                      {{"label": "AR", "value": "aram", "rule_key": "{aram_key}", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24}},
                      {{"label": "NG", "value": "ng", "rule_key": "{ng_key}", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24}},
                      {{"label": "RK", "value": "ranked", "rule_key": "{ranked_key}", "quantity_unit": "局", "min_quantity": 1, "max_quantity": 24}},
                  ]}},'''
              new = f'''        {{"label": "{group_label}", "details": [
                      {{"label": "NG", "value": "ng", "rule_key": "{ng_key}", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24}},
                      {{"label": "RK", "value": "ranked", "rule_key": "{ranked_key}", "quantity_unit": "局", "min_quantity": 1, "max_quantity": 24}},
                      {{"label": "AR", "value": "aram", "rule_key": "{aram_key}", "quantity_unit": "小時", "min_quantity": 1, "max_quantity": 24}},
                  ]}},'''
              text = replace_once(text, old, new, f'lol {tier} order')

          # Legacy Black Tide keys are lookup-only compatibility and never public rows.
          text = replace_once(
              text,
              '''    "basic_sweet_double",
              "farm_season_3x3_skin",
          ''',
              '''    "basic_sweet_double",
              "basic_black_tide_entertain_1",
              "basic_black_tide_entertain_2",
              "basic_black_tide_entertain_3",
              "basic_black_tide_entertain_4",
              "basic_black_tide_tech_1",
              "basic_black_tide_tech_2",
              "basic_black_tide_tech_3",
              "basic_black_tide_tech_4",
              "farm_season_3x3_skin",
          ''',
              'hide black tide legacy keys',
          )
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Historical Black Tide fixed-seat rules live directly in source.
          # ------------------------------------------------------------------
          path = Path('services/order_rules.py')
          text = path.read_text(encoding='utf-8')
          marker = '''_add(OrderRule(
              "delta_desktop_basic", "basic_black_tide_tech", "黑潮爆破｜技術陪", "hourly", 400, "H",
              allowed_roles=PROTECTOR_ROLES, required_game_roles=DELTA_DESKTOP_GAME_ROLE,
              required_staff_count="player_count", player_count_enabled=True, min_player_count=1, max_player_count=4,
              price_multiply_player_count=False, player_count_prices={1: 400, 2: 760, 3: 1140, 4: 1520},
              allow_specify=True, max_specified_count=4, specify_fee_default=100,
              specify_fee_by_role=_protectors_fee(), specify_free_min_units=2, specify_free_basis="quantity",
          ))
          '''
          legacy = marker + '''

          # 舊 Black Tide 1～4 人 key 只供已建立訂單／快照回查；新 catalog 不使用。
          for _key, _label, _price, _staff_count, _roles, _loyalty in (
              ("basic_black_tide_entertain_1", "黑潮爆破｜娛樂單陪", 320, 1, COMPANION_ROLES, True),
              ("basic_black_tide_entertain_2", "黑潮爆破｜娛樂雙陪", 600, 2, COMPANION_ROLES, True),
              ("basic_black_tide_entertain_3", "黑潮爆破｜娛樂三陪", 900, 3, COMPANION_ROLES, True),
              ("basic_black_tide_entertain_4", "黑潮爆破｜娛樂四陪", 1200, 4, COMPANION_ROLES, True),
              ("basic_black_tide_tech_1", "黑潮爆破｜技術單陪", 400, 1, PROTECTOR_ROLES, False),
              ("basic_black_tide_tech_2", "黑潮爆破｜技術雙陪", 760, 2, PROTECTOR_ROLES, False),
              ("basic_black_tide_tech_3", "黑潮爆破｜技術三陪", 1140, 3, PROTECTOR_ROLES, False),
              ("basic_black_tide_tech_4", "黑潮爆破｜技術四陪", 1520, 4, PROTECTOR_ROLES, False),
          ):
              _add(OrderRule(
                  "delta_desktop_basic", _key, _label, "hourly", _price, "H",
                  allowed_roles=_roles, required_game_roles=DELTA_DESKTOP_GAME_ROLE,
                  required_staff_count=_staff_count,
                  allow_specify=True, max_specified_count=_staff_count,
                  specify_fee_default=100,
                  specify_fee_by_role={role: 100 for role in _roles},
                  specify_free_min_units=2, specify_free_basis="quantity",
                  loyalty_benefits_enabled=_loyalty,
              ))
          '''
          text = replace_once(text, marker, legacy, 'black tide legacy source rules')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Point-service policy: game categories keep cash/free-specify benefits,
          # but service add-time/add-game remains disabled, directly by category.
          # ------------------------------------------------------------------
          path = Path('services/multi_seat_order_policy_20261028.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''def is_service_point_benefit_enabled(rule) -> bool:
              key = str(getattr(rule, "key", "") or "")
              return bool(SERVICE_POINT_BENEFIT_RULE_OVERRIDES.get(key, True))
          ''',
              '''def is_service_point_benefit_enabled(rule) -> bool:
              key = str(getattr(rule, "key", "") or "")
              if key in SERVICE_POINT_BENEFIT_RULE_OVERRIDES:
                  return bool(SERVICE_POINT_BENEFIT_RULE_OVERRIDES[key])
              return str(getattr(rule, "category", "") or "") not in {"lol", "valorant", "apex"}
          ''',
              'service point category policy',
          )
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Loyalty: Black Tide entertainment shares the same desktop pool.
          # ------------------------------------------------------------------
          path = Path('services/loyalty_benefits.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    "basic_entertain_male_double": "basic_entertain",
              "basic_mobile_entertain_single": "basic_mobile_entertain",
          '''
          replacement = '''    "basic_entertain_male_double": "basic_entertain",
              "basic_black_tide_entertain": "basic_entertain",
              "basic_black_tide_entertain_1": "basic_entertain",
              "basic_black_tide_entertain_2": "basic_entertain",
              "basic_black_tide_entertain_3": "basic_entertain",
              "basic_black_tide_entertain_4": "basic_entertain",
              "basic_mobile_entertain_single": "basic_mobile_entertain",
          '''
          text = replace_once(text, anchor, replacement, 'black tide loyalty family')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Regression files: old expectations are superseded by later-approved
          # prices and the canonical 3-option Discord sweet selector.
          # ------------------------------------------------------------------
          path = Path('tests/test_apex_pricing_20261012.py')
          text = path.read_text(encoding='utf-8')
          for old, new in (
              ('"apex_master_ng": 500,', '"apex_master_ng": 480,'),
              ('"apex_master_ranked": 550,', '"apex_master_ranked": 530,'),
              ('"apex_predator_ng": 600,', '"apex_predator_ng": 580,'),
              ('"apex_predator_ranked": 650,', '"apex_predator_ranked": 630,'),
              ('def test_apex_double_predator_ranked_two_hours_costs_2600():', 'def test_apex_double_predator_ranked_two_hours_costs_2520():'),
              ('assert result.base_amount == 2600', 'assert result.base_amount == 2520'),
              ('assert result.total_amount == 2600', 'assert result.total_amount == 2520'),
          ):
              if old not in text:
                  raise SystemExit(f'apex test anchor missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_game_service_rules.py')
          text = path.read_text(encoding='utf-8')
          for old, new in (
              ('assert tier_rule.price == 400', 'assert tier_rule.price == 370'),
              ('assert tier_result.base_amount == 6400', 'assert tier_result.base_amount == 5920'),
              ('"valorant_ascendant_ng": ("hourly", 340, "H")', '"valorant_ascendant_ng": ("hourly", 330, "H")'),
              ('"valorant_ascendant_ranked": ("game", 300, "局")', '"valorant_ascendant_ranked": ("game", 290, "局")'),
              ('"valorant_immortal_ng": ("hourly", 360, "H")', '"valorant_immortal_ng": ("hourly", 350, "H")'),
              ('"valorant_immortal_ranked": ("game", 350, "局")', '"valorant_immortal_ranked": ("game", 330, "局")'),
              ('"valorant_radiant_ng": ("hourly", 400, "H")', '"valorant_radiant_ng": ("hourly", 380, "H")'),
              ('"valorant_radiant_ranked": ("game", 400, "局")', '"valorant_radiant_ranked": ("game", 370, "局")'),
              ('"lol_grandmaster_ranked": ("game", 350, "局")', '"lol_grandmaster_ranked": ("game", 300, "局")'),
          ):
              if old not in text:
                  raise SystemExit(f'game service price test anchor missing: {old}')
              text = text.replace(old, new, 1)

          old = '''        assert [item["label"] for item in details] == [
                      "女單陪",
                      "男單陪",
                      "女雙陪",
                      "男雙陪",
                      "雙陪(不限)",
                  ]
                  assert [item["rule_key"] for item in details] == [
                      f"{prefix}_sweet_female_single",
                      f"{prefix}_sweet_male_single",
                      f"{prefix}_sweet_female_double",
                      f"{prefix}_sweet_male_double",
                      f"{prefix}_sweet_double_any",
                  ]
          '''
          new = '''        assert [item["label"] for item in details] == ["女陪", "男陪", "不限"]
                  assert [item["rule_key"] for item in details] == [
                      f"{prefix}_sweet_female",
                      f"{prefix}_sweet_male",
                      f"{prefix}_sweet_any",
                  ]
          '''
          text = replace_once(text, old, new, 'discord sweet current contract')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests/test_apex_pricing_20261012.py tests/test_game_service_rules.py
          git commit -m "Make later companion rules authoritative in source"
          git push origin HEAD:main
