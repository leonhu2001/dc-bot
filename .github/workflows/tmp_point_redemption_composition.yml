name: Temporary point redemption composition patch

on:
  push:
    branches:
      - refactor/point-redemption-composition-20261018

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/point-redemption-composition-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r web/requirements-web.txt
      - name: Apply bounded composition refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path('bot.py')
          text = bot.read_text(encoding='utf-8')
          old_import = 'from services.order_dispatch_composition import configure_order_dispatch_composition\n'
          new_import = 'from services.order_child_composition import configure_order_children\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)
          old_call = 'configure_order_dispatch_composition(\n    BOOSTER_RECEIVER_ROLE_ID, DISPATCH_CHANNEL_ID, ORDER_CLAIMS, SELF_SERVICE_ORDER_SELECTIONS\n)'
          new_call = 'configure_order_children(\n    BOOSTER_RECEIVER_ROLE_ID, DISPATCH_CHANNEL_ID, ORDER_CLAIMS, SELF_SERVICE_ORDER_SELECTIONS,\n    CUSTOMER_REWARDS,\n)'
          assert text.count(old_call) == 1
          text = text.replace(old_call, new_call, 1)
          bot.write_text(text, encoding='utf-8')
          runtime = Path('services/order_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          configure_line = '    configure_order_point_redemption,\n'
          assert text.count(configure_line) == 1
          text = text.replace(configure_line, '', 1)
          start = text.index('    redemption_keys = {')
          end = text.index('    payment_keys = {', start)
          text = text[:start] + text[end:]
          runtime.write_text(text, encoding='utf-8')
          Path('.github/workflows/tmp_point_redemption_composition.yml').unlink()
          PY
      - name: Validate focused boundary
        env:
          WEB_SECRET_KEY: test-secret
          WEB_BASE_URL: http://localhost:8000
        run: |
          python -m compileall -q bot.py services tests
          python -m pytest -q tests/test_order_child_composition.py tests/test_order_dispatch_composition.py tests/test_order_runtime_dependency_boundary.py tests/test_architecture_growth_budget.py
      - name: Commit bounded refactor
        run: |
          git config user.name leonhu2001
          git config user.email leonhu2001@gmail.com
          git add -A
          git commit -m "Move point redemption wiring out of legacy order runtime"
          git push origin HEAD:refactor/point-redemption-composition-20261018
