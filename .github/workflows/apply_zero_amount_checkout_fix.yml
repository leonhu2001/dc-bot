name: Apply zero-amount checkout fix

on:
  push:
    branches:
      - fix/zero-amount-checkout-20261014

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/zero-amount-checkout-20261014
      - name: Apply fix
        run: python tools/_tmp_apply_zero_amount_checkout_fix.py
      - name: Commit patched runtime and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/_tmp_apply_zero_amount_checkout_fix.py
          git rm .github/workflows/apply_zero_amount_checkout_fix.yml
          git add services/order_payment_policy.py services/order_payment_runtime.py services/order_lifecycle_runtime.py services/rewards.py tests/test_zero_amount_checkout.py tests/golden/test_critical_runtime_flows.py
          git commit -m "Allow zero-amount orders to complete checkout"
          git push origin HEAD:fix/zero-amount-checkout-20261014
